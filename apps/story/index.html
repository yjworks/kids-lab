<!DOCTYPE html>
<html lang="ko" data-db-app="kids-lab" data-db-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>이야기 만들기</title>
<link rel="stylesheet" href="../../shared/app.css">
<style>
  .pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
  .pick-grid button { background: #fff; border-radius: 20px; padding: 14px 6px; font-size: 54px; box-shadow: 0 5px 0 rgba(0,0,0,.08); }
  .pick-grid button small { display: block; font-size: 17px; font-weight: 800; color: #444; word-break: keep-all; }
  @media (hover: hover) { .pick-grid button:hover { transform: scale(1.05); } }
  .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .ep-grid button { background: #fff; border-radius: 22px; padding: 16px 10px; box-shadow: 0 5px 0 rgba(0,0,0,.08); font-weight: 900; font-size: 19px; }
  .ep-grid button .ic { display: block; font-size: 54px; margin-bottom: 6px; }
  .ep-grid button small { display: block; font-size: 14px; color: #777; font-weight: 700; margin-top: 4px; word-break: keep-all; }
  .lv-list { display: grid; gap: 12px; max-width: 620px; margin: 0 auto; }
  .lv-list button { background: #fff; border-radius: 22px; padding: 16px 18px; box-shadow: 0 5px 0 rgba(0,0,0,.08); text-align: left; font-weight: 900; font-size: 21px; display: flex; gap: 14px; align-items: center; }
  .lv-list button .ic { font-size: 44px; }
  .lv-list button small { display: block; font-size: 15px; color: #666; font-weight: 700; margin-top: 2px; }
  .write { max-width: 620px; margin: 0 auto; display: grid; gap: 10px; }
  .write label { font-weight: 900; font-size: 19px; }
  .write input { width: 100%; font-size: 22px; padding: 12px 14px; border-radius: 14px; border: 3px solid #e2c99a; font-family: inherit; user-select: text; -webkit-user-select: text; }
  .write .ex { font-size: 15px; color: #777; margin-top: -4px; }
  .book { background: #fffdf5; border: 6px solid #e2c99a; border-radius: 20px; padding: 26px; font-size: 26px; line-height: 1.7; box-shadow: 0 10px 30px rgba(0,0,0,.1); }
  .book .scene { font-size: 64px; text-align: center; margin-bottom: 10px; word-break: break-all; }
  .book .ttl { text-align: center; font-weight: 900; color: #8a5a00; margin-bottom: 8px; }
  .book p { margin: 0 0 12px; word-break: keep-all; }
  .book p.cur { background: #fff3c4; border-radius: 10px; }
  .steps { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
  .steps i { width: 36px; height: 10px; border-radius: 5px; background: #ddd; }
  .steps i.on { background: #ffca3a; }
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .shelf button { background: #fff; border-radius: 18px; padding: 14px; text-align: left; box-shadow: 0 5px 0 rgba(0,0,0,.08); font-weight: 800; }
  .shelf .sc { font-size: 34px; word-break: break-all; }
  @media (max-width: 760px) {
    .book { padding: 16px; font-size: 20px; } .book .scene { font-size: 44px; }
    .pick-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); } .pick-grid button { font-size: 44px; }
    .ep-grid { grid-template-columns: repeat(2, 1fr); } .lv-list button { font-size: 18px; }
  }
</style>
</head>
<body data-app="story">
<main id="main"></main>
<script src="../../shared/kid.js"></script>
<script>
(function () {
  var K = KidLab, el = K.el;
  K.header({ title: '이야기 만들기', icon: '📖', say: '이야기 만들기' });
  var main = document.getElementById('main');
  function J(w, pair) { return w + K.josa(w, pair); }

  /* ---------- 카드 묶음 ---------- */
  var HEROES = [['🐰', '토끼'], ['🐻', '곰'], ['🦊', '여우'], ['🐸', '개구리'], ['🤖', '로봇'], ['👧', '소녀'], ['👦', '소년'], ['🦄', '유니콘'], ['🐉', '아기 용'], ['🐧', '펭귄'], ['🐱', '고양이'], ['🦖', '공룡']];
  var SOLVE = [['🤝', '힘을 모아 해냈어요'], ['💡', '좋은 생각이 떠올랐어요'], ['🎵', '노래를 불렀더니 모두 웃었어요'], ['🙏', '"도와줘"라고 용기 내어 말했어요'], ['🔍', '차근차근 찾아봤어요'], ['❤️', '따뜻한 마음으로 안아 줬어요'], ['✨', '마법의 물건을 사용했어요']];

  /* 이야기 종류. steps의 id로 고른 카드를 부르고, short는 짧은 이야기에 쓰는 단계.
     lines(p, h)는 줄 목록을 돌려준다. p[id] = [그림, 이름], h = { H: 주인공 부르는 이름, intro: '…가', said: 대사 } */
  var EPS = [
    { id: 'adv', ic: '🗺️', t: '신나는 모험', d: '떠나서 친구를 만나요',
      steps: [
        { id: 'hero', q: '주인공을 골라요', o: HEROES },
        { id: 'place', q: '어디로 갈까요?', o: [['🏰', '성'], ['🌲', '숲'], ['🏖️', '바닷가'], ['🚀', '우주'], ['🏫', '유치원'], ['🏠', '우리 집'], ['🎪', '서커스'], ['🏔️', '산꼭대기'], ['🌋', '화산 옆'], ['🏝️', '무인도']] },
        { id: 'friend', q: '누구를 만날까요?', o: [['🐶', '강아지'], ['🦋', '나비'], ['🐢', '거북이'], ['👵', '할머니'], ['🧚', '요정'], ['🐦', '작은 새'], ['🐙', '문어'], ['👾', '외계인'], ['🐝', '꿀벌'], ['🦁', '사자']] },
        { id: 'item', q: '무엇을 찾았을까요?', o: [['🎈', '풍선'], ['🔑', '황금 열쇠'], ['🧁', '컵케이크'], ['⭐', '떨어진 별'], ['🎁', '선물 상자'], ['🗺️', '보물 지도'], ['✨', '마법 지팡이'], ['🎸', '기타'], ['🧸', '곰 인형'], ['🌂', '무지개 우산']] },
        { id: 'prob', q: '어떤 일이 생겼을까요?', o: [['🌧️', '갑자기 비가 쏟아졌어요'], ['😢', '길을 잃어버렸어요'], ['🐺', '무서운 늑대가 나타났어요'], ['🕳️', '커다란 구멍에 빠졌어요'], ['🍎', '배가 너무 고팠어요'], ['🔒', '문이 잠겨 있었어요'], ['💨', '바람에 모자가 날아갔어요'], ['😴', '친구가 잠들어 버렸어요']] },
        { id: 'sol', q: '어떻게 해결했을까요?', o: SOLVE.concat([['🏃', '열심히 달렸어요']]) }
      ],
      short: ['hero', 'place', 'prob', 'sol'],
      said: '"안녕! 같이 놀자!"',
      lines: function (p, h) {
        var L = ['옛날 옛적에 ' + h.intro + ' 살았어요. ' + p.hero[0],
          '어느 날 ' + J(h.H, '은/는') + ' ' + J(p.place[1], '으로/로') + ' 모험을 떠났어요. ' + p.place[0]];
        if (p.friend) L.push(p.place[1] + '에서 ' + J(p.friend[1], '을/를') + ' 만났어요. ' + h.said + ' ' + p.friend[0]);
        if (p.item) L.push((p.friend ? '둘은 함께 ' : '') + J(p.item[1], '을/를') + ' 발견했어요! ' + p.item[0]);
        L.push('그런데 ' + p.prob[1].replace(/요$/, '요.') + ' ' + p.prob[0]);
        L.push((p.friend ? J(h.H, '과/와') + ' ' + J(p.friend[1], '은/는') : J(h.H, '은/는')) + ' ' + p.sol[1] + '. ' + p.sol[0]);
        return L;
      },
      ends: ['그리고 모두 함께 맛있는 저녁을 먹었어요. 🍽️', '그날 밤, 별을 보며 잠이 들었어요. 🌙', '둘은 가장 친한 친구가 되었어요. 💕', '그 뒤로 매일매일 신나게 놀았대요. 🎉', '집에 돌아와 엄마에게 이야기를 들려줬어요. 🏠', '다음 모험을 기다리며 웃었어요. 😊'] },

    { id: 'space', ic: '🚀', t: '우주 탐험', d: '별나라에 가요',
      steps: [
        { id: 'hero', q: '누가 우주에 갈까요?', o: HEROES },
        { id: 'ship', q: '무엇을 타고 갈까요?', o: [['🚀', '로켓'], ['🛸', '비행접시'], ['🎈', '우주 풍선'], ['🛰️', '인공위성'], ['🚂', '별빛 기차']] },
        { id: 'planet', q: '어디에 내릴까요?', o: [['🌙', '달'], ['🔴', '화성'], ['⭐', '별나라'], ['🍭', '사탕 행성'], ['❄️', '얼음 행성'], ['🌈', '무지개 행성']] },
        { id: 'friend', q: '누구를 만날까요?', o: [['👽', '외계인'], ['🤖', '로봇 강아지'], ['🐙', '우주 문어'], ['🧚', '별 요정'], ['🐰', '달토끼']] },
        { id: 'prob', q: '어떤 일이 생겼을까요?', o: [['⛽', '연료가 다 떨어졌어요'], ['☄️', '별똥별이 쏟아졌어요'], ['📡', '지구와 연락이 끊겼어요'], ['🌀', '블랙홀이 로켓을 끌어당겼어요'], ['🥶', '너무너무 추웠어요']] },
        { id: 'sol', q: '어떻게 해결했을까요?', o: [['🔧', '로켓을 뚝딱뚝딱 고쳤어요'], ['🧭', '별자리를 보고 길을 찾았어요']].concat(SOLVE.slice(0, 4)) }
      ],
      short: ['hero', 'planet', 'prob', 'sol'],
      said: '"지구에서 왔니? 반가워!"',
      lines: function (p, h) {
        var L = ['옛날 옛적에 우주를 꿈꾸는 ' + h.intro + ' 살았어요. ' + p.hero[0],
          (p.ship ? J(h.H, '은/는') + ' ' + J(p.ship[1], '을/를') + ' 타고 ' : '어느 날 ' + J(h.H, '은/는') + ' ') + '하늘 높이 날아올랐어요. 슝! ' + (p.ship ? p.ship[0] : '🚀'),
          '도착한 곳은 ' + J(p.planet[1], '이었어요/였어요') + '. ' + p.planet[0]];
        if (p.friend) L.push(p.planet[1] + '에서 ' + J(p.friend[1], '을/를') + ' 만났어요. ' + h.said + ' ' + p.friend[0]);
        L.push('그런데 ' + p.prob[1] + '. ' + p.prob[0]);
        L.push((p.friend ? J(h.H, '과/와') + ' ' + J(p.friend[1], '은/는') : J(h.H, '은/는')) + ' ' + p.sol[1] + '. ' + p.sol[0]);
        return L;
      },
      ends: ['무사히 지구로 돌아와 창밖의 별을 보며 잠들었어요. 🌙', '우주 친구와 다시 만나기로 약속했어요. 💫', '우주에서 찍은 사진을 친구들에게 보여 줬어요. 📸', '다음에는 더 먼 별에 가 보기로 했어요. 🌟'] },

    { id: 'sea', ic: '🌊', t: '바닷속 여행', d: '깊은 바다를 구경해요',
      steps: [
        { id: 'hero', q: '누가 바다에 갈까요?', o: HEROES },
        { id: 'ride', q: '무엇을 타고 갈까요?', o: [['🐬', '돌고래'], ['🐢', '바다거북'], ['🐳', '커다란 고래'], ['🚤', '작은 보트']] },
        { id: 'place', q: '어디에 가 볼까요?', o: [['🐚', '조개 마을'], ['🏰', '인어 궁전'], ['🌿', '해초 숲'], ['🐠', '산호초'], ['💰', '가라앉은 보물선']] },
        { id: 'friend', q: '누구를 만날까요?', o: [['🐙', '문어'], ['🦀', '꽃게'], ['🐡', '복어'], ['🧜', '인어'], ['🦑', '오징어'], ['🐠', '열대어']] },
        { id: 'prob', q: '어떤 일이 생겼을까요?', o: [['🌀', '커다란 소용돌이가 몰려왔어요'], ['🌑', '바닷속이 갑자기 캄캄해졌어요'], ['🗑️', '쓰레기가 바다를 더럽혔어요'], ['🦈', '배고픈 상어가 다가왔어요'], ['🎣', '친구가 낚싯줄에 걸렸어요']] },
        { id: 'sol', q: '어떻게 해결했을까요?', o: [['🧹', '쓰레기를 함께 주웠어요'], ['🔦', '반짝이는 해파리가 길을 비춰 줬어요'], ['✂️', '조심조심 줄을 끊어 줬어요']].concat(SOLVE.slice(0, 4)) }
      ],
      short: ['hero', 'place', 'prob', 'sol'],
      said: '"바닷속에 온 걸 환영해!"',
      lines: function (p, h) {
        var L = ['옛날 옛적에 바다를 좋아하는 ' + h.intro + ' 살았어요. ' + p.hero[0],
          J(h.H, '은/는') + ' ' + (p.ride ? J(p.ride[1], '을/를') + ' 타고 ' : '') + '바닷속으로 풍덩 들어갔어요. ' + (p.ride ? p.ride[0] : '🌊'),
          '반짝반짝 ' + p.place[1] + '에 도착했어요. ' + p.place[0]];
        if (p.friend) L.push('거기서 ' + J(p.friend[1], '을/를') + ' 만났어요. ' + h.said + ' ' + p.friend[0]);
        L.push('그런데 ' + p.prob[1] + '. ' + p.prob[0]);
        L.push((p.friend ? J(h.H, '과/와') + ' ' + J(p.friend[1], '은/는') : J(h.H, '은/는')) + ' ' + p.sol[1] + '. ' + p.sol[0]);
        return L;
      },
      ends: ['바다 친구들이 고맙다며 예쁜 조개를 선물했어요. 🐚', '물 위로 올라오니 노을이 반짝였어요. 🌅', '그 뒤로 바다를 깨끗하게 지키기로 약속했어요. 💙', '다음 여름에 또 놀러 오기로 했어요. 🏖️'] },

    { id: 'party', ic: '🎂', t: '생일 파티', d: '친구의 생일을 축하해요',
      steps: [
        { id: 'hero', q: '주인공을 골라요', o: HEROES },
        { id: 'friend', q: '누구의 생일일까요?', o: [['🐶', '강아지'], ['🐼', '판다'], ['🐥', '병아리'], ['🐨', '코알라'], ['👵', '할머니'], ['🦁', '사자']] },
        { id: 'gift', q: '어떤 선물을 준비할까요?', o: [['🧸', '곰 인형'], ['📚', '그림책'], ['🎨', '물감'], ['⚽', '축구공'], ['💐', '꽃다발'], ['✉️', '손 편지']] },
        { id: 'food', q: '무엇을 먹을까요?', o: [['🍰', '딸기 케이크'], ['🍕', '피자'], ['🍩', '도넛'], ['🍪', '쿠키'], ['🍉', '수박']] },
        { id: 'prob', q: '어떤 일이 생겼을까요?', o: [['🎂', '케이크를 떨어뜨렸어요'], ['🎈', '풍선이 모두 날아가 버렸어요'], ['🔌', '갑자기 불이 꺼졌어요'], ['⏰', '선물을 집에 두고 왔어요'], ['😢', '생일인 친구가 울음을 터뜨렸어요']] },
        { id: 'sol', q: '어떻게 해결했을까요?', o: [['🍓', '과일로 새 케이크를 만들었어요'], ['🕯️', '촛불을 켜고 노래를 불렀어요'], ['🎨', '그림 선물을 그려 줬어요']].concat(SOLVE.slice(0, 4)) }
      ],
      short: ['hero', 'friend', 'prob', 'sol'],
      said: '"생일 축하해! 너는 나의 소중한 친구야!"',
      lines: function (p, h) {
        var L = ['옛날 옛적에 ' + h.intro + ' 살았어요. ' + p.hero[0],
          '오늘은 ' + p.friend[1] + '의 생일이에요! ' + p.friend[0]];
        if (p.gift) L.push(J(h.H, '은/는') + ' 선물로 ' + J(p.gift[1], '을/를') + ' 준비했어요. ' + p.gift[0]);
        L.push(J(h.H, '은/는') + ' ' + p.friend[1] + '에게 말했어요. ' + h.said + ' 🎉');
        if (p.food) L.push('식탁에는 ' + J(p.food[1], '이/가') + ' 가득했어요. ' + p.food[0]);
        L.push('그런데 ' + p.prob[1] + '. ' + p.prob[0]);
        L.push(J(h.H, '은/는') + ' ' + p.sol[1] + '. ' + p.sol[0]);
        return L;
      },
      ends: ['모두 함께 "생일 축하합니다" 노래를 불렀어요. 🎶', '가장 행복한 생일이었다고 친구가 말했어요. 💕', '파티가 끝나고 다 같이 사진을 찍었어요. 📸', '다음 생일에도 꼭 함께하자고 약속했어요. 🤙'] },

    { id: 'detective', ic: '🔍', t: '꼬마 탐정', d: '사라진 물건을 찾아요',
      steps: [
        { id: 'hero', q: '꼬마 탐정은 누구일까요?', o: HEROES },
        { id: 'lost', q: '무엇이 사라졌을까요?', o: [['🧸', '곰 인형'], ['👑', '반짝이 왕관'], ['🍪', '쿠키 통'], ['🔑', '보물 상자 열쇠'], ['🎩', '마술 모자'], ['🧦', '양말 한 짝']] },

      el('button', { class: 'kl-btn green', text: '💾 책장에 넣기', onclick: function (e) {
        var b = e.currentTarget; if (b.disabled) return; b.disabled = true;
        K.mutate(function (d) { d.stories = d.stories || []; d.stories.push({ t: Date.now(), ep: story.ep, lv: story.lv, picks: story.picks, name: story.name || '', said: story.said || '', ending: story.ending }); if (d.stories.length > 30) d.stories.shift(); });
        K.addStar(story.lv === 3 ? 3 : 2); K.event('save'); K.sfx.win(); K.confetti(); K.speak('이야기를 책장에 넣었어요'); b.textContent = '✔ 책장에 넣었어요';
      } }),
      el('button', { class: 'kl-btn', text: '🔀 끝 바꾸기', onclick: function () { var ns = {}; for (var k in story) ns[k] = story[k]; ns.ending = K.pick(ep.ends.filter(function (x) { return x !== story.ending; })); show(ns); } }),
      el('button', { class: 'kl-btn primary', text: '✨ 새 이야기', onclick: pickEp })
    ]));
    setTimeout(read, 400);
  }
  function shelf() {
    main.innerHTML = ''; main.appendChild(K.backButton(home));
    var d = K.data(); var list = (d.stories || []).map(normalize);
    main.appendChild(el('div', { class: 'kl-prompt', text: '📚 내 책장' }));
    if (!list.length) { main.appendChild(el('div', { class: 'kl-hint', text: '아직 책이 없어요. 이야기를 만들고 책장에 넣어요!' })); return; }
    var g = el('div', { class: 'shelf' });
    list.slice().reverse().forEach(function (s) {
      var ep = EP[s.ep] || EP.adv;
      var em = ep.steps.filter(function (x) { return s.picks[x.id]; }).map(function (x) { return s.picks[x.id][0]; }).join('');
      var b = el('button', { html: '<div class="sc">' + em + '</div><div>' + ep.ic + ' ' + K.esc(ep.t) + ' · ' + K.esc(s.name || (s.picks.hero ? s.picks.hero[1] : '')) + '</div><small style="color:#888">' + new Date(s.t).toLocaleDateString('ko-KR') + '</small>' });
      b.addEventListener('click', function () { K.sfx.click(); show(s); });
      g.appendChild(b);
    });
    main.appendChild(g);
  }
  /* 검사용: 모든 종류·단계의 문장을 만들어 볼 수 있게 */
  window.KidStory = { EPS: EPS, stepsOf: stepsOf, compose: compose };
  home();
})();
</script>
