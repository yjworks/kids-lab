<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>가게 놀이</title>
<link rel="stylesheet" href="../../shared/app.css">
<style>
  .coin { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 900; color: #5a3d00; margin: 4px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.15), 0 3px 4px rgba(0,0,0,.2); font-size: 16px; }
  .c10 { width: 44px; height: 44px; background: #d7a06b; } .c50 { width: 50px; height: 50px; background: #d9d9d9; } .c100 { width: 58px; height: 58px; background: #e6e6e6; } .c500 { width: 66px; height: 66px; background: #f0f0f0; }
  .b1000 { display: inline-flex; align-items: center; justify-content: center; width: 120px; height: 56px; background: #9bc1e6; border-radius: 8px; font-weight: 900; color: #123; margin: 4px; border: 2px solid #5a86b3; }
  .wallet { background: #fff3c4; border-radius: 20px; padding: 14px; text-align: center; min-height: 90px; }
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .item { background: #fff; border-radius: 20px; padding: 12px; text-align: center; box-shadow: 0 5px 0 rgba(0,0,0,.08); font-weight: 800; }
  .item .e { font-size: 50px; }
  .item.sel { outline: 5px solid #ffca3a; }
  .paybox { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 12px 0; }
  .paybox button { background: #fff; border-radius: 20px; padding: 8px 12px; box-shadow: 0 4px 0 rgba(0,0,0,.1); }
  .paid { min-height: 80px; background: #f7f7f7; border-radius: 16px; padding: 8px; text-align: center; }
</style>
</head>
<body data-app="shop">
<main id="main"></main>
<script src="../../shared/kid.js"></script>
<script>
(function () {
  var K = KidLab, el = K.el;
  K.header({ title: '가게 놀이', icon: '🛒', say: '가게 놀이' });
  var main = document.getElementById('main');
  var MONEY = [[10, 'c10'], [50, 'c50'], [100, 'c100'], [500, 'c500'], [1000, 'b1000']];
  var GOODS = [['🍎', '사과', 500], ['🍌', '바나나', 300], ['🥛', '우유', 1000], ['🍪', '쿠키', 200], ['🍬', '사탕', 100], ['🧃', '주스', 800], ['🍞', '빵', 1500], ['🍦', '아이스크림', 700], ['🧸', '인형', 2000], ['🖍️', '크레파스', 1200], ['⚽', '공', 1800], ['📒', '공책', 400]];
  function money(v, cls) { return cls === 'b1000' ? '<span class="b1000">1000원</span>' : '<span class="coin ' + cls + '">' + v + '</span>'; }
  function coinsHTML(list) { return list.map(function (m) { return money(m[0], m[1]); }).join(''); }
  function makeAmount(total, allowed) { var list = []; var rem = total; allowed.slice().reverse().forEach(function (m) { while (rem >= m[0]) { list.push(m); rem -= m[0]; } }); return list; }
  function fmt(n) { return n.toLocaleString('ko-KR') + '원'; }
  function home() {
    main.innerHTML = '';
    K.menu(main, [
      { icon: '🪙', label: '돈 알아보기', color: '#fff3c4', run: learn },
      { icon: '🧮', label: '얼마일까?', mode: 'count', color: '#e9f3ff', run: countQuiz },
      { icon: '🛒', label: '물건 사기', mode: 'buy', color: '#e3f7cf', run: buyGame },
      { icon: '💰', label: '살 수 있을까?', mode: 'afford', color: '#ffe9ee', run: affordQuiz },
      { icon: '🔄', label: '거스름돈', mode: 'change', color: '#ece6f5', run: changeQuiz }
    ]);
  }
  function quiz(mode, total, make) { main.innerHTML = ''; main.appendChild(K.backButton(home)); var box = el('div'); main.appendChild(box); K.runQuiz({ el: box, mode: mode, total: total, make: make, onFinish: home }); }
  function learn() {
    main.innerHTML = ''; main.appendChild(K.backButton(home));
    var g = el('div', { class: 'kl-menu' });
    MONEY.forEach(function (m) { var b = el('button', { class: 'kl-menu-item', html: money(m[0], m[1]) + '<div class="kl-menu-label">' + fmt(m[0]) + '</div><div style="font-size:15px;color:#777">' + (m[0] === 1000 ? '지폐' : '동전') + ' · ' + { 10: '10원 열 개 = 100원', 50: '50원 두 개 = 100원', 100: '100원 열 개 = 1000원', 500: '500원 두 개 = 1000원', 1000: '천 원' }[m[0]] + '</div>' }); b.addEventListener('click', function () { K.sfx.pop(); K.speak(fmt(m[0])); K.event('learn'); }); g.appendChild(b); });
    main.appendChild(g);
  }
  function countQuiz() {
    quiz('count', 8, function (i, lv) {
      var allowed = lv === 1 ? MONEY.slice(2, 3) : lv === 2 ? MONEY.slice(2, 4) : lv === 3 ? MONEY.slice(1, 4) : MONEY;
      var total = 0; var list = []; var n = K.randInt(2, lv >= 4 ? 5 : 4); for (var k = 0; k < n; k++) { var m = K.pick(allowed); list.push(m); total += m[0]; }
      var wrong = []; var guard = 0; while (wrong.length < 3 && guard++ < 100) { var w = total + K.pick([-200, -100, 100, 200, 500, -500, 50, -50]); if (w > 0 && w !== total && wrong.indexOf(w) < 0) wrong.push(w); }
      return { prompt: '<div style="line-height:2">' + coinsHTML(list) + '</div>', say: '모두 얼마일까요?', cols: 4, choices: K.shuffle([total].concat(wrong)).map(function (x) { return { html: fmt(x), cls: 'text', correct: x === total, say: fmt(x) }; }) };
    });
  }
  function buyGame() {
    main.innerHTML = ''; main.appendChild(K.backButton(home));
    var lv = K.getLevel('buy'); var round = 0, score = 0, total = 4;
    var box = el('div', { class: 'kl-stage' }); main.appendChild(box);
    function next() {
      if (round >= total) { box.innerHTML = ''; if (score >= 3 && lv < 5) K.setLevel('buy', lv + 1); box.appendChild(el('div', { class: 'kl-result' }, [el('div', { class: 'kl-result-emoji', text: '🛍️' }), el('div', { class: 'kl-result-title', text: '장보기 완료!' }), el('div', { class: 'kl-result-score', text: score + ' / ' + total }), el('div', { class: 'kl-row' }, [el('button', { class: 'kl-btn primary', text: '🔁 한 번 더', onclick: buyGame }), el('button', { class: 'kl-btn', text: '🏠 처음으로', onclick: home })])])); K.sfx.win(); K.confetti(); return; }
      var goods = GOODS.filter(function (g) { return lv === 1 ? g[2] <= 500 : lv === 2 ? g[2] <= 1000 : true; });
      var item = K.pick(goods); var allowed = lv === 1 ? MONEY.slice(2, 3) : lv === 2 ? MONEY.slice(2, 4) : MONEY;
      var paid = []; var mistakes = 0;
      box.innerHTML = '';
      box.appendChild(el('div', { class: 'kl-prompt', html: item[0] + ' ' + item[1] + ' <span style="color:#d6336c">' + fmt(item[2]) + '</span>' }));
      box.appendChild(el('div', { class: 'kl-hint', text: '딱 맞게 돈을 내 보세요' }));
      var paidBox = el('div', { class: 'paid' }); var sumEl = el('div', { style: 'text-align:center;font-size:30px;font-weight:900;margin:8px' });
      var pay = el('div', { class: 'paybox' });
      allowed.forEach(function (m) { var b = el('button', { html: money(m[0], m[1]) }); b.addEventListener('click', function () { paid.push(m); K.sfx.pop(); render(); }); pay.appendChild(b); });
      var row = el('div', { class: 'kl-row' }, [el('button', { class: 'kl-btn', text: '↩ 다시', onclick: function () { paid = []; render(); } }), el('button', { class: 'kl-btn green', text: '💳 계산하기', onclick: function () { var s = paid.reduce(function (a, m) { return a + m[0]; }, 0); if (s === item[2]) { K.sfx.correct(); K.addStar(1); K.event('correct'); if (!mistakes) score++; K.speak('딱 맞아요! 고맙습니다'); round++; setTimeout(next, 1200); } else { mistakes++; K.sfx.wrong(); K.speak(s < item[2] ? fmt(item[2] - s) + ' 더 필요해요' : fmt(s - item[2]) + ' 많아요'); K.toast(s < item[2] ? '조금 더 내야 해요' : '너무 많이 냈어요'); } } })]);
      function render() { paidBox.innerHTML = coinsHTML(paid) || '<span style="color:#999">돈을 눌러서 내요</span>'; sumEl.textContent = fmt(paid.reduce(function (a, m) { return a + m[0]; }, 0)); }
      box.appendChild(pay); box.appendChild(paidBox); box.appendChild(sumEl); box.appendChild(row); render();
      K.speak(item[1] + '는 ' + fmt(item[2]) + '이에요');
    }
    next();
  }
  function affordQuiz() {
    quiz('afford', 8, function (i, lv) {
      var have = K.pick(lv === 1 ? [500, 1000] : [300, 500, 700, 1000, 1500, 2000]); var item = K.pick(GOODS);
      var allowed = lv >= 3 ? MONEY : MONEY.slice(2);
      return { prompt: '<div>내 돈: ' + coinsHTML(makeAmount(have, allowed)) + ' (' + fmt(have) + ')</div><div style="margin-top:10px">' + item[0] + ' ' + item[1] + ' ' + fmt(item[2]) + '</div>', say: '내 돈은 ' + fmt(have) + '. ' + item[1] + '는 ' + fmt(item[2]) + '. 살 수 있을까요?', cols: 2, choices: [{ html: '😊 살 수 있어요', cls: 'text', correct: have >= item[2] }, { html: '😢 돈이 모자라요', cls: 'text', correct: have < item[2] }] };
    });
  }
  function changeQuiz() {
    quiz('change', 6, function (i, lv) {
      var item = K.pick(GOODS.filter(function (g) { return g[2] < 1000; })); var give = 1000; var ans = give - item[2];
      var wrong = []; var guard = 0; while (wrong.length < 3 && guard++ < 100) { var w = ans + K.pick([-200, -100, 100, 200, 300, -300]); if (w > 0 && w !== ans && wrong.indexOf(w) < 0) wrong.push(w); }
      return { prompt: item[0] + ' ' + fmt(item[2]) + '짜리를 사고 ' + money(1000, 'b1000') + ' 냈어요', say: fmt(item[2]) + '짜리를 사고 천 원을 냈어요. 거스름돈은?', sub: '거스름돈은 얼마?', cols: 4, choices: K.shuffle([ans].concat(wrong)).map(function (x) { return { html: (lv >= 3 ? fmt(x) : coinsHTML(makeAmount(x, MONEY.slice(0, 4))) + '<div style="font-size:18px">' + fmt(x) + '</div>'), cls: lv >= 3 ? 'text' : 'small', correct: x === ans, say: fmt(x) }; }) };
    });
  }
  home();
})();
</script>
</body>
</html>
