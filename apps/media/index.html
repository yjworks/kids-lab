  function adQuiz() {
    quiz('ad', function (i, lv) {
      var a = K.pick(ADS);
      return {
        key: 'a' + a[2], prompt: '<div class="post' + (a[3] ? ' ad' : '') + '"><div class="who"><i>' + (a[3] ? '🏪' : '📌') + '</i>' + K.esc(a[0]) + '</div><div class="pic">' + a[1] + '</div><div class="txt">' + K.esc(a[2]) + '</div></div>',

      };
    });

      return q;
    });
  }
  function trustQuiz() {
    situation('trust', TRUST, function (s) { return { prompt: '<div class="sit">' + K.esc(s[0]) + '</div>', sub: '어떻게 할까요?', say: s[0] + ' 어떻게 할까요?', good: s[1], bad: s[2], why: s[3] }; });
  }
  function privQuiz() {
    situation('priv', PRIV, function (s) { return { prompt: '<div class="sit">' + K.esc(s[0]) + '</div>', sub: '어떻게 할까요?', say: s[0] + ' 어떻게 할까요?', good: s[1], bad: s[2], why: s[3] }; });
  }
  function linkQuiz() {
    situation('link', LINKS, function (s) {
      return { prompt: '<div class="popup"><div class="bar">🔔 알림</div><div class="m">' + K.esc(s[0]) + '</div><span class="fake">' + K.esc(s[1]) + '</span></div>',
        sub: '이런 창이 떴어요. 어떻게 할까요?', say: s[0] + ' 이런 창이 떴어요. 어떻게 할까요?', good: s[2], bad: s[3], why: s[4] };
    });
  }
  function headQuiz() {
    quiz('head', function (i, lv) {
      var h = K.pick(HEAD);
      return {
        key: 'h' + h[0], prompt: '<div class="post"><div class="who"><i>📰</i>어린이 소식</div><div class="head">' + K.esc(h[0]) + '</div><div class="body">' + K.esc(h[1]) + '</div></div>',
        sub: '제목이 내용과 맞나요?', say: '제목, ' + h[0] + '. 내용, ' + h[1] + ' 제목이 내용과 맞나요?', cols: 2,
        choices: [{ html: '<div class="opt">⭕ 맞아요</div>', correct: h[2] }, { html: '<div class="opt">❌ 부풀렸어요</div>', correct: !h[2] }],
        onCorrect: why(h[3]), hold: 3000
      };
    });
  }
  function rules() {
    main.innerHTML = ''; main.appendChild(K.backButton(home));
    main.appendChild(el('div', { class: 'kl-prompt', text: '💡 똑똑한 인터넷 약속', style: 'font-size:24px;margin-bottom:10px' }));
    var box = el('div', { class: 'rules' });
    RULES.forEach(function (r) {
      var b = el('button', { class: 'rule', html: '<i>' + r[0] + '</i><span>' + K.esc(r[1]) + '</span>' });
      b.addEventListener('click', function () { K.sfx.pop(); K.speak(r[1]); K.event('learn'); });
      box.appendChild(b);
    });
    main.appendChild(box);
  }

  home();
})();
</script>
</body>
</html>
