<title>읽기 책</title>
<link rel="stylesheet" href="../../shared/app.css">
<style>
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .cover { position: relative; border-radius: 18px 22px 22px 18px; padding: 16px 10px 12px; text-align: center; min-height: 170px;
    box-shadow: inset 8px 0 0 rgba(0,0,0,.12), 0 6px 0 rgba(0,0,0,.1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .cover .e { font-size: 58px; line-height: 1.1; }
  .cover .t { font-size: 19px; font-weight: 900; color: #333; word-break: keep-all; }
  .cover .n { font-size: 14px; font-weight: 800; color: #555; }
  .cover.locked { filter: grayscale(1); opacity: .45; }
  .cover .badge { position: absolute; top: 6px; right: 8px; font-size: 20px; }
  .tier { font-size: 20px; font-weight: 900; margin: 18px 4px 8px; color: #6a4c93; }
  .auto { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 6px 0 4px; font-weight: 800; }
  .auto button { border-radius: 24px; padding: 8px 16px; background: #eee; font-weight: 800; min-height: 44px; }
  .auto button.on { background: #8ac926; color: #fff; }
  /* 읽는 화면: 넘김 단추는 아래에 고정 */
  .reader { display: flex; flex-direction: column; flex: 1 1 0; min-height: 0; gap: 8px; }
  .reader .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: 0 0 auto; }
  .reader .pg { font-weight: 900; color: #6a4c93; font-size: 18px; }
  .reader .page { flex: 1 1 0; min-height: 0; background: #fff; border-radius: 26px; box-shadow: 0 6px 0 rgba(0,0,0,.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 14px; overflow: auto; }
  .reader .scene { font-size: 96px; line-height: 1.1; text-align: center; }
  .reader .nav { display: flex; gap: 10px; flex: 0 0 auto; }
  .reader .nav button { flex: 1; min-height: 64px; border-radius: 20px; font-size: 22px; font-weight: 900; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.1); }
  .reader .nav .read { background: #e3f0ff; }
  .reader .nav .go { background: #ffca3a; }
  .reader .nav button:disabled { opacity: .35; }
  .done-box { text-align: center; }
  @media (max-width: 760px) {
    .shelf { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
    .cover { min-height: 138px; padding: 12px 8px 10px; }
    .cover .e { font-size: 44px; }
    .cover .t { font-size: 16px; }
    .reader .scene { font-size: 72px; }
    .reader .nav button { min-height: 56px; font-size: 18px; }
  }
  @media (max-height: 500px) { .reader .scene { font-size: 52px; } .reader .page { gap: 8px; } .reader .nav button { min-height: 48px; } }
</style>

  ];
  var TIER_NAME = { 1: '🌱 첫 책 (4쪽)', 2: '🌿 조금 긴 책 (6쪽)', 3: '🌳 긴 책 (8쪽)', 4: '📜 옛이야기 (8~9쪽)', 5: '🕯️ 탈무드 지혜 이야기 (9쪽)' };

  function stateOf() { var p = K.progress(); return { read: p.read || {}, auto: p.auto !== false }; }
  /* 처음 네 권은 열려 있고, 한 권을 읽을 때마다 다음 책이 열린다 */
  /* 옛이야기·탈무드는 처음부터 모두 열어 둔다 */
  function unlocked(i, read) { if (i < 4 || BOOKS[i].tier >= 4) return true; return !!read[BOOKS[i - 1].id]; }

  function home() {
    document.body.classList.remove('fixed');
    main.innerHTML = '';
    var st = stateOf();
    var total = BOOKS.filter(function (b) { return st.read[b.id]; }).length;
    main.appendChild(el('div', { class: 'kl-prompt', text: '📚 내 책장 · 다 읽은 책 ' + total + ' / ' + BOOKS.length, style: 'font-size:24px;margin-bottom:6px' }));
    var autoBtn = el('button', { class: st.auto ? 'on' : '', text: st.auto ? '켜짐' : '꺼짐' });
    autoBtn.addEventListener('click', function () { var v = !stateOf().auto; K.setProgress({ auto: v }); autoBtn.className = v ? 'on' : ''; autoBtn.textContent = v ? '켜짐' : '꺼짐'; K.sfx.click(); });
    main.appendChild(el('div', { class: 'auto' }, [el('span', { text: '🔊 쪽마다 읽어 주기' }), autoBtn]));
    [1, 2, 3, 4, 5].forEach(function (t) {
      main.appendChild(el('div', { class: 'tier', text: TIER_NAME[t] }));
      var g = el('div', { class: 'shelf' });
      BOOKS.forEach(function (b, i) {
        if (b.tier !== t) return;
        var open = unlocked(i, st.read), r = st.read[b.id];
        var c = el('button', { class: 'cover' + (open ? '' : ' locked'), style: 'background:' + b.color }, [
          el('div', { class: 'e', text: open ? b.e : '🔒' }), el('div', { class: 't', text: b.title }),
          el('div', { class: 'n', text: r ? '⭐ ' + r.n + '번 읽었어요' : (open ? '새 책!' : '앞의 책을 읽으면 열려요') }),
          r ? el('span', { class: 'badge', text: '✅' }) : null
        ]);
        c.addEventListener('click', function () {
          if (!open) { K.nope('아직 잠겨 있어요', '앞의 책을 먼저 읽어요'); return; }
          K.sfx.click(); read(b, 0);
        });
        g.appendChild(c);
      });
      main.appendChild(g);
    });
  }

  /* ---------- 읽기 ---------- */
  function wordsHTML(text) {
    return '<div class="rd-sentence">' + text.split(' ').map(function (w) {
      var bare = w.replace(/[.,!?"]/g, '');
      return '<span class="w" data-say="' + K.esc(bare) + '">' + K.esc(w) + '</span>';
    }).join(' ') + '</div>';
  }
  function read(b, p) {
    document.body.classList.add('fixed');
    main.innerHTML = '';
    var wrap = el('div', { class: 'reader' });
    var head = el('div', { class: 'head' }, [K.backButton(home), el('span', { class: 'pg', text: b.e + ' ' + b.title + ' · ' + (p + 1) + ' / ' + b.pages.length })]);
    var pg = b.pages[p];
    var page = el('div', { class: 'page' }, [el('div', { class: 'scene', text: pg[0] }), el('div', { html: wordsHTML(pg[1]) })]);
    var last = p === b.pages.length - 1;
    var nav = el('div', { class: 'nav' }, [
      el('button', { text: '◀ 앞', disabled: p === 0 ? 'disabled' : null, onclick: function () { K.sfx.click(); read(b, p - 1); } }),
      el('button', { class: 'read', text: '🔊 읽어 줘', onclick: function () { K.speak(pg[1]); } }),
      el('button', { class: 'go', text: last ? '다 읽었어요 ✔' : '다음 ▶', onclick: function () { K.sfx.click(); if (last) finished(b); else read(b, p + 1); } })
    ]);
    wrap.appendChild(head); wrap.appendChild(page); wrap.appendChild(nav);
    main.appendChild(wrap);
    if (stateOf().auto) setTimeout(function () { K.speak(pg[1]); }, 250);
  }
  function finished(b) {
    /* 끝까지 넘긴 것이 곧 한 권 읽기. 질문은 덤이다. */
    K.mutate(function (d) {
      var pr = d.progress.books || (d.progress.books = {});
      var rd = pr.read || (pr.read = {});
      var r = rd[b.id] || { n: 0 };
      r.n++; r.last = K.todayKey(); rd[b.id] = r;
    });
    K.addStar(2); K.event('read'); K.event('win');
    document.body.classList.remove('fixed');
    main.innerHTML = ''; main.appendChild(K.backButton(home));
    K.sfx.win(); K.confetti();
    main.appendChild(el('div', { class: 'kl-result done-box' }, [
      el('div', { class: 'kl-result-emoji', text: b.e }),
      el('div', { class: 'kl-result-title', text: '「' + b.title + '」 책을 다 읽었어요!' }),
      el('div', { class: 'kl-result-score', text: '⭐ 별 2개! 이제 질문 ' + b.q.length + '개를 풀어 볼까요?' }),
      el('div', { class: 'kl-row' }, [
        el('button', { class: 'kl-btn primary', text: '❓ 질문 풀기', onclick: function () { questions(b); } }),
        el('button', { class: 'kl-btn', text: '📚 책장으로', onclick: home })
      ])
    ]));
    K.speak(b.title + ', 다 읽었어요! 질문을 풀어 볼까요?');
  }
  function questions(b) {
    main.innerHTML = ''; main.appendChild(K.backButton(home));
    var box = el('div'); main.appendChild(box);
    var qs = b.q;
    K.runQuiz({
      el: box, total: qs.length, review: false, onFinish: home,
      make: function (i) {
        var q = qs[i];
        var opts = [q[1]].concat(q[2]);
        return {
          key: b.id + 'q' + i, prompt: q[0], say: q[0], cols: 3,
          choices: K.shuffle(opts).map(function (o) { return { html: '<div class="rd-choice-pic">' + o + '</div>', correct: o === q[1] }; })
        };
      }
    });
  }

  home();
