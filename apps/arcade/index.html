<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>오락실</title>
<link rel="stylesheet" href="../../shared/app.css">
<style>
  .ar { display: flex; flex-direction: column; gap: 8px; flex: 1 1 0; min-height: 0; }
  .ar-top { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .ar-info { flex: 1; background: #fff3c4; border-radius: 18px; padding: 8px 12px; font-weight: 900; font-size: 20px; text-align: center; }
  .ar-stage { flex: 1 1 0; min-height: 0; position: relative; border-radius: 24px; overflow: hidden; }
  .ar-ctl { display: flex; gap: 10px; flex: 0 0 auto; justify-content: center; }
  .ar-ctl button { flex: 1; max-width: 160px; min-height: 68px; border-radius: 20px; font-size: 30px; font-weight: 900; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.12); }
  .ar-ctl button.go { background: #ff595e; color: #fff; }
  .ar-ctl button:disabled { opacity: .35; }

  /* ---------- 인형뽑기 ---------- */
  .claw-box { background: linear-gradient(#dff4ff, #bfe6ff 70%, #ffd9e8 70%); border: 8px solid #ff8fab; }
  .chute { position: absolute; left: 0; bottom: 0; width: 18%; height: 28%; background: repeating-linear-gradient(45deg, #ffc2d1, #ffc2d1 8px, #ffb3c6 8px, #ffb3c6 16px); border-right: 4px solid #ff8fab; }
  .chute::after { content: '⬇'; position: absolute; top: 4px; left: 0; right: 0; text-align: center; color: #c0395f; font-weight: 900; }
  .doll { position: absolute; font-size: 44px; line-height: 1; transform: translate(-50%, -50%); transition: top .5s ease-in; }
  .rope { position: absolute; top: 0; width: 4px; background: #666; transform: translateX(-50%); }
  .claw { position: absolute; width: 56px; height: 34px; transform: translate(-50%, 0); }
  .claw .head { position: absolute; left: 14px; top: 0; width: 28px; height: 12px; background: #888; border-radius: 6px; }
  .claw .p { position: absolute; top: 8px; width: 6px; height: 26px; background: #777; border-radius: 3px; transform-origin: top center; transition: transform .25s; }
  .claw .p.l { left: 16px; transform: rotate(28deg); } .claw .p.r { right: 16px; transform: rotate(-28deg); }
  .claw.shut .p.l { transform: rotate(-6deg); } .claw.shut .p.r { transform: rotate(6deg); }
  .claw .held { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); font-size: 40px; }
  .shelf-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; font-size: 44px; }
  .shelf-row span { background: #fff; border-radius: 16px; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 rgba(0,0,0,.08); }
  .shelf-row span.no { filter: grayscale(1); opacity: .25; }

  /* ---------- 낚시 ---------- */
  .pond { background: linear-gradient(#bde7ff, #5fb6e8); }
  .pond .wave { position: absolute; left: 0; right: 0; top: 0; height: 14%; background: #8ed3f7; border-bottom: 4px solid #ffffff88; }
  .fish { position: absolute; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -50%); cursor: pointer; }
  .fish .f { font-size: 58px; line-height: 1; }
  .fish.left .f { transform: scaleX(-1); }
  .fish .tag { background: #fff; border-radius: 12px; padding: 2px 10px; font-size: 26px; font-weight: 900; color: #245; margin-top: -6px; box-shadow: 0 2px 4px rgba(0,0,0,.15); white-space: nowrap; }
  .fish.caught { transition: top .7s ease-in, opacity .7s; top: -10% !important; opacity: 0; }
  .line { position: absolute; top: 0; width: 3px; background: #333; transform: translateX(-50%); transition: height .35s; }
  .bucket { position: absolute; right: 10px; top: 8px; background: #fff; border-radius: 16px; padding: 4px 10px; font-weight: 900; font-size: 20px; }

  /* ---------- 두더지 ---------- */
  .field { background: #9bd770; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4%; padding: 5%; }
  .hole { position: relative; background: radial-gradient(ellipse at 50% 80%, #5a3a1a 0 45%, transparent 46%); overflow: hidden; border-radius: 12px; }
  .mole { position: absolute; left: 50%; bottom: -90%; transform: translateX(-50%); transition: bottom .18s; display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; justify-content: flex-end; }
  .mole.up { bottom: 0; }
  .mole .m { font-size: 52px; line-height: 1; }
  .mole .tag { background: #fff; border-radius: 10px; padding: 0 8px; font-size: 24px; font-weight: 900; margin-bottom: 4px; }
  .mole.hit .m { transform: scale(.8) rotate(-10deg); filter: grayscale(.6); }

  .target { display: inline-block; background: #fff; border-radius: 14px; padding: 2px 12px; font-size: 26px; margin-left: 6px; color: #c0395f; }
  @media (max-width: 760px) {
    .ar-info { font-size: 16px; } .ar-ctl button { min-height: 60px; font-size: 24px; }
    .doll { font-size: 34px; } .claw .held { font-size: 32px; }
    .fish .f { font-size: 44px; } .fish .tag { font-size: 20px; padding: 1px 8px; }
    .mole .m { font-size: 40px; } .mole .tag { font-size: 18px; }
    .target { font-size: 20px; }
    .shelf-row { font-size: 34px; } .shelf-row span { width: 52px; height: 52px; }
  }
</style>
</head>
<body data-app="arcade">
<main id="main"></main>
<script src="../../shared/kid.js"></script>
<script src="../../shared/hangul.js"></script>
<script src="../../shared/words.js"></script>
<script>
(function () {
  var K = KidLab, el = K.el, B = WordBank;
  K.header({ title: '오락실', icon: '🕹️', say: '오락실' });
  var main = document.getElementById('main');
  var stopAll = [];
  function cleanup() { stopAll.forEach(function (f) { try { f(); } catch (e) { } }); stopAll = []; document.body.classList.remove('fixed'); }

  var DOLLS = ['🧸', '🐻', '🐰', '🦄', '🐶', '🐱', '🐼', '🐸', '🦊', '🐧', '🐨', '🐯', '🐷', '🐵', '🦁', '🐙'];
  function prog() { return K.progress(); }

  function home() {
    cleanup();
    main.innerHTML = '';
    var p = prog(), prizes = p.prizes || [];
    K.menu(main, [
      { icon: '🧸', label: '인형뽑기', color: '#ffe9ee', run: claw },
      { icon: '🎣', label: '글자 낚시', mode: 'fish', color: '#e3f0ff', run: fishing },
      { icon: '🔨', label: '두더지 잡기', mode: 'mole', color: '#e3f7cf', run: moles },
      { icon: '🏆', label: '인형 진열장 (' + uniq(prizes).length + '/' + DOLLS.length + ')', color: '#fff3c4', run: shelf }
    ]);
    main.appendChild(el('div', { class: 'kl-hint', text: '낚시와 두더지로 별을 모으고, 별로 인형을 뽑아요! (인형뽑기는 하루 한 번 공짜)' }));
  }
  function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }

  /* ---------- 문제 만들기 (낚시·두더지 공용) ----------
     단계 1 숫자 → 2 자음 → 3 글자 → 4 그림 보고 낱말 → 5 덧셈 답 */
  var CONS = 'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ'.split('');
  var CNAME = ['기역', '니은', '디귿', '리을', '미음', '비읍', '시옷', '이응', '지읒', '치읓', '키읔', '티읕', '피읖', '히읗'];
  var SYL = '가나다라마바사아자차카타파하고노도로모보소오조호'.split('');
  function makeRound(lv) {
    var t, pool, show, say;
    if (lv <= 1) { pool = ['1', '2', '3', '4', '5', '6', '7', '8', '9']; t = K.pick(pool); show = t; say = K.numToKo(t); }
    else if (lv === 2) { pool = CONS; t = K.pick(pool); show = t; say = CNAME[CONS.indexOf(t)]; }
    else if (lv === 3) { pool = SYL; t = K.pick(pool); show = t; say = t; }
    else if (lv === 4) {
      var words = B.where(function (w) { return w.word.length <= 3; });
      var w = K.pick(words); t = w.word; show = w.pic;
      pool = [t].concat(K.sample(words.filter(function (x) { return x !== w; }).map(function (x) { return x.word; }), 8));
      say = w.word;
    } else {
      var a = K.randInt(1, 6), b = K.randInt(1, 4); t = String(a + b); show = a + '+' + b; say = K.numToKo(a) + ' 더하기 ' + K.numToKo(b);
      pool = []; for (var i = 2; i <= 10; i++) pool.push(String(i));
    }
    return { t: t, show: show, say: say, others: pool.filter(function (x) { return x !== t; }) };
  }
  function targetHTML(r, lv) { return (lv === 4 ? '이 그림의 낱말' : lv === 5 ? '답' : '') + '<span class="target">' + K.esc(r.show) + '</span>'; }

  /* ================= 인형뽑기 ================= */
  function claw() {
    cleanup();
    var p = prog(), today = K.todayKey();
    var free = p.free !== today;
    if (!free) {
      if (K.data().stars < 1) {
        main.innerHTML = ''; main.appendChild(K.backButton(home));
        main.appendChild(el('div', { class: 'kl-result' }, [el('div', { class: 'kl-result-emoji', text: '⭐' }), el('div', { class: 'kl-result-title', text: '별이 1개 필요해요' }),
          el('div', { class: 'kl-result-score', text: '낚시나 두더지 잡기로 별을 모아 와요!' }),
          el('div', { class: 'kl-row' }, [el('button', { class: 'kl-btn primary', text: '🎣 낚시하러 가기', onclick: fishing }), el('button', { class: 'kl-btn', text: '🏠', onclick: home })])]));
        K.speak('별이 한 개 필요해요. 낚시로 별을 모아 와요');
        return;
      }
    }
    document.body.classList.add('fixed');
    main.innerHTML = '';
    var wrap = el('div', { class: 'ar' });
    var info = el('div', { class: 'ar-info', text: free ? '🎁 오늘 한 번은 공짜! ◀ ▶ 로 옮기고 ⬇ 로 뽑아요' : '⭐ 별 1개로 한 판! ◀ ▶ 로 옮기고 ⬇ 로 뽑아요' });
    wrap.appendChild(el('div', { class: 'ar-top' }, [K.backButton(home), info]));
    var box = el('div', { class: 'ar-stage claw-box' });
    box.appendChild(el('div', { class: 'chute' }));
    var dolls = [];
    for (var i = 0; i < 9; i++) {
      var d = { e: K.pick(DOLLS), x: 26 + (i % 5) * 15 + K.randInt(-3, 3), y: i < 5 ? 86 : 72 };
      d.el = el('div', { class: 'doll', text: d.e }); d.el.style.left = d.x + '%'; d.el.style.top = d.y + '%';
      box.appendChild(d.el); dolls.push(d);
    }
    var cx = 55, cy = 4, state = 'move', held = null, near = null, best = 99;
    var rope = el('div', { class: 'rope' }), cl = el('div', { class: 'claw' }, [el('div', { class: 'head' }), el('div', { class: 'p l' }), el('div', { class: 'p r' })]);
    box.appendChild(rope); box.appendChild(cl);
    function draw() {
      rope.style.left = cx + '%'; rope.style.height = cy + '%';
      cl.style.left = cx + '%'; cl.style.top = cy + '%';
    }
    draw();
    wrap.appendChild(box);
    var left = el('button', { text: '◀' }), right = el('button', { text: '▶' }), go = el('button', { class: 'go', text: '⬇' });
    wrap.appendChild(el('div', { class: 'ar-ctl' }, [left, go, right]));
    main.appendChild(wrap);
    if (free) K.setProgress({ free: today }); else K.spendStars(1);
    K.notify('update');
    K.speak('화살표로 집게를 옮기고, 아래 단추로 뽑아요');

    /* 누르고 있는 동안 움직인다 */
    var dir = 0, raf = 0, last = 0, timeLeft = 20;
    function hold(b, d) {
      b.addEventListener('pointerdown', function (e) { e.preventDefault(); if (state === 'move') dir = d; });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { b.addEventListener(ev, function () { dir = 0; }); });
    }
    hold(left, -1); hold(right, 1);
    var keyH = function (e) { if (e.key === 'ArrowLeft') dir = -1; else if (e.key === 'ArrowRight') dir = 1; else if (e.key === 'ArrowDown' || e.key === ' ') drop(); };
    var keyU = function (e) { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') dir = 0; };
    window.addEventListener('keydown', keyH); window.addEventListener('keyup', keyU);
    stopAll.push(function () { cancelAnimationFrame(raf); window.removeEventListener('keydown', keyH); window.removeEventListener('keyup', keyU); });
    go.addEventListener('click', drop);
    function loop(t) {
      var dt = last ? Math.min(0.05, (t - last) / 1000) : 0; last = t;
      if (state === 'move') {
        cx = Math.max(24, Math.min(92, cx + dir * 32 * dt));
        timeLeft -= dt;
        if (timeLeft <= 0) drop();
      }
      draw();
      raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);

    function tween(from, to, ms, fn, done) {
      var t0 = performance.now();
      (function step(t) { var k = Math.min(1, (t - t0) / ms); fn(from + (to - from) * k); if (k < 1) requestAnimationFrame(step); else done && done(); })(t0);
    }
    function drop() {
      if (state !== 'move') return;
      state = 'down'; dir = 0; left.disabled = right.disabled = go.disabled = true; K.sfx.click();
      near = null; best = 99;
      dolls.forEach(function (d) { if (!d.gone) { var dx = Math.abs(d.x - cx) + (d.y === 72 ? 0 : 1.5); if (dx < best) { best = dx; near = d; } } });
      var bottomY = near && best < 9 ? near.y - 12 : 70;
      tween(cy, bottomY, 900, function (v) { cy = v; }, function () {
        cl.classList.add('shut'); K.sfx.pop();
        /* 가운데에 가깝게 내릴수록 잘 잡힌다 */
        var chance = best < 3 ? 0.9 : best < 6 ? 0.6 : best < 9 ? 0.3 : 0;
        if (near && Math.random() < chance) {
          held = near; near.gone = true; near.el.style.display = 'none';
          cl.appendChild(el('span', { class: 'held', text: near.e }));
        }
        setTimeout(up, 400);
      });
    }
    function up() {
      state = 'up';
      var slip = held && Math.random() < (best < 3 ? 0.08 : 0.35);
      tween(cy, 4, 1000, function (v) {
        cy = v;
        if (slip && v < 40 && held) {
          /* 올라가다 미끄러짐 */
          slip = false; var h = cl.querySelector('.held'); if (h) h.remove();
          held.gone = false; held.x = cx; held.el.style.left = cx + '%'; held.el.style.display = ''; held.el.style.top = v + '%';
          setTimeout(function (hd) { hd.el.style.top = hd.y + '%'; }.bind(null, held), 30);
          held = null; K.sfx.wrong();
          info.textContent = '앗! 미끄러졌어요 😮';
        }
      }, function () {
        if (!held) return result(false);
        state = 'carry';
        tween(cx, 9, 900, function (v) { cx = v; }, function () {
          cl.classList.remove('shut');
          var h = cl.querySelector('.held'); if (h) h.remove();
          result(true);
        });
      });
    }
    function result(win) {
      state = 'done'; cancelAnimationFrame(raf);
      if (win) {
        K.mutate(function (d) { var pr = d.progress.arcade || (d.progress.arcade = {}); (pr.prizes = pr.prizes || []).push(held.e); });
        K.sfx.win(); K.confetti(); K.event('win');
        info.textContent = '🎉 ' + held.e + ' 인형을 뽑았어요!';
        K.speak('와! 인형을 뽑았어요');
      } else {
        cl.classList.remove('shut');
        info.textContent = '아쉬워요! 집게를 인형 한가운데에 맞춰 봐요';
        K.speak('아쉬워요. 인형 한가운데에 맞춰 봐요');
      }
      var ctl = wrap.querySelector('.ar-ctl'); ctl.innerHTML = '';
      ctl.appendChild(el('button', { text: '🔁 한 판 더', onclick: claw, style: 'font-size:20px;max-width:200px' }));
      ctl.appendChild(el('button', { text: '🏆 진열장', onclick: shelf, style: 'font-size:20px;max-width:200px' }));
    }
  }

  function shelf() {
    cleanup();
    main.innerHTML = ''; main.appendChild(K.backButton(home));
    var prizes = prog().prizes || [];
    main.appendChild(el('div', { class: 'kl-prompt', text: '🏆 내 인형 진열장 ' + uniq(prizes).length + ' / ' + DOLLS.length }));
    var row = el('div', { class: 'shelf-row' });
    DOLLS.forEach(function (d) { var n = prizes.filter(function (x) { return x === d; }).length; row.appendChild(el('span', { class: n ? '' : 'no', text: d, title: n ? n + '개' : '아직 없어요' })); });
    main.appendChild(row);
    main.appendChild(el('div', { class: 'kl-hint', text: '모두 ' + prizes.length + '번 뽑았어요' }));
  }

  /* ================= 글자 낚시 ================= */
  function fishing() {
    cleanup();
    var lv = K.getLevel('fish'), GOAL = 5, got = 0, miss = 0, r = null;
    document.body.classList.add('fixed');
    main.innerHTML = '';
    var wrap = el('div', { class: 'ar' });
    var info = el('div', { class: 'ar-info' });
    wrap.appendChild(el('div', { class: 'ar-top' }, [K.backButton(home), info]));
    var pond = el('div', { class: 'ar-stage pond' }, [el('div', { class: 'wave' })]);
    var bucket = el('div', { class: 'bucket', text: '🧺 0 / ' + GOAL });
    pond.appendChild(bucket);
    var line = el('div', { class: 'line' }); pond.appendChild(line);
    wrap.appendChild(pond);
    main.appendChild(wrap);
    var fishes = [], raf = 0, last = 0, busy = false;
    stopAll.push(function () { cancelAnimationFrame(raf); });

    function newTarget() {
      r = makeRound(lv);
      info.innerHTML = '🎣 ' + targetHTML(r, lv) + ' 물고기를 낚아요';
      K.speak((lv === 4 ? r.say + '. 이 낱말 물고기를 낚아요' : lv === 5 ? r.say + '는? 답 물고기를 낚아요' : r.say + ' 물고기를 낚아요'));
      /* 물고기 새로: 정답 2마리 + 다른 것 */
      fishes.forEach(function (f) { f.el.remove(); }); fishes = [];
      var labels = [r.t, r.t].concat(K.sample(r.others, lv <= 1 ? 3 : 4));
      K.shuffle(labels).forEach(function (lb, i) {
        var f = { lb: lb, x: K.randInt(12, 88), y: 26 + i * (66 / labels.length), v: (Math.random() < 0.5 ? -1 : 1) * (6 + Math.random() * (4 + lv * 2)) };
        f.el = el('div', { class: 'fish' + (f.v < 0 ? ' left' : '') }, [el('div', { class: 'f', text: K.pick(['🐟', '🐠', '🐡']) }), el('div', { class: 'tag', text: lb })]);
        f.el.addEventListener('pointerdown', function (e) { e.preventDefault(); cast(f); });
        pond.appendChild(f.el); fishes.push(f);
      });
    }
    function loop(t) {
      var dt = last ? Math.min(0.05, (t - last) / 1000) : 0; last = t;
      fishes.forEach(function (f) {
        if (f.stop) return;
        f.x += f.v * dt;
        if (f.x < 8 || f.x > 92) { f.v = -f.v; f.x = Math.max(8, Math.min(92, f.x)); f.el.classList.toggle('left', f.v < 0); }
        f.el.style.left = f.x + '%'; f.el.style.top = f.y + '%';
      });
      raf = requestAnimationFrame(loop);
    }
    function cast(f) {
      if (busy || f.stop) return;
      busy = true; f.stop = true;
      line.style.left = f.x + '%'; line.style.height = (f.y - 4) + '%';
      K.sfx.pop();
      setTimeout(function () {
        if (f.lb === r.t) {
          f.el.classList.add('caught'); got++; K.sfx.correct(); K.event('correct');
          bucket.textContent = '🧺 ' + got + ' / ' + GOAL;
          line.style.height = '0';
          setTimeout(function () { busy = false; if (got >= GOAL) finish(); else newTarget(); }, 800);
        } else {
          miss++; K.nope('그 물고기가 아니에요', '그 물고기가 아니에요');
          line.style.height = '0';
          setTimeout(function () { f.stop = false; f.v = -f.v * 1.4; busy = false; }, 500);
        }
      }, 380);
    }
    function finish() {
      cancelAnimationFrame(raf);
      var up = miss <= 1 && lv < 5;
      if (up) K.setLevel('fish', lv + 1);
      K.addStar(2); K.sfx.win(); K.confetti(); K.event('win');
      document.body.classList.remove('fixed');
      main.innerHTML = ''; main.appendChild(K.backButton(home));
      main.appendChild(el('div', { class: 'kl-result' }, [
        el('div', { class: 'kl-result-emoji', text: '🎣' }),
        el('div', { class: 'kl-result-title', text: '물고기 ' + GOAL + '마리를 낚았어요!' }),
        el('div', { class: 'kl-result-score', html: '⭐ 별 2개!' + (up ? '<div class="kl-levelup">🎊 단계 ' + (lv + 1) + '로 올라갔어요!</div>' : '') }),
        el('div', { class: 'kl-row' }, [el('button', { class: 'kl-btn primary', text: '🔁 한 번 더', onclick: fishing }), el('button', { class: 'kl-btn', text: '🧸 인형뽑기', onclick: claw })])
      ]));
    }
    newTarget();
    raf = requestAnimationFrame(loop);
  }

  /* ================= 두더지 잡기 ================= */
  function moles() {
    cleanup();
    var lv = K.getLevel('mole'), TIME = 30, left = TIME, score = 0, miss = 0, r = makeRound(lv);
    document.body.classList.add('fixed');
    main.innerHTML = '';
    var wrap = el('div', { class: 'ar' });
    var info = el('div', { class: 'ar-info' });
    wrap.appendChild(el('div', { class: 'ar-top' }, [K.backButton(home), info]));
    var field = el('div', { class: 'ar-stage field' });
    var holes = [];
    for (var i = 0; i < 9; i++) {
      var h = el('div', { class: 'hole' }), m = el('div', { class: 'mole' }, [el('div', { class: 'tag' }), el('div', { class: 'm', text: '🐹' })]);
      h.appendChild(m); field.appendChild(h);
      holes.push({ h: h, m: m, lb: null, t: 0 });
    }
    wrap.appendChild(field);
    main.appendChild(wrap);
    function header() { info.innerHTML = '🔨 ' + targetHTML(r, lv) + ' 두더지만! &nbsp; ⏱ ' + Math.ceil(left) + ' &nbsp; ⭐ ' + score; }
    header();
    K.speak((lv === 4 ? r.say + '. 이 낱말 두더지만 잡아요' : lv === 5 ? r.say + '. 답 두더지만 잡아요' : r.say + ' 두더지만 잡아요'));
    holes.forEach(function (o) {
      o.m.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        if (!o.m.classList.contains('up') || o.m.classList.contains('hit')) return;
        o.m.classList.add('hit');
        if (o.lb === r.t) { score++; K.sfx.correct(); if (score % 4 === 0) { r = makeRound(lv); K.speak('이번엔 ' + r.say); } }
        else { miss++; K.nope('아니에요', false); }
        header();
        setTimeout(function () { o.m.classList.remove('up', 'hit'); o.t = 0; }, 250);
      });
    });
    var tick = setInterval(function () {
      left -= 0.5; header();
      holes.forEach(function (o) { if (o.t > 0) { o.t -= 0.5; if (o.t <= 0) o.m.classList.remove('up'); } });
      /* 새 두더지: 절반쯤은 정답 */
      var free = holes.filter(function (o) { return !o.m.classList.contains('up'); });
      var n = lv <= 2 ? 1 : 2;
      for (var k = 0; k < n && free.length; k++) {
        var o = free.splice(K.randInt(0, free.length - 1), 1)[0];
        o.lb = Math.random() < 0.5 ? r.t : K.pick(r.others);
        o.m.querySelector('.tag').textContent = o.lb;
        o.m.classList.add('up'); o.t = Math.max(1, 2.2 - lv * 0.2);
      }
      if (left <= 0) end();
    }, 500);
    stopAll.push(function () { clearInterval(tick); });
    function end() {
      clearInterval(tick);
      var win = score >= 6;
      var up = score >= 10 && miss <= 2 && lv < 5;
      if (up) K.setLevel('mole', lv + 1);
      if (win) { K.addStar(2); K.event('win'); K.sfx.win(); K.confetti(); }
      document.body.classList.remove('fixed');
      main.innerHTML = ''; main.appendChild(K.backButton(home));
      main.appendChild(el('div', { class: 'kl-result' }, [
        el('div', { class: 'kl-result-emoji', text: win ? '🏆' : '🐹' }),
        el('div', { class: 'kl-result-title', text: '두더지 ' + score + '마리를 잡았어요!' }),
        el('div', { class: 'kl-result-score', html: (win ? '⭐ 별 2개!' : '6마리를 잡으면 별을 받아요') + (miss ? '<br>틀리게 친 것 ' + miss + '번' : '') + (up ? '<div class="kl-levelup">🎊 단계 ' + (lv + 1) + '로 올라갔어요!</div>' : '') }),
        el('div', { class: 'kl-row' }, [el('button', { class: 'kl-btn primary', text: '🔁 한 번 더', onclick: moles }), el('button', { class: 'kl-btn', text: '🧸 인형뽑기', onclick: claw })])
      ]));
    }
  }

  home();
})();
</script>
</body>
</html>
