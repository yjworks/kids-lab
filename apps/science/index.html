<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>과학 탐험</title>
<link rel="stylesheet" href="../../shared/app.css">
<style>
  .tank { position: relative; width: 300px; height: 260px; margin: 0 auto; border-radius: 0 0 30px 30px; border: 5px solid #8fd3f4; border-top: none; background: linear-gradient(#e3f6ff 0, #e3f6ff 20%, #8fd3f4 20%); overflow: hidden; }
  .tank .item { position: absolute; left: 50%; transform: translateX(-50%); font-size: 70px; transition: top 1.2s ease-in-out; }
  .grow { display: flex; justify-content: center; align-items: flex-end; gap: 20px; min-height: 160px; }
  .grow div { font-size: 70px; background: #f7f7f7; border-radius: 20px; padding: 10px 20px; }
</style>
</head>
<body data-app="science">
<main id="main"></main>
<script src="../../shared/kid.js"></script>
<script>
(function () {
  var K = KidLab, el = K.el;
  K.header({ title: '과학 탐험', icon: '🔬', say: '과학 탐험' });
  var main = document.getElementById('main');
  var ANIMALS = [['🐶', '강아지', '멍멍', 'land'], ['🐱', '고양이', '야옹', 'land'], ['🐮', '소', '음메', 'land'], ['🐷', '돼지', '꿀꿀', 'land'], ['🐔', '닭', '꼬끼오', 'land'], ['🐸', '개구리', '개굴개굴', 'land'], ['🦁', '사자', '어흥', 'land'], ['🐘', '코끼리', '뿌우', 'land'], ['🐟', '물고기', '뻐끔뻐끔', 'sea'], ['🐬', '돌고래', '끼익', 'sea'], ['🐙', '문어', '꿈틀', 'sea'], ['🐢', '거북이', '느릿느릿', 'sea'], ['🦀', '게', '옆으로', 'sea'], ['🐦', '새', '짹짹', 'sky'], ['🦋', '나비', '팔랑팔랑', 'sky'], ['🐝', '벌', '윙윙', 'sky'], ['🦆', '오리', '꽥꽥', 'sea'], ['🐴', '말', '히힝', 'land'], ['🐑', '양', '매애', 'land'], ['🐭', '쥐', '찍찍', 'land']];
  var PLANTS = [['🌳', '나무'], ['🌸', '꽃'], ['🌵', '선인장'], ['🌻', '해바라기'], ['🍀', '클로버'], ['🌹', '장미'], ['🌴', '야자나무'], ['🌾', '벼']];
  var NONLIVING = [['🪨', '돌'], ['🚗', '자동차'], ['🧸', '인형'], ['📱', '전화기'], ['⚽', '공'], ['🪑', '의자']];
  var FLOAT = [['🍎', '사과', true], ['🪨', '돌', false], ['🦆', '오리 장난감', true], ['🔑', '열쇠', false], ['🎈', '풍선', true], ['🥄', '쇠숟가락', false], ['🪵', '나무토막', true], ['🧱', '벽돌', false], ['🍋', '레몬', true], ['🪙', '동전', false], ['⚽', '공', true], ['🔩', '나사', false]];
  var WEATHER = [['☀️', '맑음', '🕶️', '선글라스'], ['🌧️', '비', '☂️', '우산'], ['❄️', '눈', '🧤', '장갑'], ['🌬️', '바람', '🧥', '외투'], ['⛅', '구름', '🧢', '모자'], ['🌈', '무지개', '📷', '사진기']];
  var BODY = [['👀', '눈', '보기'], ['👂', '귀', '듣기'], ['👃', '코', '냄새 맡기'], ['👄', '입', '먹기'], ['✋', '손', '만지기'], ['🦶', '발', '걷기'], ['🦷', '이', '씹기'], ['🧠', '뇌', '생각하기'], ['❤️', '심장', '두근두근']];
  var SEASONS = [['🌸', '봄', '꽃이 피어요', '🌱'], ['☀️', '여름', '덥고 수영해요', '🏖️'], ['🍂', '가을', '낙엽이 떨어져요', '🍁'], ['❄️', '겨울', '눈이 와요', '⛄']];
  var BABY = [['🐔', '🐥', '닭', '병아리'], ['🐸', '🐸', '개구리', '올챙이'], ['🦋', '🐛', '나비', '애벌레'], ['🐶', '🐶', '개', '강아지'], ['🐮', '🐄', '소', '송아지'], ['🐴', '🐎', '말', '망아지']];
  var FOOD = [['🐰', '🥕', '토끼'], ['🐵', '🍌', '원숭이'], ['🐼', '🎋', '판다'], ['🐱', '🐟', '고양이'], ['🐘', '🍌', '코끼리'], ['🐨', '🌿', '코알라'], ['🐿️', '🌰', '다람쥐'], ['🐝', '🌸', '벌']];
  var SPACE = [['☀️', '해', '낮에 떠요, 아주 뜨거워요'], ['🌙', '달', '밤에 떠요, 모양이 바뀌어요'], ['⭐', '별', '밤에 반짝여요'], ['🌍', '지구', '우리가 사는 곳'], ['🚀', '로켓', '우주로 날아가요'], ['🪐', '토성', '고리가 있는 행성']];

  function home() {
    main.innerHTML = '';
    K.menu(main, [
      { icon: '🐶', label: '동물 소리', mode: 'sound', color: '#ffe4a1', run: soundQuiz },
      { icon: '🌊', label: '어디에 살까?', mode: 'habitat', color: '#e9f3ff', run: habitatQuiz },
      { icon: '🌱', label: '살아있을까?', mode: 'alive', color: '#e3f7cf', run: aliveQuiz },
      { icon: '🛁', label: '뜰까? 가라앉을까?', mode: 'float', color: '#d0f4de', run: floatQuiz },
      { icon: '🌤️', label: '날씨와 준비물', mode: 'weather', color: '#fff3c4', run: weatherQuiz },
      { icon: '🧍', label: '우리 몸', mode: 'body', color: '#ffe9ee', run: bodyQuiz },
      { icon: '🍂', label: '사계절', mode: 'season', color: '#ffd9e8', run: seasonQuiz },
      { icon: '🐣', label: '아기 동물', mode: 'baby', color: '#ece6f5', run: babyQuiz },
      { icon: '🥕', label: '뭘 먹을까?', mode: 'food', color: '#e2ece9', run: foodQuiz },
      { icon: '🚀', label: '하늘과 우주', mode: 'space', color: '#cfd8ff', run: spaceQuiz }
    ]);
  }
  function quiz(mode, total, make) { main.innerHTML = ''; main.appendChild(K.backButton(home)); var box = el('div'); main.appendChild(box); K.runQuiz({ el: box, mode: mode, total: total, make: make, onFinish: home }); }
  function soundQuiz() {
    quiz('sound', 8, function (i, lv) {
      var n = lv === 1 ? 3 : 4; var opts = K.sample(ANIMALS.slice(0, lv <= 2 ? 10 : 20), n); var ans = K.pick(opts);
      if (lv >= 3 && i % 2) return { prompt: ans[0], big: true, say: ans[1] + '는 어떻게 울까요?', cols: n, choices: opts.map(function (o) { return { html: o[2], cls: 'text', correct: o === ans, say: o[2] }; }) };
      return { prompt: '🔊 "' + ans[2] + '" 누구일까요?', say: ans[2] + ', ' + ans[2] + '. 누구일까요?', cols: n, choices: opts.map(function (o) { return { html: o[0], correct: o === ans, say: o[1] + ', ' + o[2] }; }) };
    });
  }
  function habitatQuiz() {
    var H = { land: ['🌳 땅', '땅'], sea: ['🌊 물', '물'], sky: ['☁️ 하늘', '하늘'] };
    quiz('habitat', 8, function (i, lv) {
      var a = K.pick(ANIMALS);
      if (lv >= 3 && i % 2) { var where = K.pick(['land', 'sea', 'sky']); var opts = K.sample(ANIMALS.filter(function (x) { return x[3] !== where; }), 3).concat([K.pick(ANIMALS.filter(function (x) { return x[3] === where; }))]); return { prompt: H[where][0] + '에 사는 동물은?', say: H[where][1] + '에 사는 동물은 누구일까요?', cols: 4, choices: K.shuffle(opts).map(function (o) { return { html: o[0], correct: o[3] === where, say: o[1] }; }) }; }
      return { prompt: a[0] + ' ' + a[1], say: a[1] + '는 어디에 살까요?', cols: 3, choices: ['land', 'sea', 'sky'].map(function (h) { return { html: H[h][0], cls: 'text', correct: a[3] === h, say: H[h][1] }; }) };
    });
  }
  function aliveQuiz() {
    quiz('alive', 8, function (i, lv) {
      var living = ANIMALS.map(function (a) { return [a[0], a[1], 'animal']; }).concat(PLANTS.map(function (p) { return [p[0], p[1], 'plant']; }));
      if (lv >= 3 && i % 2) { var kind = K.pick(['animal', 'plant']); var opts = K.sample(living.filter(function (x) { return x[2] !== kind; }), 3).concat([K.pick(living.filter(function (x) { return x[2] === kind; }))]); return { prompt: kind === 'animal' ? '동물은 어느 것?' : '식물은 어느 것?', say: kind === 'animal' ? '동물은 어느 것일까요?' : '식물은 어느 것일까요?', cols: 4, choices: K.shuffle(opts).map(function (o) { return { html: o[0], correct: o[2] === kind, say: o[1] }; }) }; }
      var item = K.pick(living.concat(NONLIVING.map(function (n) { return [n[0], n[1], 'thing']; })));
      return { prompt: item[0] + ' ' + item[1], say: item[1] + '는 살아있을까요?', cols: 2, choices: [{ html: '💚 살아있어요', cls: 'text', correct: item[2] !== 'thing' }, { html: '🪨 살아있지 않아요', cls: 'text', correct: item[2] === 'thing' }] };
    });
  }
  function floatQuiz() {
    main.innerHTML = ''; main.appendChild(K.backButton(home));
    var lv = K.getLevel('float'); var items = K.shuffle(FLOAT).slice(0, 6); var idx = 0, score = 0;
    var box = el('div', { class: 'kl-stage' }); main.appendChild(box);
    function next() {
      if (idx >= items.length) { box.innerHTML = ''; if (score >= 5 && lv < 5) K.setLevel('float', lv + 1); box.appendChild(el('div', { class: 'kl-result' }, [el('div', { class: 'kl-result-emoji', text: '🧪' }), el('div', { class: 'kl-result-title', text: score + ' / ' + items.length + ' 맞혔어요!' }), el('div', { class: 'kl-row' }, [el('button', { class: 'kl-btn primary', text: '🔁 한 번 더', onclick: floatQuiz }), el('button', { class: 'kl-btn', text: '🏠 처음으로', onclick: home })])])); K.sfx.win(); K.confetti(); return; }
      var it = items[idx]; box.innerHTML = '';
      box.appendChild(el('div', { class: 'kl-prompt', text: it[0] + ' ' + it[1] + '을 물에 넣으면?' }));
      var tank = el('div', { class: 'tank' }); var item = el('div', { class: 'item', text: it[0], style: 'top:-20px' }); tank.appendChild(item); box.appendChild(tank);
      var row = el('div', { class: 'kl-choices cols2', style: 'margin-top:16px' });
      [['🎈 떠요', true], ['⬇️ 가라앉아요', false]].forEach(function (c) {
        var b = el('button', { class: 'kl-choice text', text: c[0] });
        b.addEventListener('click', function () {
          row.querySelectorAll('button').forEach(function (x) { x.disabled = true; });
          item.style.top = it[2] ? '30px' : '180px';
          setTimeout(function () {
            if (c[1] === it[2]) { b.classList.add('right'); K.sfx.correct(); K.addStar(1); K.event('correct'); score++; K.speak(it[1] + '은 ' + (it[2] ? '떠요!' : '가라앉아요!')); }
            else { b.classList.add('wrong'); K.sfx.wrong(); K.speak('아쉬워요. ' + it[1] + '은 ' + (it[2] ? '떠요' : '가라앉아요')); }
            idx++; setTimeout(next, 1600);
          }, 1300);
        });
        row.appendChild(b);
      });
      box.appendChild(row); K.speak(it[1] + '을 물에 넣으면 어떻게 될까요?');
    }
    next();
  }
  function weatherQuiz() {
    quiz('weather', 8, function (i, lv) {
      var w = K.pick(WEATHER); var wrong = K.sample(WEATHER, 3, [w]);
      if (i % 2) return { prompt: w[0] + ' ' + w[1], say: w[1] + ' 날씨에는 무엇이 필요할까요?', cols: 4, choices: K.shuffle([w].concat(wrong)).map(function (o) { return { html: o[2], correct: o === w, say: o[3] }; }) };
      return { prompt: w[0], big: true, say: '무슨 날씨일까요?', cols: 4, choices: K.shuffle([w].concat(wrong)).map(function (o) { return { html: o[1], cls: 'text', correct: o === w, say: o[1] }; }) };
    });
  }
  function bodyQuiz() {
    quiz('body', 8, function (i, lv) {
      var b = K.pick(BODY); var wrong = K.sample(BODY, 3, [b]);
      if (lv >= 2 && i % 2) return { prompt: b[2] + '는 무엇으로?', say: b[2] + '는 무엇으로 할까요?', cols: 4, choices: K.shuffle([b].concat(wrong)).map(function (o) { return { html: o[0], correct: o === b, say: o[1] }; }) };
      return { prompt: b[0], big: true, say: '이것은 무엇일까요?', cols: 4, choices: K.shuffle([b].concat(wrong)).map(function (o) { return { html: o[1], cls: 'text', correct: o === b, say: o[1] }; }) };
    });
  }
  function seasonQuiz() {
    quiz('season', 8, function (i, lv) {
      var s = K.pick(SEASONS);
      if (i % 2) return { prompt: s[3] + ' ' + s[2], say: s[2] + '. 무슨 계절일까요?', cols: 4, choices: SEASONS.map(function (o) { return { html: o[0] + '<div style="font-size:22px">' + o[1] + '</div>', correct: o === s, say: o[1] }; }) };
      return { prompt: s[1] + '에는?', say: s[1] + '에는 어떤 일이 있을까요?', cols: 4, choices: K.shuffle(SEASONS).map(function (o) { return { html: o[3] + '<div style="font-size:18px">' + o[2] + '</div>', correct: o === s, say: o[2] }; }) };
    });
  }
  function babyQuiz() {
    quiz('baby', 6, function (i, lv) {
      var b = K.pick(BABY); var wrong = K.sample(BABY, 3, [b]);
      return { prompt: b[0] + ' ' + b[2] + '의 아기는?', say: b[2] + '의 아기는 누구일까요?', cols: 4, choices: K.shuffle([b].concat(wrong)).map(function (o) { return { html: o[1] + '<div style="font-size:20px">' + o[3] + '</div>', correct: o === b, say: o[3] }; }) };
    });
  }
  function foodQuiz() {
    quiz('food', 8, function (i, lv) {
      var f = K.pick(FOOD); var wrong = K.sample(FOOD, 3, [f]).filter(function (x) { return x[1] !== f[1]; }).slice(0, 3);
      while (wrong.length < 3) wrong.push(['', K.pick(['🍕', '🍔', '🍭', '🍩'])]);
      return { prompt: f[0] + ' ' + f[2], say: f[2] + '는 무엇을 먹을까요?', cols: 4, choices: K.shuffle([f].concat(wrong)).map(function (o) { return { html: o[1], correct: o === f }; }) };
    });
  }
  function spaceQuiz() {
    quiz('space', 6, function (i, lv) {
      var s = K.pick(SPACE); var wrong = K.sample(SPACE, 3, [s]);
      if (i % 2) return { prompt: s[2], say: s[2] + '. 무엇일까요?', cols: 4, choices: K.shuffle([s].concat(wrong)).map(function (o) { return { html: o[0], correct: o === s, say: o[1] }; }) };
      return { prompt: s[0], big: true, say: '이것은 무엇일까요?', cols: 4, choices: K.shuffle([s].concat(wrong)).map(function (o) { return { html: o[1], cls: 'text', correct: o === s, say: o[1] }; }) };
    });
  }
  home();
})();
</script>
</body>
</html>
