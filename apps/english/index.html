<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 놀이</title>
<link rel="stylesheet" href="../../shared/app.css">
<style>
  .abc { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  .abc button { background: #fff; border-radius: 18px; padding: 10px 4px; box-shadow: 0 5px 0 rgba(0,0,0,.08); }
  .abc button:hover { background: #e9f3ff; transform: scale(1.05); }
  .abc .ch { font-size: 44px; font-weight: 900; color: #1982c4; }
  .abc .em { font-size: 34px; }
  .abc .wd { font-size: 16px; color: #666; }
  .color-chip { display: inline-block; width: 90px; height: 90px; border-radius: 20px; border: 4px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,.2); }
</style>
</head>
<body data-app="english">
<main id="main"></main>
<script src="../../shared/kid.js"></script>
<script src="../../shared/glyphs.js"></script>
<script src="../../shared/trace.js"></script>
<script>
(function () {
  var K = KidLab, el = K.el;
  K.header({ title: '영어 놀이', icon: '🔤', say: 'English' });
  var main = document.getElementById('main');
  var ABC = [['A', 'apple', '🍎', '사과'], ['B', 'bear', '🐻', '곰'], ['C', 'cat', '🐱', '고양이'], ['D', 'dog', '🐶', '강아지'], ['E', 'egg', '🥚', '달걀'], ['F', 'fish', '🐟', '물고기'], ['G', 'grapes', '🍇', '포도'], ['H', 'hat', '🎩', '모자'], ['I', 'ice cream', '🍦', '아이스크림'], ['J', 'juice', '🧃', '주스'], ['K', 'kite', '🪁', '연'], ['L', 'lion', '🦁', '사자'], ['M', 'moon', '🌙', '달'], ['N', 'nose', '👃', '코'], ['O', 'orange', '🍊', '오렌지'], ['P', 'pig', '🐷', '돼지'], ['Q', 'queen', '👸', '여왕'], ['R', 'rabbit', '🐰', '토끼'], ['S', 'sun', '☀️', '해'], ['T', 'tiger', '🐯', '호랑이'], ['U', 'umbrella', '☂️', '우산'], ['V', 'violin', '🎻', '바이올린'], ['W', 'water', '💧', '물'], ['X', 'x-ray', '🦴', '엑스레이'], ['Y', 'yellow', '💛', '노랑'], ['Z', 'zebra', '🦓', '얼룩말']];
  var WORDS = ABC.map(function (a) { return [a[1], a[2], a[3]]; }).concat([['banana', '🍌', '바나나'], ['car', '🚗', '자동차'], ['book', '📖', '책'], ['ball', '⚽', '공'], ['house', '🏠', '집'], ['tree', '🌳', '나무'], ['flower', '🌸', '꽃'], ['star', '⭐', '별'], ['bird', '🐦', '새'], ['cow', '🐮', '소'], ['duck', '🦆', '오리'], ['frog', '🐸', '개구리'], ['milk', '🥛', '우유'], ['bread', '🍞', '빵'], ['cake', '🎂', '케이크'], ['bus', '🚌', '버스'], ['train', '🚂', '기차'], ['airplane', '✈️', '비행기'], ['hand', '✋', '손'], ['eye', '👁️', '눈'], ['ear', '👂', '귀'], ['mouth', '👄', '입'], ['heart', '❤️', '하트'], ['rain', '🌧️', '비'], ['snow', '❄️', '눈'], ['monkey', '🐵', '원숭이'], ['elephant', '🐘', '코끼리'], ['strawberry', '🍓', '딸기'], ['pizza', '🍕', '피자'], ['robot', '🤖', '로봇']]);
  /* 영단어 단계: [영어, 그림(없으면 ''), 우리말]. 단계마다 뜻이 겹치지 않게 골랐다 */
  var STEPS = [
    { name: '1단계 · 동물과 물건', icon: '🐣', w: [['cat', '🐱', '고양이'], ['dog', '🐶', '개'], ['pig', '🐷', '돼지'], ['fish', '🐟', '물고기'], ['egg', '🥚', '달걀'], ['sun', '☀️', '해'], ['moon', '🌙', '달'], ['hat', '🎩', '모자'], ['cup', '☕', '컵'], ['bed', '🛏️', '침대'], ['key', '🔑', '열쇠'], ['box', '📦', '상자'], ['bee', '🐝', '벌'], ['ant', '🐜', '개미'], ['bag', '👜', '가방'], ['shoe', '👟', '신발'], ['door', '🚪', '문'], ['fox', '🦊', '여우'], ['bear', '🐻', '곰'], ['lion', '🦁', '사자'], ['rabbit', '🐰', '토끼'], ['tiger', '🐯', '호랑이'], ['apple', '🍎', '사과'], ['duck', '🦆', '오리']] },
    { name: '2단계 · 음식과 자연', icon: '🌱', w: [['water', '💧', '물'], ['rice', '🍚', '밥'], ['grape', '🍇', '포도'], ['lemon', '🍋', '레몬'], ['carrot', '🥕', '당근'], ['corn', '🌽', '옥수수'], ['cookie', '🍪', '쿠키'], ['cheese', '🧀', '치즈'], ['candy', '🍬', '사탕'], ['tooth', '🦷', '이(치아)'], ['nose', '👃', '코'], ['foot', '🦶', '발'], ['leg', '🦵', '다리'], ['sea', '🌊', '바다'], ['cloud', '☁️', '구름'], ['mountain', '⛰️', '산'], ['fire', '🔥', '불'], ['leaf', '🍃', '나뭇잎'], ['rainbow', '🌈', '무지개'], ['school', '🏫', '학교'], ['clock', '⏰', '시계'], ['chair', '🪑', '의자'], ['bike', '🚲', '자전거'], ['tree', '🌳', '나무']] },
    { name: '3단계 · 움직임 말', icon: '🏃', w: [['run', '', '달리다'], ['walk', '', '걷다'], ['eat', '', '먹다'], ['drink', '', '마시다'], ['sleep', '', '자다'], ['read', '', '읽다'], ['write', '', '쓰다'], ['sing', '', '노래하다'], ['swim', '', '수영하다'], ['jump', '', '뛰어오르다'], ['open', '', '열다'], ['close', '', '닫다'], ['sit', '', '앉다'], ['stand', '', '서다'], ['look', '', '보다'], ['listen', '', '듣다'], ['go', '', '가다'], ['come', '', '오다'], ['play', '', '놀다'], ['help', '', '돕다'], ['cry', '', '울다'], ['laugh', '', '웃다'], ['wash', '', '씻다'], ['cook', '', '요리하다']] },
    { name: '4단계 · 꾸미는 말', icon: '🎨', w: [['big', '', '큰'], ['small', '', '작은'], ['hot', '', '뜨거운'], ['cold', '', '차가운'], ['happy', '', '행복한'], ['sad', '', '슬픈'], ['fast', '', '빠른'], ['slow', '', '느린'], ['long', '', '긴'], ['short', '', '짧은'], ['new', '', '새로운'], ['old', '', '오래된'], ['clean', '', '깨끗한'], ['dirty', '', '더러운'], ['full', '', '가득 찬'], ['empty', '', '텅 빈'], ['heavy', '', '무거운'], ['light', '', '가벼운'], ['quiet', '', '조용한'], ['loud', '', '시끄러운'], ['kind', '', '친절한'], ['brave', '', '용감한'], ['hungry', '', '배고픈'], ['sleepy', '', '졸린']] },
    { name: '5단계 · 때와 곳, 사람', icon: '🏙️', w: [['morning', '', '아침'], ['night', '', '밤'], ['today', '', '오늘'], ['tomorrow', '', '내일'], ['yesterday', '', '어제'], ['week', '', '일주일'], ['family', '', '가족'], ['friend', '', '친구'], ['teacher', '', '선생님'], ['doctor', '', '의사'], ['library', '', '도서관'], ['hospital', '', '병원'], ['park', '', '공원'], ['market', '', '시장'], ['kitchen', '', '부엌'], ['window', '', '창문'], ['question', '', '질문'], ['answer', '', '대답'], ['story', '', '이야기'], ['music', '', '음악'], ['weather', '', '날씨'], ['season', '', '계절'], ['holiday', '', '휴일'], ['birthday', '', '생일']] }
  ];
  var COLORS = [['red', '#e63946', '빨강'], ['blue', '#1982c4', '파랑'], ['yellow', '#ffca3a', '노랑'], ['green', '#4caf50', '초록'], ['orange', '#ff8c42', '주황'], ['purple', '#8e44ad', '보라'], ['pink', '#ff8fa3', '분홍'], ['black', '#222', '검정'], ['white', '#fafafa', '하양'], ['brown', '#8d5524', '갈색']];
  var NUMS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
  var ANIMAL_EMO = { cat: '🐱', dog: '🐶', bear: '🐻', lion: '🦁', pig: '🐷', rabbit: '🐰', tiger: '🐯', zebra: '🦓', fish: '🐟', cow: '🐮', duck: '🦆', frog: '🐸', bird: '🐦', monkey: '🐵', elephant: '🐘' };
  var GREET = [['Hello!', '안녕!', '👋'], ['Good morning!', '좋은 아침!', '🌅'], ['Good night!', '잘 자!', '🌙'], ['Thank you!', '고마워!', '🙏'], ['I\'m sorry.', '미안해.', '😢'], ['I love you!', '사랑해!', '❤️'], ['Let\'s play!', '같이 놀자!', '🎈'], ['I\'m hungry.', '배고파.', '🍽️'], ['Good job!', '잘했어!', '👍'], ['See you!', '또 만나!', '🚪']];

  function home() {
    main.innerHTML = '';
    K.menu(main, [
      { icon: '🅰️', label: 'ABC 배우기', color: '#e9f3ff', run: learnABC },
      { icon: '👂', label: '알파벳 듣고 찾기', mode: 'abc', color: '#fff3c4', run: abcQuiz },
      { icon: '🍎', label: '그림 낱말', mode: 'word', color: '#ffe9ee', run: wordQuiz },
      { icon: '🔤', label: '첫 글자 찾기', mode: 'first', color: '#e3f7cf', run: firstLetter },
      { icon: '🎨', label: '색깔 영어', mode: 'color', color: '#ffe4a1', run: colorQuiz },
      { icon: '🔢', label: '숫자 영어', mode: 'num', color: '#ece6f5', run: numQuiz },
      { icon: '🔡', label: '대문자·소문자', mode: 'case', color: '#d0f4de', run: caseQuiz },
      { icon: '👋', label: '인사말', mode: 'greet', color: '#ffd9e8', run: greetQuiz },
      { icon: '📚', label: '영단어 단계 (1~5)', color: '#cfe8ff', run: steps },
      { icon: '✏️', label: '따라 쓰기', color: '#ffd6a5', run: function () { KidTrace.start(main, ['upper', 'lower'], home); } }
    ]);
  }
  function learnABC() {
    main.innerHTML = ''; main.appendChild(K.backButton(home));
    main.appendChild(el('div', { class: 'kl-hint', text: '글자를 누르면 영어로 읽어줘요' }));
    var g = el('div', { class: 'abc' });
    ABC.forEach(function (a) {
      var b = el('button', {}, [el('div', { class: 'ch', text: a[0] + a[0].toLowerCase() }), el('div', { class: 'em', text: a[2] }), el('div', { class: 'wd', text: a[1] })]);
      b.addEventListener('click', function () { K.sfx.pop(); K.speakEn(a[0] + '. ' + a[0] + ' is for ' + a[1] + '.'); K.event('learn'); });
      g.appendChild(b);
    });
    main.appendChild(g);
  }
  function quiz(mode, total, make) { main.innerHTML = ''; main.appendChild(K.backButton(home)); var box = el('div'); main.appendChild(box); K.runQuiz({ el: box, mode: mode, total: total, make: make, onFinish: home }); }
  function abcQuiz() {
    quiz('abc', 8, function (i, lv) {
      var pool = ABC.slice(0, lv === 1 ? 8 : lv === 2 ? 16 : 26); var n = lv === 1 ? 3 : 4;
      var opts = K.sample(pool, n); var ans = K.pick(opts);
      var lower = lv >= 4;
      return { prompt: '🔊 어떤 글자일까요?', say: ans[0], sayLang: 'en-US', cols: n, choices: K.shuffle(opts).map(function (o) { return { html: lower ? o[0].toLowerCase() : o[0], correct: o === ans, say: o[0], sayLang: 'en-US' }; }) };
    });
  }
  function wordQuiz() {
    quiz('word', 8, function (i, lv) {
      var n = lv === 1 ? 2 : lv === 2 ? 3 : 4;
      var opts = K.sample(WORDS, n); var ans = K.pick(opts);
      if (lv >= 4 && i % 2) return { prompt: ans[1], big: true, say: 'What is this?', sayLang: 'en-US', cols: n, choices: opts.map(function (o) { return { html: o[0], correct: o === ans, cls: 'text', say: o[0], sayLang: 'en-US' }; }) };
      return { prompt: ans[0], sub: lv <= 2 ? ans[2] : '', say: ans[0], sayLang: 'en-US', cols: n, choices: opts.map(function (o) { return { html: o[1], correct: o === ans, say: o[0], sayLang: 'en-US' }; }) };
    });
  }
  function firstLetter() {
    quiz('first', 8, function (i, lv) {
      var w = K.pick(WORDS); var first = w[0][0].toUpperCase();
      var letters = ABC.map(function (a) { return a[0]; });
      var wrong = K.sample(letters, lv === 1 ? 2 : 3, [first]);
      return { prompt: w[1] + '<div style="font-size:30px;color:#777">_' + w[0].slice(1) + '</div>', big: true, say: w[0], sayLang: 'en-US', cols: wrong.length + 1, choices: K.shuffle([first].concat(wrong)).map(function (x) { return { html: lv >= 3 ? x.toLowerCase() : x, correct: x === first, say: x, sayLang: 'en-US' }; }) };
    });
  }
  function colorQuiz() {
    quiz('color', 8, function (i, lv) {
      var n = lv === 1 ? 3 : 4; var opts = K.sample(COLORS, n); var ans = K.pick(opts);
      if (lv >= 3 && i % 2) return { prompt: '<span class="color-chip" style="background:' + ans[1] + '"></span>', say: 'What color is this?', sayLang: 'en-US', cols: n, choices: opts.map(function (o) { return { html: o[0], correct: o === ans, cls: 'text', say: o[0], sayLang: 'en-US' }; }) };
      return { prompt: ans[0], sub: lv === 1 ? ans[2] : '', say: ans[0], sayLang: 'en-US', cols: n, choices: opts.map(function (o) { return { html: '<span class="color-chip" style="background:' + o[1] + '"></span>', correct: o === ans, say: o[0], sayLang: 'en-US' }; }) };
    });
  }
  function numQuiz() {
    quiz('num', 8, function (i, lv) {
      var max = lv === 1 ? 5 : 10; var ans = K.randInt(1, max);
      var wrong = []; while (wrong.length < 3) { var w = K.randInt(1, max); if (w !== ans && wrong.indexOf(w) < 0) wrong.push(w); }
      var emo = K.pick(['🍎', '⭐', '🐥', '🎈', '🍪']);
      if (lv >= 3) return { prompt: NUMS[ans], say: NUMS[ans], sayLang: 'en-US', cols: 4, choices: K.shuffle([ans].concat(wrong)).map(function (x) { return { html: lv >= 4 ? emo.repeat(x) : String(x), correct: x === ans, cls: lv >= 4 ? 'small' : '', say: NUMS[x], sayLang: 'en-US' }; }) };
      return { prompt: emo.repeat(ans), say: 'How many?', sayLang: 'en-US', cols: 4, choices: K.shuffle([ans].concat(wrong)).map(function (x) { return { html: lv === 1 ? x + '<div style="font-size:18px">' + NUMS[x] + '</div>' : NUMS[x], cls: lv === 1 ? '' : 'text', correct: x === ans, say: NUMS[x], sayLang: 'en-US' }; }) };
    });
  }
  function caseQuiz() {
    quiz('case', 8, function (i, lv) {
      var a = K.pick(ABC); var wrong = K.sample(ABC, 3, [a]);
      var toUpper = i % 2 === 0;
      return { prompt: toUpper ? a[0].toLowerCase() : a[0], big: true, sub: toUpper ? '짝꿍 대문자를 찾아요' : '짝꿍 소문자를 찾아요', say: a[0], sayLang: 'en-US', cols: 4, choices: K.shuffle([a].concat(wrong)).map(function (x) { return { html: toUpper ? x[0] : x[0].toLowerCase(), correct: x === a, say: x[0], sayLang: 'en-US' }; }) };
    });
  }
  function greetQuiz() {
    quiz('greet', 8, function (i, lv) {
      var opts = K.sample(GREET, lv === 1 ? 2 : 3); var ans = K.pick(opts);
      return { prompt: ans[2] + ' ' + ans[0], say: ans[0], sayLang: 'en-US', cols: opts.length, choices: opts.map(function (o) { return { html: o[1], cls: 'text', correct: o === ans, say: o[0], sayLang: 'en-US' }; }) };
    });
  }
  /* ---------- 영단어 단계 ---------- */
  function steps() {
    main.innerHTML = ''; main.appendChild(K.backButton(home));
    var items = STEPS.map(function (st, k) {
      return { icon: st.icon, label: st.name, mode: 'step' + (k + 1), color: ['#fff3c4', '#e3f7cf', '#ffe9ee', '#ece6f5', '#e9f3ff'][k], run: function () { stepMenu(k); } };
    });
    K.menu(main, items);
    main.appendChild(el('div', { class: 'kl-hint', text: '단계마다 낱말 ' + STEPS[0].w.length + '개 · 그림, 뜻, 듣기 문제가 섞여 나와요' }));
  }
  function stepMenu(k) {
    var st = STEPS[k];
    main.innerHTML = ''; main.appendChild(K.backButton(steps));
    main.appendChild(el('div', { class: 'kl-prompt', text: st.icon + ' ' + st.name, style: 'font-size:24px;margin-bottom:8px' }));
    K.menu(main, [
      { icon: '🧩', label: '문제 풀기', mode: 'step' + (k + 1), color: '#fff3c4', run: function () { stepQuiz(k); } },
      { icon: '📖', label: '낱말장 보기', color: '#e9f3ff', run: function () { stepList(k); } }
    ]);
  }
  function stepList(k) {
    var st = STEPS[k];
    main.innerHTML = ''; main.appendChild(K.backButton(function () { stepMenu(k); }));
    var grid = el('div', { class: 'abc' });
    st.w.forEach(function (w) {
      var b = el('button', {}, [w[1] ? el('div', { class: 'em', text: w[1] }) : null, el('div', { class: 'ch', text: w[0], style: 'font-size:26px' }), el('div', { class: 'wd', text: w[2] })]);
      b.addEventListener('click', function () { K.sfx.pop(); K.speakEn(w[0]); K.event('learn'); });
      grid.appendChild(b);
    });
    main.appendChild(grid);
  }
  function stepQuiz(k) {
    var st = STEPS[k], pool = st.w, pics = pool.filter(function (w) { return w[1]; });
    main.innerHTML = ''; main.appendChild(K.backButton(function () { stepMenu(k); }));
    var box = el('div'); main.appendChild(box);
    K.runQuiz({
      el: box, mode: 'step' + (k + 1), total: 8, onFinish: function () { stepMenu(k); },
      make: function (i, lv) {
        var n = lv <= 1 ? 3 : 4;
        var kinds = pics.length ? ['pic', 'word2pic', 'mean', 'rmean', 'listen'] : ['mean', 'rmean', 'listen'];
        if (lv <= 1) kinds = pics.length ? ['pic', 'word2pic', 'mean'] : ['mean', 'rmean'];
        var kind = kinds[i % kinds.length];
        var src = kind === 'pic' || kind === 'word2pic' ? pics : pool;
        var ans = K.pick(src);
        var opts = K.shuffle([ans].concat(K.sample(src.filter(function (x) { return x !== ans; }), n - 1)));
        var en = function (o) { return { html: o[0], cls: 'text', correct: o === ans, say: o[0], sayLang: 'en-US' }; };
        if (kind === 'pic') return { key: 'p' + ans[0], prompt: ans[1], big: true, sub: '영어로 뭘까요?', say: 'What is this?', sayLang: 'en-US', cols: 2, choices: opts.map(en) };
        if (kind === 'word2pic') return { key: 'w' + ans[0], prompt: ans[0], sub: lv <= 2 ? ans[2] : '', say: ans[0], sayLang: 'en-US', cols: n, choices: opts.map(function (o) { return { html: o[1], correct: o === ans, say: o[0], sayLang: 'en-US' }; }) };
        if (kind === 'mean') return { key: 'm' + ans[0], prompt: ans[0], sub: '우리말 뜻은?', say: ans[0], sayLang: 'en-US', cols: 2, choices: opts.map(function (o) { return { html: o[2], cls: 'text', correct: o === ans }; }) };
        if (kind === 'rmean') return { key: 'r' + ans[0], prompt: ans[2], sub: '영어로는?', say: ans[2] + '. 영어로는?', cols: 2, choices: opts.map(en) };
        return { key: 'l' + ans[0], prompt: '🔊', big: true, sub: '잘 듣고 알맞은 낱말을 골라요', say: ans[0], sayLang: 'en-US', cols: 2, choices: opts.map(en) };
      }
    });
  }

  home();
})();
</script>
</body>
</html>
