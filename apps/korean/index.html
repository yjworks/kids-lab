<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리말 탐험</title>
<link rel="stylesheet" href="../../shared/app.css">
<style>
  .qword { font-size: 44px; font-weight: 900; letter-spacing: 2px; }
  .qhan { font-size: 20px; color: #6b6b6b; font-weight: 800; font-family: "Noto Serif KR", "Batang", serif; }
  .qsub { font-size: 18px; margin-top: 6px; }
  .opt { font-size: 19px; font-weight: 800; text-align: left; line-height: 1.45; word-break: keep-all; }
  .opt.big { font-size: 26px; text-align: center; }
  .gap { display: inline-block; min-width: 3.2em; border-bottom: 5px dashed #b08fd8; color: #b08fd8; }
  .dict { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .dict div { background: #fff; border-radius: 16px; padding: 10px 14px; box-shadow: 0 3px 0 rgba(0,0,0,.06); }
  .dict b { font-size: 20px; } .dict small { color: #6b6b6b; font-weight: 800; margin-left: 6px; font-family: "Noto Serif KR", "Batang", serif; }
  .dict p { margin: 4px 0 0; font-weight: 700; color: #444; line-height: 1.45; word-break: keep-all; }
  body[data-app="korean"] .kl-choice { min-height: 0; padding: 14px 16px; }
  @media (max-width: 760px) { .qword { font-size: 32px; } .opt { font-size: 16px; } .opt.big { font-size: 21px; } .dict { grid-template-columns: 1fr; } }
</style>
</head>
<body data-app="korean">
<main id="main"></main>
<script src="../../shared/kid.js"></script>
<script>
(function () {
  var K = KidLab, el = K.el;
  K.header({ title: '우리말 탐험', icon: '💬', say: '우리말 탐험' });
  var main = document.getElementById('main');

  /* 학년별 낱말 [낱말, 뜻] - 뜻풀이는 이 앱을 위해 쉬운 말로 새로 썼다 */
  var WORDS = {
    1: [['부지런하다', '게으르지 않고 꾸준히 일을 잘하다'], ['조심하다', '사고나 실수가 나지 않게 마음을 쓰다'], ['씩씩하다', '굳세고 힘차다'],
        ['양보하다', '자리나 물건을 남에게 먼저 내주다'], ['사이좋다', '서로 다투지 않고 잘 지내다'], ['정리하다', '흩어진 것을 제자리에 가지런히 놓다'],
        ['차례', '순서대로 돌아오는 자리'], ['약속', '앞으로 할 일을 미리 정해 두는 것'], ['이웃', '가까이 사는 집이나 사람'], ['인사', '만나거나 헤어질 때 예의를 나타내는 말이나 행동']],
    2: [['궁금하다', '무엇이 알고 싶어 마음이 쓰이다'], ['뿌듯하다', '기쁨이나 자랑스러움이 마음에 가득하다'], ['아끼다', '물건이나 돈을 함부로 쓰지 않다'],
        ['흉내', '남의 말이나 행동을 그대로 따라 하는 것'], ['까닭', '일이 생기게 된 이유'], ['마중', '오는 사람을 나가서 맞이하는 것'],
        ['배웅', '떠나는 사람을 따라 나가서 보내는 것'], ['설레다', '기대로 마음이 들떠 두근거리다'], ['서운하다', '바라던 만큼 되지 않아 마음이 아쉽다'], ['용기', '겁내지 않고 씩씩하게 해내는 마음']],
    3: [['관찰', '사물을 자세히 살펴보는 것'], ['비교', '둘 이상을 견주어 같은 점과 다른 점을 살피는 것'], ['예상', '앞으로 일어날 일을 미리 짐작하는 것'],
        ['협동', '여럿이 마음과 힘을 합하는 것'], ['배려', '남을 돕거나 보살피려고 마음을 쓰는 것'], ['습관', '여러 번 되풀이하여 몸에 익은 행동'],
        ['재료', '무엇을 만드는 데 쓰이는 것'], ['정직', '거짓이나 꾸밈이 없이 바르고 곧음'], ['실천', '생각한 것을 실제 행동으로 옮기는 것'], ['소중하다', '매우 귀하고 중요하다']],
    4: [['의견', '어떤 일에 대하여 가지는 생각'], ['근거', '의견이 옳다고 뒷받침하는 까닭'], ['요약', '글이나 말의 중요한 내용을 간추리는 것'],
        ['갈등', '서로 생각이나 바람이 달라 부딪치는 것'], ['해결', '문제나 어려운 일을 잘 풀어 내는 것'], ['환경', '생물을 둘러싸고 있는 자연과 주변'],
        ['전통', '옛날부터 이어 내려오는 생활 모습이나 문화'], ['절약', '아껴서 꼭 필요한 데에만 쓰는 것'], ['존중', '남을 높이고 소중하게 대하는 것'], ['상상', '실제로 없는 것을 머릿속으로 그려 보는 것']],
    5: [['주장', '자기의 생각을 굳게 내세우는 것'], ['타당하다', '이치에 맞아 옳다'], ['비유', '어떤 것을 비슷한 다른 것에 빗대어 나타내는 것'],
        ['영향', '어떤 것이 다른 것에 미치는 작용'], ['공정하다', '어느 한쪽으로 치우치지 않고 올바르다'], ['책임', '맡아서 해야 할 일이나 의무'],
        ['탐구', '원리나 사실을 깊이 파고들어 알아보는 것'], ['논리', '생각이나 말이 이치에 맞게 이어지는 짜임'], ['성찰', '자기의 마음과 행동을 되돌아보는 것'], ['유래', '어떤 일이나 물건이 생겨난 내력']],
    6: [['관점', '사물을 보고 생각하는 입장이나 방향'], ['편견', '한쪽으로 치우친 생각'], ['공감', '남의 생각이나 감정을 자기도 그렇다고 느끼는 것'],
        ['비판', '옳고 그름을 따져 밝히는 것'], ['함축', '말이나 글이 겉으로 드러나지 않은 깊은 뜻을 담고 있는 것'], ['인과', '원인과 결과'],
        ['쟁점', '서로 다투는 중심이 되는 점'], ['자립', '남에게 기대지 않고 스스로 서는 것'], ['신뢰', '굳게 믿고 의지하는 것'], ['다양성', '여러 가지 모양이나 성질이 있음']]
  };
  /* 속담 [앞, 뒤, 뜻] */
  var PROV = [
    ['가는 말이 고와야', '오는 말이 곱다', '내가 남에게 좋게 말해야 남도 나에게 좋게 말한다'],
    ['세 살 버릇', '여든까지 간다', '어릴 때 든 버릇은 늙어서도 고치기 어렵다'],
    ['낮말은 새가 듣고', '밤말은 쥐가 듣는다', '아무도 안 듣는 것 같아도 말은 늘 조심해야 한다'],
    ['백지장도', '맞들면 낫다', '쉬운 일이라도 힘을 합하면 더 쉽다'],
    ['발 없는 말이', '천 리 간다', '말은 순식간에 멀리 퍼지니 조심해야 한다'],
    ['소 잃고', '외양간 고친다', '일이 잘못된 뒤에야 손을 쓴다'],
    ['원숭이도', '나무에서 떨어진다', '아무리 잘하는 사람도 실수할 때가 있다'],
    ['티끌 모아', '태산', '아주 작은 것도 모이면 큰 것이 된다'],
    ['호랑이도 제 말 하면', '온다', '남의 이야기를 하는데 마침 그 사람이 나타난다'],
    ['우물 안', '개구리', '넓은 세상을 모르고 좁은 생각에 갇혀 있다'],
    ['누워서', '떡 먹기', '아주 쉬운 일이다'],
    ['돌다리도', '두들겨 보고 건너라', '잘 아는 일도 조심해서 하라'],
    ['고래 싸움에', '새우 등 터진다', '힘센 쪽끼리 다투는 사이에 약한 쪽이 괜히 피해를 본다'],
    ['등잔 밑이', '어둡다', '가까이 있는 것을 오히려 잘 모른다'],
    ['콩 심은 데 콩 나고', '팥 심은 데 팥 난다', '모든 일은 한 대로 결과가 나온다'],
    ['하늘이 무너져도', '솟아날 구멍이 있다', '아무리 어려워도 헤쳐 나갈 길이 있다'],
    ['빈 수레가', '요란하다', '아는 것 없는 사람이 더 떠든다'],
    ['개구리', '올챙이 적 생각 못 한다', '형편이 나아진 뒤 어려웠던 때를 잊는다'],
    ['꿩 먹고', '알 먹는다', '한 가지 일로 두 가지 이득을 본다'],
    ['열 번 찍어', '안 넘어가는 나무 없다', '꾸준히 노력하면 결국 이룰 수 있다']
  ];
  /* 사자성어 [성어, 한자, 뜻] */
  var IDIOM = [
    ['일석이조', '一石二鳥', '한 가지 일로 두 가지 이득을 얻음'], ['동문서답', '東問西答', '묻는 말에 엉뚱한 대답을 함'],
    ['작심삼일', '作心三日', '굳게 먹은 마음이 사흘을 가지 못함'], ['유비무환', '有備無患', '미리 준비해 두면 걱정할 것이 없음'],
    ['우공이산', '愚公移山', '꾸준히 노력하면 큰일도 이룰 수 있음'], ['역지사지', '易地思之', '처지를 바꾸어 생각해 봄'],
    ['이심전심', '以心傳心', '말하지 않아도 마음과 마음으로 뜻이 통함'], ['일취월장', '日就月將', '날로 달로 자라거나 발전함'],
    ['자업자득', '自業自得', '자기가 한 일의 결과를 자기가 받음'], ['새옹지마', '塞翁之馬', '좋은 일과 나쁜 일은 미리 알 수 없음'],
    ['다다익선', '多多益善', '많으면 많을수록 더 좋음'], ['대기만성', '大器晩成', '큰 인물은 오랜 노력 끝에 늦게 이루어짐'],
    ['막상막하', '莫上莫下', '누가 낫고 못한지 가리기 어려움'], ['사필귀정', '事必歸正', '모든 일은 결국 바른 길로 돌아감'],
    ['십시일반', '十匙一飯', '여럿이 조금씩 힘을 모으면 한 사람을 쉽게 도울 수 있음'], ['어부지리', '漁夫之利', '둘이 다투는 사이에 엉뚱한 사람이 이득을 봄'],
    ['온고지신', '溫故知新', '옛것을 익혀 새것을 앎'], ['청출어람', '靑出於藍', '제자가 스승보다 나음'],
    ['형설지공', '螢雪之功', '어려운 형편에서도 부지런히 공부함'], ['금상첨화', '錦上添花', '좋은 일에 또 좋은 일이 더해짐']
  ];
  var BANDS = [[1, 2, '초1~2'], [3, 4, '초3~4'], [5, 6, '초5~6']];

  function home() {
    main.innerHTML = '';
    K.menu(main, [
      { icon: '🌱', label: '낱말 뜻 (초1~2)', mode: 'w12', color: '#e3f7cf', run: function () { wordQuiz(0); } },
      { icon: '🌿', label: '낱말 뜻 (초3~4)', mode: 'w34', color: '#d0f4de', run: function () { wordQuiz(1); } },
      { icon: '🌳', label: '낱말 뜻 (초5~6)', mode: 'w56', color: '#c9f2c7', run: function () { wordQuiz(2); } },
      { icon: '🗣️', label: '속담 완성하기', mode: 'prov', color: '#fff3c4', run: provQuiz },
      { icon: '💡', label: '속담 뜻 맞히기', mode: 'provm', color: '#ffe4a1', run: provMeanQuiz },
      { icon: '🀄', label: '사자성어 뜻', mode: 'idm', color: '#ffe9ee', run: idiomQuiz },
      { icon: '🔎', label: '뜻 보고 사자성어', mode: 'idr', color: '#ece6f5', run: idiomRevQuiz },
      { icon: '📘', label: '낱말 사전', color: '#e9f3ff', run: dict }
    ]);
  }
  function quiz(mode, make, total) {
    main.innerHTML = ''; main.appendChild(K.backButton(home));
    var box = el('div'); main.appendChild(box);
    K.runQuiz({ el: box, mode: mode, total: total || 8, make: make, onFinish: home });
  }
  /* 뜻이 비슷해서 함께 보기로 나오면 헷갈리는 짝 */
  var CLASH = [['일석이조', '금상첨화'], ['우공이산', '대기만성'], ['우공이산', '형설지공'], ['대기만성', '형설지공'], ['배려', '존중'], ['주장', '관점']];
  function clash(a, b) { return CLASH.some(function (c) { return (c[0] === a[0] && c[1] === b[0]) || (c[1] === a[0] && c[0] === b[0]); }); }
  function opts(ans, pool, n, fn) { return K.shuffle([ans].concat(K.sample(pool.filter(function (x) { return x !== ans && !clash(ans, x); }), n))).map(fn); }

  /* ---------- 낱말 뜻 ---------- */
  function wordQuiz(b) {
    var band = BANDS[b], mode = ['w12', 'w34', 'w56'][b];
    var pool = WORDS[band[0]].concat(WORDS[band[1]]);
    quiz(mode, function (i, lv) {
      /* 낮은 단계는 아래 학년 낱말부터 */
      var src = lv <= 2 ? WORDS[band[0]] : pool;
      var w = K.pick(src);
      var reverse = lv >= 4 && Math.random() < 0.5;
      if (reverse) {
        return {
          key: 'r' + w[0], prompt: '<div class="qsub">이 뜻을 가진 낱말은?</div><div style="font-size:24px;font-weight:900;margin-top:6px">"' + K.esc(w[1]) + '"</div>',
          say: w[1] + '. 이 뜻을 가진 낱말은?', cols: 2,
          choices: opts(w, pool, 3, function (o) { return { html: '<div class="opt big">' + K.esc(o[0]) + '</div>', correct: o === w }; })
        };
      }
      return {
        key: 'w' + w[0], prompt: '<div class="qword">' + K.esc(w[0]) + '</div><div class="qsub">무슨 뜻일까요?</div>',
        say: w[0] + '. 무슨 뜻일까요?', cols: 1,
        choices: opts(w, pool, lv <= 1 ? 2 : 3, function (o) { return { html: '<div class="opt">' + K.esc(o[1]) + '</div>', correct: o === w, say: o === w ? w[0] + ', ' + w[1] : null }; })
      };
    });
  }

  /* ---------- 속담 ---------- */
  function provQuiz() {
    quiz('prov', function (i, lv) {
      var p = K.pick(PROV);
      return {
        key: 'p' + p[0], prompt: '<div style="font-size:28px;font-weight:900">' + K.esc(p[0]) + ' <span class="gap">?</span></div>',
        say: p[0] + '. 다음에 올 말은?', cols: 1,
        choices: opts(p, PROV, lv <= 1 ? 2 : 3, function (o) { return { html: '<div class="opt">' + K.esc(o[1]) + '</div>', correct: o === p, say: o === p ? p[0] + ' ' + p[1] : null }; })
      };
    });
  }
  function provMeanQuiz() {
    quiz('provm', function (i, lv) {
      var p = K.pick(PROV);
      return {
        key: 'pm' + p[0], prompt: '<div style="font-size:24px;font-weight:900">"' + K.esc(p[0] + ' ' + p[1]) + '"</div><div class="qsub">무슨 뜻일까요?</div>',
        say: p[0] + ' ' + p[1] + '. 무슨 뜻일까요?', cols: 1,
        choices: opts(p, PROV, lv <= 1 ? 2 : 3, function (o) { return { html: '<div class="opt">' + K.esc(o[2]) + '</div>', correct: o === p }; })
      };
    });
  }

  /* ---------- 사자성어 ---------- */
  function idiomQuiz() {
    quiz('idm', function (i, lv) {
      var d = K.pick(IDIOM);
      return {
        key: 'i' + d[0], prompt: '<div class="qword">' + d[0] + '</div><div class="qhan">' + d[1] + '</div><div class="qsub">무슨 뜻일까요?</div>',
        say: d[0] + '. 무슨 뜻일까요?', cols: 1,
        choices: opts(d, IDIOM, lv <= 1 ? 2 : 3, function (o) { return { html: '<div class="opt">' + K.esc(o[2]) + '</div>', correct: o === d, say: o === d ? d[0] + ', ' + d[2] : null }; })
      };
    });
  }
  function idiomRevQuiz() {
    quiz('idr', function (i, lv) {
      var d = K.pick(IDIOM);
      return {
        key: 'ir' + d[0], prompt: '<div style="font-size:23px;font-weight:900">"' + K.esc(d[2]) + '"</div><div class="qsub">알맞은 사자성어는?</div>',
        say: d[2] + '. 알맞은 사자성어는?', cols: 2,
        choices: opts(d, IDIOM, 3, function (o) { return { html: '<div class="opt big">' + o[0] + '</div>' + (lv <= 2 ? '<div class="qhan">' + o[1] + '</div>' : ''), correct: o === d }; })
      };
    });
  }

  /* ---------- 사전 ---------- */
  function dict() {
    main.innerHTML = ''; main.appendChild(K.backButton(home));
    function sec(title, rows) {
      main.appendChild(el('div', { class: 'kl-prompt', text: title, style: 'font-size:22px;margin:14px 0 8px;text-align:left' }));
      var box = el('div', { class: 'dict' });
      rows.forEach(function (r) {
        var d = el('div', { html: '<b>' + K.esc(r[0]) + '</b>' + (r[2] ? '<small>' + K.esc(r[2]) + '</small>' : '') + '<p>' + K.esc(r[1]) + '</p>' });
        d.addEventListener('click', function () { K.speak(r[0] + '. ' + r[1]); });
        box.appendChild(d);
      });
      main.appendChild(box);
    }
    for (var g = 1; g <= 6; g++) sec('📗 초등 ' + g + '학년 낱말', WORDS[g]);
    sec('🗣️ 속담', PROV.map(function (p) { return [p[0] + ' ' + p[1], p[2]]; }));
    sec('🀄 사자성어', IDIOM.map(function (d) { return [d[0], d[2], d[1]]; }));
  }

  home();
})();
</script>
</body>
</html>
