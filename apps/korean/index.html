    '누워서': '1 더하기 1은 누워서 떡 먹기예요.',
    '돌다리도': '매일 다니는 길이라도 건널 때는 좌우를 한 번 더 봐요.',
    '고래 싸움에': '형들이 다투는 바람에 옆에 있던 동생이 혼났어요.',
    '등잔 밑이': '한참 찾던 연필이 내 필통 안에 있었어요.',
    '콩 심은 데 콩 나고': '열심히 연습한 만큼 줄넘기를 잘하게 됐어요.',
    '하늘이 무너져도': '길을 잃었지만 경찰관을 만나 집에 잘 왔어요.',
    '빈 수레가': '잘 모르는 사람이 큰소리로 아는 척을 해요.',
    '개구리': '자전거를 잘 타게 되자 처음 배우는 동생을 놀렸어요.',
    '꿩 먹고': '심부름도 하고 칭찬도 받았어요.',
    '열 번 찍어': '열 번 넘게 연습해서 드디어 앞구르기를 해냈어요.'
  };
  /* 사자성어 → [글자마다 훈음, 글자 풀이, 예문] */
  var IEX = {
    '일석이조': [['한 일', '돌 석', '두 이', '새 조'], '돌 하나로 새 두 마리를 잡아요.', '심부름도 하고 용돈도 받았으니 일석이조예요.'],
    '동문서답': [['동녘 동', '물을 문', '서녘 서', '대답 답'], '동쪽을 물었는데 서쪽을 대답해요.', '"밥 먹었니?" 하고 물었는데 "파란색!" 하면 동문서답이에요.'],
    '작심삼일': [['지을 작', '마음 심', '석 삼', '날 일'], '먹은 마음이 사흘밖에 가지 않아요.', '날마다 일기를 쓰기로 했는데 사흘 만에 멈추면 작심삼일이에요.'],
    '유비무환': [['있을 유', '갖출 비', '없을 무', '근심 환'], '준비가 있으면 근심이 없어요.', '비 소식을 듣고 우산을 챙기는 것이 유비무환이에요.'],
    '우공이산': [['어리석을 우', '공평할 공', '옮길 이', '메 산'], '우공이라는 할아버지가 날마다 흙을 날라 산을 옮기려 했어요.', '날마다 조금씩 연습해서 줄넘기 100번을 해냈어요.'],
    '역지사지': [['바꿀 역', '땅 지', '생각 사', '갈 지'], '서 있는 자리를 바꾸어 생각해요.', '내가 친구라면 어떤 마음일지 생각해 보는 것이 역지사지예요.'],
    '이심전심': [['써 이', '마음 심', '전할 전', '마음 심'], '마음으로 마음을 전해요.', '말하지 않았는데 엄마가 내 마음을 알아주셨어요.'],
    '일취월장': [['날 일', '나아갈 취', '달 월', '나아갈 장'], '날마다 달마다 앞으로 나아가요.', '꾸준히 연습했더니 피아노 실력이 일취월장했어요.'],
    '자업자득': [['스스로 자', '업 업', '스스로 자', '얻을 득'], '스스로 한 일을 스스로 받아요.', '숙제를 미루다 밤늦게까지 한 것은 자업자득이에요.'],
    '새옹지마': [['변방 새', '늙은이 옹', '갈 지', '말 마'], '변방 할아버지의 말이 도망갔다가 좋은 말을 데려왔고, 그 말을 타다 아들이 다쳤지만 덕분에 싸움터에 끌려가지 않았어요.', '넘어져서 속상했는데 덕분에 새 친구를 사귀었어요.'],
    '다다익선': [['많을 다', '많을 다', '더할 익', '착할 선'], '많으면 많을수록 더 좋아요.', '좋은 책은 다다익선이에요.'],
    '대기만성': [['큰 대', '그릇 기', '늦을 만', '이룰 성'], '큰 그릇은 늦게 완성돼요.', '처음엔 느렸지만 꾸준히 그려서 멋진 화가가 되었어요.'],
    '막상막하': [['없을 막', '윗 상', '없을 막', '아래 하'], '누가 위이고 누가 아래인지 없어요.', '두 팀 점수가 계속 비슷해서 막상막하예요.'],
    '사필귀정': [['일 사', '반드시 필', '돌아갈 귀', '바를 정'], '모든 일은 반드시 바른 곳으로 돌아가요.', '거짓말은 결국 들통나고 바른 것이 드러나요.'],
    '십시일반': [['열 십', '숟가락 시', '한 일', '밥 반'], '열 사람이 한 숟가락씩 모으면 밥 한 그릇이 돼요.', '반 친구들이 조금씩 모아 아픈 친구를 도왔어요.'],
    '어부지리': [['고기 잡을 어', '지아비 부', '갈 지', '이로울 리'], '조개와 새가 다투는 사이에 어부가 둘 다 잡았어요.', '두 형이 다투는 사이에 동생이 마지막 과자를 먹었어요.'],
    '온고지신': [['따뜻할 온', '옛 고', '알 지', '새 신'], '옛것을 익혀 새것을 알아요.', '지난 시험지를 다시 풀다가 새로운 풀이를 알게 됐어요.'],
    '청출어람': [['푸를 청', '날 출', '어조사 어', '쪽 람'], '푸른 물감은 쪽풀에서 나오지만 쪽풀보다 더 푸르러요.', '선생님께 배운 제자가 선생님보다 더 잘하게 되었어요.'],
    '형설지공': [['반딧불 형', '눈 설', '갈 지', '공 공'], '반딧불과 눈빛에 책을 비추어 읽으며 들인 노력이에요.', '형편이 어려워도 도서관에서 꾸준히 공부해 꿈을 이루었어요.'],
    '금상첨화': [['비단 금', '윗 상', '더할 첨', '꽃 화'], '고운 비단 위에 꽃을 더해요.', '소풍 날 날씨도 좋은데 무지개까지 떴으니 금상첨화예요.']
  };
  function exLine(t) { return '<span class="ex-e">✏️ ' + K.esc(t) + '</span>'; }
  function wordEx(w) {
    return { explain: '<span class="ex-t">' + K.esc(w[0]) + '</span> : ' + K.esc(w[1]) + exLine(WEX[w[0]]), explainSay: w[0] + '. ' + w[1] + '. 예를 들면, ' + WEX[w[0]] };
  }
  function provEx(p) {
    return { explain: '<span class="ex-t">' + K.esc(p[0] + ' ' + p[1]) + '</span><br>' + K.esc(p[2]) + '.' + exLine(PEX[p[0]]), explainSay: p[0] + ' ' + p[1] + '. ' + p[2] + '. 예를 들면, ' + PEX[p[0]] };
  }
  function idiomEx(d) {
    var x = IEX[d[0]];
    return {
      explain: '<span class="ex-t">' + d[0] + '</span><span class="ex-h">' + d[1] + '</span><br>' +
        x[0].map(function (k, i) { return '<span class="ex-k">' + d[1][i] + ' ' + k + '</span>'; }).join('') + '<br>' +
        K.esc(x[1]) + ' → ' + K.esc(d[2]) + exLine(x[2]),
      explainSay: d[0] + '. ' + x[1] + ' ' + d[2] + '. 예를 들면, ' + x[2]
    };
  }
  function withEx(q, ex) { q.explain = ex.explain; q.explainSay = ex.explainSay; return q; }
  var BANDS = [[1, 2, '초1~2'], [3, 4, '초3~4'], [5, 6, '초5~6']];

  function home() {
    main.innerHTML = '';
    K.menu(main, [
      { icon: '🌱', label: '낱말 뜻 (초1~2)', mode: 'w12', color: '#e3f7cf', run: function () { wordQuiz(0); } },
      { icon: '🌿', label: '낱말 뜻 (초3~4)', mode: 'w34', color: '#d0f4de', run: function () { wordQuiz(1); } },
      { icon: '🌳', label: '낱말 뜻 (초5~6)', mode: 'w56', color: '#c9f2c7', run: function () { wordQuiz(2); } },
      { icon: '🗣️', label: '속담 완성하기', mode: 'prov', color: '#fff3c4', run: provQuiz },
      { icon: '💡', label: '속담 뜻 맞히기', mode: 'provm', color: '#ffe4a1', run: provMeanQuiz },
      { icon: '🀄', label: '사자성어 뜻', mode: 'idm', color: '#ffe9ee', run: idiomQuiz },
      { icon: '🔎', label: '뜻 보고 사자성어', mode: 'idr', color: '#ece6f5', run: idiomRevQuiz },
      { icon: '📘', label: '낱말 사전', color: '#e9f3ff', run: dict }
    ]);
  }
  function quiz(mode, make, total) {
    main.innerHTML = ''; main.appendChild(K.backButton(home));
    var box = el('div'); main.appendChild(box);
    K.runQuiz({ el: box, mode: mode, total: total || 8, make: make, onFinish: home });
  }
  /* 뜻이 비슷해서 함께 보기로 나오면 헷갈리는 짝 */
  var CLASH = [['일석이조', '금상첨화'], ['우공이산', '대기만성'], ['우공이산', '형설지공'], ['대기만성', '형설지공'], ['배려', '존중'], ['주장', '관점']];
  function clash(a, b) { return CLASH.some(function (c) { return (c[0] === a[0] && c[1] === b[0]) || (c[1] === a[0] && c[0] === b[0]); }); }
  function opts(ans, pool, n, fn) { return K.shuffle([ans].concat(K.sample(pool.filter(function (x) { return x !== ans && !clash(ans, x); }), n))).map(fn); }

  /* ---------- 낱말 뜻 ---------- */
  function wordQuiz(b) {
    var band = BANDS[b], mode = ['w12', 'w34', 'w56'][b];
    var pool = WORDS[band[0]].concat(WORDS[band[1]]);
    quiz(mode, function (i, lv) {
      /* 낮은 단계는 아래 학년 낱말부터 */
      var src = lv <= 2 ? WORDS[band[0]] : pool;
      var w = K.pick(src);
      var reverse = lv >= 4 && Math.random() < 0.5;
      if (reverse) {
        return withEx({
          key: 'r' + w[0], prompt: '<div class="qsub">이 뜻을 가진 낱말은?</div><div style="font-size:24px;font-weight:900;margin-top:6px">"' + K.esc(w[1]) + '"</div>',
          say: w[1] + '. 이 뜻을 가진 낱말은?', cols: 2,
          choices: opts(w, pool, 3, function (o) { return { html: '<div class="opt big">' + K.esc(o[0]) + '</div>', correct: o === w }; })
        }, wordEx(w));
      }
      return withEx({
        key: 'w' + w[0], prompt: '<div class="qword">' + K.esc(w[0]) + '</div><div class="qsub">무슨 뜻일까요?</div>',
        say: w[0] + '. 무슨 뜻일까요?', cols: 1,
        choices: opts(w, pool, lv <= 1 ? 2 : 3, function (o) { return { html: '<div class="opt">' + K.esc(o[1]) + '</div>', correct: o === w }; })
      }, wordEx(w));
    });
  }

  /* ---------- 속담 ---------- */
  function provQuiz() {
    quiz('prov', function (i, lv) {
      var p = K.pick(PROV);
      return withEx({
        key: 'p' + p[0], prompt: '<div style="font-size:28px;font-weight:900">' + K.esc(p[0]) + ' <span class="gap">?</span></div>',
        say: p[0] + '. 다음에 올 말은?', cols: 1,
        choices: opts(p, PROV, lv <= 1 ? 2 : 3, function (o) { return { html: '<div class="opt">' + K.esc(o[1]) + '</div>', correct: o === p }; })
      }, provEx(p));
    });
  }
  function provMeanQuiz() {
    quiz('provm', function (i, lv) {
      var p = K.pick(PROV);
      return withEx({
        key: 'pm' + p[0], prompt: '<div style="font-size:24px;font-weight:900">"' + K.esc(p[0] + ' ' + p[1]) + '"</div><div class="qsub">무슨 뜻일까요?</div>',
        say: p[0] + ' ' + p[1] + '. 무슨 뜻일까요?', cols: 1,
        choices: opts(p, PROV, lv <= 1 ? 2 : 3, function (o) { return { html: '<div class="opt">' + K.esc(o[2]) + '</div>', correct: o === p }; })
      }, provEx(p));
    });
  }

  /* ---------- 사자성어 ---------- */
  function idiomQuiz() {
    quiz('idm', function (i, lv) {
      var d = K.pick(IDIOM);
      return withEx({
        key: 'i' + d[0], prompt: '<div class="qword">' + d[0] + '</div><div class="qhan">' + d[1] + '</div><div class="qsub">무슨 뜻일까요?</div>',
        say: d[0] + '. 무슨 뜻일까요?', cols: 1,
        choices: opts(d, IDIOM, lv <= 1 ? 2 : 3, function (o) { return { html: '<div class="opt">' + K.esc(o[2]) + '</div>', correct: o === d }; })
      }, idiomEx(d));
    });
  }
  function idiomRevQuiz() {
    quiz('idr', function (i, lv) {
      var d = K.pick(IDIOM);
      return withEx({
        key: 'ir' + d[0], prompt: '<div style="font-size:23px;font-weight:900">"' + K.esc(d[2]) + '"</div><div class="qsub">알맞은 사자성어는?</div>',
        say: d[2] + '. 알맞은 사자성어는?', cols: 2,
        choices: opts(d, IDIOM, 3, function (o) { return { html: '<div class="opt big">' + o[0] + '</div>' + (lv <= 2 ? '<div class="qhan">' + o[1] + '</div>' : ''), correct: o === d }; })
      }, idiomEx(d));
    });
  }

  /* ---------- 사전 ---------- */
  function dict() {
    main.innerHTML = ''; main.appendChild(K.backButton(home));
    function sec(title, rows) {
      main.appendChild(el('div', { class: 'kl-prompt', text: title, style: 'font-size:22px;margin:14px 0 8px;text-align:left' }));
      var box = el('div', { class: 'dict' });
      rows.forEach(function (r) {
        var d = el('div', { html: '<b>' + K.esc(r[0]) + '</b>' + (r[2] ? '<small>' + K.esc(r[2]) + '</small>' : '') + '<p>' + K.esc(r[1]) + '</p>' });
        d.addEventListener('click', function () { K.speak(r[0] + '. ' + r[1]); });
        box.appendChild(d);
      });
      main.appendChild(box);
    }
    for (var g = 1; g <= 6; g++) sec('📗 초등 ' + g + '학년 낱말', WORDS[g]);
    sec('🗣️ 속담', PROV.map(function (p) { return [p[0] + ' ' + p[1], p[2]]; }));
    sec('🀄 사자성어', IDIOM.map(function (d) { return [d[0], d[2], d[1]]; }));
  }

  home();
})();
</script>
</body>
