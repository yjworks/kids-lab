<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>그림 그리기</title>
<link rel="stylesheet" href="../../shared/app.css">
<style>
  .studio { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  @media (max-width: 760px) {
    canvas { max-height: 32vh; }
    main > .kl-prompt { font-size: 18px !important; margin-bottom: 6px; }
    .studio { gap: 8px; }
    .tools { min-width: 0; width: 100%; gap: 6px; }
    .tools > div.label { display: none; }          /* 색깔·굵기 같은 안내 글은 접는다 */
    .palette { grid-template-columns: repeat(12, 1fr); gap: 4px; }
    .palette button { width: 100%; height: 30px; border-radius: 8px; border-width: 2px; }
    .sizes { gap: 5px; }
    .sizes button { height: 40px; font-size: 14px; }
    .stamps { grid-template-columns: repeat(12, 1fr); gap: 3px; }
    .stamps button { font-size: 18px; padding: 2px; }
    .gallery { grid-template-columns: repeat(2, 1fr); }
  }
  canvas { background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.1); touch-action: none; max-width: 100%; cursor: crosshair; }
  .tools { display: flex; flex-direction: column; gap: 10px; min-width: 200px; }
  .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .palette button { width: 44px; height: 44px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .palette button.sel { outline: 4px solid #333; }
  .sizes { display: flex; gap: 8px; }
  .sizes button { flex: 1; height: 48px; border-radius: 14px; background: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.1); }
  .sizes button.sel { background: #ffca3a; }
  .stamps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .stamps button { font-size: 26px; background: #fff; border-radius: 12px; padding: 4px; }
  .stamps button.sel { background: #ffca3a; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .gallery .g { background: #fff; border-radius: 16px; padding: 8px; box-shadow: 0 4px 0 rgba(0,0,0,.08); text-align: center; }
  .gallery img { width: 100%; border-radius: 10px; }
  .gallery small { color: #777; }
  .tmpl { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .tmpl button { background: #fff; border-radius: 18px; padding: 12px; font-size: 60px; box-shadow: 0 5px 0 rgba(0,0,0,.08); }
  .tmpl button small { display: block; font-size: 16px; font-weight: 800; }
</style>
</head>
<body data-app="draw">
<main id="main"></main>
<script src="../../shared/kid.js"></script>
<script>
(function () {
  var K = KidLab, el = K.el;
  K.header({ title: '그림 그리기', icon: '🎨', say: '그림 그리기' });
  var main = document.getElementById('main');
  var COLORS = ['#000', '#e63946', '#ff8c42', '#ffca3a', '#4caf50', '#1982c4', '#8e44ad', '#ff8fa3', '#8d5524', '#8fd3f4', '#9e9e9e', '#fff'];
  var STAMPS = ['⭐', '❤️', '🌸', '🐶', '🐱', '🦋', '🌈', '☀️', '🍎', '🚗', '🎈', '🦄'];
  var TEMPLATES = [['🏠', '집'], ['🌳', '나무'], ['🚗', '자동차'], ['🐱', '고양이'], ['🌸', '꽃'], ['🐟', '물고기'], ['🚀', '로켓'], ['🦋', '나비'], ['🍎', '사과'], ['⭐', '별'], ['🐻', '곰'], ['🌈', '무지개']];
  var TOPICS = ['우리 가족', '내가 좋아하는 동물', '오늘 먹은 음식', '내 방', '하늘과 구름', '내가 만든 로봇', '바닷속 세상', '꿈에서 본 것', '내 친구', '좋아하는 장난감', '무지개 나라', '우주 여행'];
  function home() {
    main.innerHTML = '';
    var d = K.data();
    K.menu(main, [
      { icon: '🖌️', label: '자유롭게 그리기', color: '#ffd9e8', run: function () { studio(null); } },
      { icon: '🖍️', label: '따라 그리기', color: '#fff3c4', run: templates },
      { icon: '💡', label: '오늘의 그림 주제', color: '#e9f3ff', run: function () { var t = TOPICS[new Date().getDate() % TOPICS.length]; K.speak('오늘의 주제는 ' + t + K.josa(t, '이에요/예요')); studio(null, t); } },
      { icon: '🖼️', label: '내 갤러리 (' + d.drawings.length + ')', color: '#e3f7cf', run: gallery }
    ]);
  }
  function templates() {
    main.innerHTML = ''; main.appendChild(K.backButton(home));
    main.appendChild(el('div', { class: 'kl-prompt', text: '무엇을 따라 그릴까요?' }));
    var g = el('div', { class: 'tmpl' });
    TEMPLATES.forEach(function (t) { var b = el('button', { html: t[0] + '<small>' + t[1] + '</small>' }); b.addEventListener('click', function () { K.sfx.click(); studio(t[0], t[1] + ' 따라 그리기'); }); g.appendChild(b); });
    main.appendChild(g);
  }
  function studio(tmpl, title) {
    main.innerHTML = ''; main.appendChild(K.backButton(home));
    if (title) main.appendChild(el('div', { class: 'kl-prompt', text: '🎨 ' + title, style: 'font-size:26px' }));
    var W = 640, H = 480; var cv = el('canvas', { width: W, height: H }); var ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    if (tmpl) { ctx.font = '300px "Segoe UI Emoji","Apple Color Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.globalAlpha = 0.18; ctx.fillText(tmpl, W / 2, H / 2 + 10); ctx.globalAlpha = 1; }
    var color = '#e63946', size = 10, tool = 'pen', stamp = '⭐', drawing = false, lx, ly, history = [], strokes = 0;
    function snap() { history.push(ctx.getImageData(0, 0, W, H)); if (history.length > 20) history.shift(); }
    function pos(e) { var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
    cv.addEventListener('pointerdown', function (e) { snap(); var p = pos(e); strokes++; if (tool === 'stamp') { ctx.font = (size * 6) + 'px "Segoe UI Emoji","Apple Color Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(stamp, p[0], p[1]); K.sfx.pop(); return; } if (tool === 'fill') { ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); if (tmpl) { ctx.font = '300px "Segoe UI Emoji","Apple Color Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.globalAlpha = 0.18; ctx.fillText(tmpl, W / 2, H / 2 + 10); ctx.globalAlpha = 1; } return; } drawing = true; lx = p[0]; ly = p[1]; cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(lx, ly, size / 2, 0, Math.PI * 2); ctx.fillStyle = tool === 'eraser' ? '#fff' : color; ctx.fill(); });
    cv.addEventListener('pointermove', function (e) { if (!drawing) return; var p = pos(e); ctx.strokeStyle = tool === 'eraser' ? '#fff' : color; ctx.lineWidth = tool === 'eraser' ? size * 3 : size; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; });
    cv.addEventListener('pointerup', function () { drawing = false; });
    var tools = el('div', { class: 'tools' });
    var pal = el('div', { class: 'palette' });
    COLORS.forEach(function (c) { var b = el('button', { style: 'background:' + c, class: c === color ? 'sel' : '' }); b.addEventListener('click', function () { color = c; tool = tool === 'eraser' ? 'pen' : tool; pal.querySelectorAll('button').forEach(function (x) { x.classList.remove('sel'); }); b.classList.add('sel'); K.sfx.pop(); setTool(tool === 'stamp' ? 'stamp' : tool === 'fill' ? 'fill' : 'pen'); }); pal.appendChild(b); });
    var sizes = el('div', { class: 'sizes' });
    [[4, '●'], [10, '⬤'], [22, '⚫'], [40, '🔵']].forEach(function (s) { var b = el('button', { text: s[1], class: s[0] === size ? 'sel' : '', style: 'font-size:' + (10 + s[0] / 2) + 'px' }); b.addEventListener('click', function () { size = s[0]; sizes.querySelectorAll('button').forEach(function (x) { x.classList.remove('sel'); }); b.classList.add('sel'); K.sfx.pop(); }); sizes.appendChild(b); });
    var toolRow = el('div', { class: 'sizes' }); var toolBtns = {};
    [['pen', '✏️ 펜'], ['eraser', '🧽 지우개'], ['fill', '🎨 배경'], ['stamp', '⭐ 도장']].forEach(function (t) { var b = el('button', { text: t[1], style: 'font-size:16px;font-weight:800' }); b.addEventListener('click', function () { setTool(t[0]); K.sfx.pop(); }); toolBtns[t[0]] = b; toolRow.appendChild(b); });
    function setTool(t) { tool = t; for (var k in toolBtns) toolBtns[k].classList.toggle('sel', k === t); stampBox.style.display = t === 'stamp' ? 'grid' : 'none'; }
    var stampBox = el('div', { class: 'stamps', style: 'display:none' });
    STAMPS.forEach(function (s) { var b = el('button', { text: s, class: s === stamp ? 'sel' : '' }); b.addEventListener('click', function () { stamp = s; stampBox.querySelectorAll('button').forEach(function (x) { x.classList.remove('sel'); }); b.classList.add('sel'); }); stampBox.appendChild(b); });
    var actions = el('div', { class: 'kl-row', style: 'margin:0;justify-content:flex-start' }, [
      el('button', { class: 'kl-btn', text: '↩ 되돌리기', style: 'font-size:18px;padding:10px 16px', onclick: function () { var h = history.pop(); if (h) ctx.putImageData(h, 0, 0); K.sfx.pop(); } }),
      el('button', { class: 'kl-btn', text: '🗑️ 새로', style: 'font-size:18px;padding:10px 16px', onclick: function () { snap(); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); strokes = 0; } }),
      el('button', { class: 'kl-btn green', text: '💾 저장', style: 'font-size:18px;padding:10px 16px', onclick: function () { if (strokes < 2) { K.toast('조금 더 그려볼까요? ✏️'); return; } var small = document.createElement('canvas'); small.width = 320; small.height = 240; small.getContext('2d').drawImage(cv, 0, 0, 320, 240); var url = small.toDataURL('image/jpeg', 0.7); K.mutate(function (d) { d.drawings.push({ t: Date.now(), title: title || '내 그림', img: url }); if (d.drawings.length > 40) d.drawings.shift(); }); K.addStar(2); K.event('save'); K.sfx.win(); K.confetti(); K.speak('멋진 그림이에요! 갤러리에 저장했어요'); strokes = 0; } }),
      el('button', { class: 'kl-btn blue', text: '⬇ 파일로', style: 'font-size:18px;padding:10px 16px', onclick: function () { var a = el('a', { href: cv.toDataURL('image/png'), download: 'kidlab-drawing.png' }); document.body.appendChild(a); a.click(); a.remove(); } })
    ]);
    tools.appendChild(el('div', { class: 'label', style: 'font-weight:800', text: '색깔' })); tools.appendChild(pal);
    tools.appendChild(el('div', { class: 'label', style: 'font-weight:800', text: '굵기' })); tools.appendChild(sizes);
    tools.appendChild(el('div', { class: 'label', style: 'font-weight:800', text: '도구' })); tools.appendChild(toolRow); tools.appendChild(stampBox);
    main.appendChild(el('div', { class: 'studio' }, [cv, tools])); main.appendChild(el('div', { style: 'margin-top:12px' }, actions));
    setTool('pen');
  }
  function gallery() {
    main.innerHTML = ''; main.appendChild(K.backButton(home));
    var d = K.data();
    main.appendChild(el('div', { class: 'kl-prompt', text: '🖼️ 내 갤러리' }));
    if (!d.drawings.length) { main.appendChild(el('div', { class: 'kl-hint', text: '아직 저장한 그림이 없어요. 그림을 그리고 저장을 눌러요!' })); return; }
    var g = el('div', { class: 'gallery' });
    d.drawings.slice().reverse().forEach(function (dr) {
      var item = el('div', { class: 'g' }, [el('img', { src: dr.img }), el('div', { text: dr.title, style: 'font-weight:800' }), el('small', { text: new Date(dr.t).toLocaleDateString('ko-KR') }), el('div', {}, el('button', { class: 'kl-btn red', text: '지우기', style: 'font-size:15px;padding:6px 12px;margin-top:4px', onclick: function () { if (confirm('이 그림을 지울까요?')) { K.mutate(function (dd) { dd.drawings = dd.drawings.filter(function (x) { return x.t !== dr.t; }); }); gallery(); } } }))]);
      g.appendChild(item);
    });
    main.appendChild(g);
  }
  home();
})();
</script>
</body>
</html>
