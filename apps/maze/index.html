<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>미로 탐험</title>
<link rel="stylesheet" href="../../shared/app.css">
<style>
  .wrap { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  canvas { background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.08); max-width: 100%; touch-action: none; }
  .dpad { display: grid; grid-template-columns: repeat(3, 84px); grid-template-rows: repeat(3, 84px); gap: 8px; }
  .dpad button { font-size: 40px; border-radius: 20px; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.1); }
  .dpad button:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.1); }
  .dpad .c { background: #ffca3a; font-size: 34px; }
  .side { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .info { background: #fff; border-radius: 16px; padding: 10px 16px; font-weight: 800; text-align: center; }
</style>
</head>
<body data-app="maze">
<main id="main"></main>
<script src="../../shared/kid.js"></script>
<script>
(function () {
  var K = KidLab, el = K.el;
  K.header({ title: '미로 탐험', icon: '🧭', say: '미로 탐험' });
  var main = document.getElementById('main');
  var THEMES = [['🐰', '🥕', '토끼가 당근을 찾아가요'], ['🐶', '🦴', '강아지가 뼈다귀를 찾아가요'], ['🐝', '🌸', '벌이 꽃을 찾아가요'], ['🚀', '🌙', '로켓이 달까지 가요'], ['🐟', '🏠', '물고기가 집으로 가요'], ['🧒', '🍦', '아이스크림을 찾아가요'], ['🤖', '🔋', '로봇이 배터리를 찾아가요']];
  function home() {
    main.innerHTML = '';
    K.menu(main, [
      { icon: '🐣', label: '작은 미로', color: '#e3f7cf', run: play.bind(null, 'small') },
      { icon: '🐥', label: '보통 미로', color: '#fff3c4', run: play.bind(null, 'mid') },
      { icon: '🦅', label: '큰 미로', color: '#ffe9ee', run: play.bind(null, 'big') },
      { icon: '⭐', label: '별 모으기 미로', color: '#e9f3ff', run: play.bind(null, 'stars') }
    ]);
    var p = K.progress(); if (p.wins) main.appendChild(el('div', { class: 'kl-hint', text: '지금까지 미로 탈출 ' + p.wins + '번!' }));
  }
  function gen(w, h) {
    var cells = []; for (var y = 0; y < h; y++) { cells.push([]); for (var x = 0; x < w; x++) cells[y].push({ v: false, walls: [true, true, true, true] }); }
    var stack = [[0, 0]]; cells[0][0].v = true; var dirs = [[0, -1, 0, 2], [1, 0, 1, 3], [0, 1, 2, 0], [-1, 0, 3, 1]];
    while (stack.length) { var c = stack[stack.length - 1]; var opts = dirs.filter(function (d) { var nx = c[0] + d[0], ny = c[1] + d[1]; return nx >= 0 && ny >= 0 && nx < w && ny < h && !cells[ny][nx].v; }); if (!opts.length) { stack.pop(); continue; } var d = K.pick(opts); var nx = c[0] + d[0], ny = c[1] + d[1]; cells[c[1]][c[0]].walls[d[2]] = false; cells[ny][nx].walls[d[3]] = false; cells[ny][nx].v = true; stack.push([nx, ny]); }
    return cells;
  }
  function play(size) {
    main.innerHTML = ''; main.appendChild(K.backButton(home));
    var w = size === 'small' ? 5 : size === 'mid' ? 8 : size === 'big' ? 12 : 8, h = size === 'small' ? 5 : size === 'mid' ? 7 : size === 'big' ? 9 : 7;
    var cellPx = Math.floor(Math.min(600 / w, 460 / h)); var cells = gen(w, h); var theme = K.pick(THEMES);
    var px = 0, py = 0, moves = 0, stars = [], collected = 0, done = false;
    if (size === 'stars') { while (stars.length < 5) { var s = [K.randInt(0, w - 1), K.randInt(0, h - 1)]; if ((s[0] || s[1]) && !(s[0] === w - 1 && s[1] === h - 1) && !stars.some(function (t) { return t[0] === s[0] && t[1] === s[1]; })) stars.push(s); } }
    var cv = el('canvas', { width: w * cellPx + 8, height: h * cellPx + 8 }); var ctx = cv.getContext('2d');
    var info = el('div', { class: 'info', text: theme[2] });
    var moveInfo = el('div', { class: 'info', text: '움직인 횟수: 0' });
    function draw() {
      ctx.clearRect(0, 0, cv.width, cv.height); ctx.save(); ctx.translate(4, 4);
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w * cellPx, h * cellPx);
      ctx.strokeStyle = '#6a4c93'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) { var c = cells[y][x]; var X = x * cellPx, Y = y * cellPx; ctx.beginPath(); if (c.walls[0]) { ctx.moveTo(X, Y); ctx.lineTo(X + cellPx, Y); } if (c.walls[1]) { ctx.moveTo(X + cellPx, Y); ctx.lineTo(X + cellPx, Y + cellPx); } if (c.walls[2]) { ctx.moveTo(X, Y + cellPx); ctx.lineTo(X + cellPx, Y + cellPx); } if (c.walls[3]) { ctx.moveTo(X, Y); ctx.lineTo(X, Y + cellPx); } ctx.stroke(); }
      ctx.font = Math.floor(cellPx * 0.7) + 'px "Segoe UI Emoji","Apple Color Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      stars.forEach(function (s) { ctx.fillText('⭐', s[0] * cellPx + cellPx / 2, s[1] * cellPx + cellPx / 2 + 2); });
      ctx.fillText(theme[1], (w - 1) * cellPx + cellPx / 2, (h - 1) * cellPx + cellPx / 2 + 2);
      ctx.fillText(theme[0], px * cellPx + cellPx / 2, py * cellPx + cellPx / 2 + 2);
      ctx.restore();
    }
    function move(d) {
      if (done) return; var c = cells[py][px]; var dd = [[0, -1], [1, 0], [0, 1], [-1, 0]][d];
      if (c.walls[d]) { K.sfx.wrong(); return; }
      px += dd[0]; py += dd[1]; moves++; moveInfo.textContent = '움직인 횟수: ' + moves; K.sfx.pop();
      stars = stars.filter(function (s) { if (s[0] === px && s[1] === py) { collected++; K.sfx.star(); K.addStar(1); return false; } return true; });
      draw();
      if (px === w - 1 && py === h - 1) { if (size === 'stars' && stars.length) { K.toast('별을 모두 모아야 해요! ⭐ ' + stars.length + '개 남음'); K.speak('별을 모두 모아야 해요'); return; } done = true; K.event('win'); K.addStar(2); K.sfx.win(); K.confetti(); K.setProgress({ wins: (K.progress().wins || 0) + 1 }); info.textContent = '🎉 도착했어요! ' + moves + '번 만에!'; K.speak('도착했어요! 잘했어요'); side.appendChild(el('div', { class: 'kl-row' }, [el('button', { class: 'kl-btn primary', text: '🔁 새 미로', onclick: function () { play(size); } }), el('button', { class: 'kl-btn', text: '🏠', onclick: home })])); }
    }
    var dpad = el('div', { class: 'dpad' });
    [['', ''], ['⬆️', 0], ['', ''], ['⬅️', 3], ['🧭', 'c'], ['➡️', 1], ['', ''], ['⬇️', 2], ['', '']].forEach(function (b) { if (b[0] === '') { dpad.appendChild(el('span')); return; } var bt = el('button', { text: b[0], class: b[1] === 'c' ? 'c' : '' }); if (b[1] !== 'c') bt.addEventListener('click', function () { move(b[1]); }); else bt.addEventListener('click', function () { K.speak(theme[2]); }); dpad.appendChild(bt); });
    var side = el('div', { class: 'side' }, [info, moveInfo, dpad, el('div', { class: 'kl-hint', text: '키보드 방향키로도 움직여요' })]);
    main.appendChild(el('div', { class: 'wrap' }, [cv, side]));
    var keyH = function (e) { var m = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 }[e.key]; if (m != null) { e.preventDefault(); if (document.body.contains(cv)) move(m); else window.removeEventListener('keydown', keyH); } };
    window.addEventListener('keydown', keyH);
    var sx, sy; cv.addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; });
    cv.addEventListener('pointerup', function (e) { if (sx == null) return; var dx = e.clientX - sx, dy = e.clientY - sy; if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return; move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0)); sx = null; });
    draw(); K.speak(theme[2]); try { cv.focus(); } catch (e) { }
  }
  home();
})();
</script>
</body>
</html>
