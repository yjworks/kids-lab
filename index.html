<style>
  html { height: 100%; }
  body { height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; background: var(--db-bg); color: var(--db-text); font-size: 20px; }
  #topbar { flex: none; background: var(--db-card); border-bottom: 1px solid var(--db-line); display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 14px; position: relative; z-index: 50; }
  #topbar .left, #topbar .right { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #topbar .right { flex: 0 1 auto; overflow-x: auto; scrollbar-width: none; }
  #topbar .right::-webkit-scrollbar { display: none; }
  #topbar .left { flex: 0 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  #topbar .left::-webkit-scrollbar { display: none; }
  .pill { background: var(--db-card); color: var(--db-text); border: 1px solid var(--db-line); border-radius: var(--db-pill); padding: 6px 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; font-size: 19px; white-space: nowrap; flex: none; line-height: 1.25; }
  .pill.btn { min-height: var(--db-hit); min-width: var(--db-hit); justify-content: center; }
  @media (hover: hover) { .pill.btn:hover { background: #fff3c4; border-color: var(--db-accent); } }
  #profileBtn { min-width: var(--db-hit); max-width: 46vw; overflow: hidden; }
  #profileBtn .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #profileBtn .av { font-size: 28px; }
  #clock { font-variant-numeric: tabular-nums; }
  #desktop { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px 16px 24px; }
  #greet { font-size: 28px; font-weight: 900; color: var(--db-text); margin: 4px 0 14px 8px; }
  #greet { cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 묶음 탭은 아래로 내려도 위에 붙어 있다. 붙었을 때만 바탕을 깐다 */
  /* top은 #desktop 위 여백만큼 음수로 둬야 화면 맨 위에 딱 붙는다. 여백은 붙기 전후 같게 둬서 아이콘이 튀지 않게 한다 */
  #cats { position: sticky; top: -20px; z-index: 5; margin: -6px -16px 0; padding: 6px 18px 10px; transition: background .15s, box-shadow .15s; }
  #cats.stuck { background: var(--db-bg); box-shadow: 0 1px 0 var(--db-line); }
  #icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px; }
  /* 오늘 뭐 할지 바로 보이게 */
  #quick { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 10px; }
  .quick-card { flex: 0 0 auto; min-width: 190px; background: var(--db-card); border: 1px solid var(--db-line); border-radius: 22px; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px; box-shadow: 0 6px 0 rgba(0,0,0,.08); text-align: left; }

  #cats { display: flex; gap: 8px; overflow-x: auto; padding: 0 2px 12px; }

  #cats button.on { background: var(--db-accent-bg); border-color: var(--db-accent-bg); color: var(--db-on-accent); }
  .svgic { width: 1.15em; height: 1.15em; vertical-align: -0.2em; display: inline-block; }
  .app-icon .ic .svgic, .quick-card .ic .svgic { width: 78%; height: 78%; }
  .cat-head { grid-column: 1 / -1; font-size: 20px; font-weight: 900; color: var(--db-text); background: transparent; border-radius: 16px; padding: 6px 14px; justify-self: start; margin-top: 6px; }
  .cat-head:first-child { margin-top: 0; }

  .app-icon .nm { font-weight: 800; font-size: 19px; color: var(--db-text); }

  .app-icon .today { position: absolute; top: 8px; left: 10px; font-size: 16px; }

  #tasks { display: flex; gap: 8px; flex: 1; overflow-x: auto; }

  .task.active { background: #fff3c4; border-bottom-color: var(--db-accent); }
  .task .x { background: none; font-size: 16px; opacity: .5; }
  @media (hover: hover) { .task .x:hover { opacity: 1; } }
  #missionsBar { display: flex; gap: 6px; align-items: center; font-size: 18px; }
  /* 창 */
  .win { position: fixed; background: var(--db-card); border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; overflow: hidden; min-width: 420px; min-height: 320px; z-index: 100; border: 3px solid #fff; }
  .win.max { left: 8px !important; top: calc(var(--topbar-h, 64px) + 8px) !important; width: calc(100% - 16px) !important; height: calc(100% - var(--topbar-h, 64px) - var(--taskbar-h, 70px) - 16px) !important; border-radius: 14px; }
  .win.min { display: none; }
  .win.focus { z-index: 200; border-color: var(--db-accent); }
  .win .bar { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 16px; font-weight: 900; font-size: 20px; cursor: move; color: #fff; }
  .win .bar .ctl { display: flex; gap: 6px; }
  .win .bar button { width: 44px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.3); font-size: 20px; font-weight: 900; color: #fff; }
  @media (hover: hover) { .win .bar button:hover { background: rgba(255,255,255,.5); } }
  .win .bar button.close { background: #ff595e; width: 60px; font-size: 24px; }
  @media (hover: hover) { .win .bar button.close:hover { background: #e03e44; } }
  .win iframe { flex: 1; border: none; width: 100%; background: var(--db-bg); }
  /* 손가락으로 쓰는 기기(iPad 등): 창은 늘 화면 가득, 끌기·크기 단추 없음, 닫기 단추는 크게 */
  html.touch .win, html.touch .win.max { left: 0 !important; right: 0 !important; top: var(--topbar-h, 64px) !important; width: 100% !important; height: calc(100% - var(--topbar-h, 64px) - var(--taskbar-h, 70px)) !important; min-width: 0; min-height: 0; border-radius: 0; border-width: 0; }
  html.touch .win .bar { cursor: default; }
  html.touch .win .bar .maxbtn { display: none; }
  html.touch .win .bar button { height: 46px; }
  html.touch .win .bar button.close { width: 76px; }
  html.touch .task .x { padding: 8px 10px; margin: -8px -10px -8px 0; font-size: 18px; opacity: .75; }
  /* 패널 */
  html, body { overscroll-behavior-x: none; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 16px; }
  .panel { background: var(--db-card); color: var(--db-text); border-radius: 30px; padding: 28px; width: min(760px, 96vw); max-height: 92vh; overflow: auto; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
  .panel h2 { margin: 0 0 16px; font-size: 32px; }
  .panel .close { float: right; background: #ff595e; color: #fff; border-radius: 14px; width: 60px; height: 48px; font-size: 26px; font-weight: 900; }
  .avatars { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; }
  .avatars button { font-size: 40px; background: var(--db-bg); border: 1px solid var(--db-line); border-radius: 18px; padding: 10px 0; }
  .avatars button.sel { background: var(--db-accent-bg); border-color: var(--db-accent-bg); outline: 4px solid var(--db-text); outline-offset: -1px; }
  input[type=text] { font-size: 26px; padding: 12px 16px; color: var(--db-text); background: var(--db-card); border: 3px solid var(--db-line); border-radius: 16px; width: 100%; font-family: inherit; }
  .profile-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .profile-card { background: var(--db-bg); border: 1px solid var(--db-line); border-radius: 22px; padding: 18px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: 0 6px 0 rgba(0,0,0,.08); font-weight: 800; }
  @media (hover: hover) { .profile-card:hover { background: #fff3c4; } }
  .profile-card .av { font-size: 60px; }
  .course-head, .course-card { display: flex; gap: 14px; align-items: center; background: #f7f7f7; border-radius: 18px; padding: 12px 16px; margin-bottom: 10px; }
  .course-head { background: #f4f0ff; }
  .course-head .ci, .course-card .ci { font-size: 42px; flex: none; }
  .course-head > div:last-child { flex: 1; min-width: 0; }
  .course-card .cb { flex: 1; min-width: 0; }
  .cn { font-size: 20px; font-weight: 900; } .cs { font-size: 15px; font-weight: 800; color: #6a4c93; } .cd { font-size: 15px; font-weight: 600; color: #555; margin-top: 4px; line-height: 1.45; word-break: keep-all; }
  .course-head .bar { height: 14px; background: #ddd; border-radius: 10px; overflow: hidden; }
  .course-head .bar i { display: block; height: 100%; background: #8e7cc3; }
  .course-card .go { background: var(--db-accent-bg); color: var(--db-on-accent); border-radius: 14px; padding: 8px 14px; font-weight: 800; flex: none; }
  .course-card .go:disabled { background: #ddd; color: #777; box-shadow: none; }
  .mission { display: flex; align-items: center; gap: 14px; background: #f7f7f7; border-radius: 18px; padding: 12px 16px; margin-bottom: 10px; }
  .mission.done { background: #e3f7cf; }
  .mission .ic { font-size: 36px; }
  .mission .lb { flex: 1; font-weight: 800; }
  .mission .bar { height: 14px; background: #ddd; border-radius: 10px; overflow: hidden; margin-top: 6px; }
  .mission .bar i { display: block; height: 100%; background: #8ac926; }
  .mission .go { background: var(--db-accent-bg); color: var(--db-on-accent); border-radius: 14px; padding: 8px 14px; font-weight: 800; }
  .sticker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
  .sticker { font-size: 40px; background: #f3f3f3; border-radius: 14px; text-align: center; padding: 8px 0; }
  .sticker.locked { filter: grayscale(1); opacity: .25; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .stat { background: #f7f7f7; border-radius: 16px; padding: 12px 14px; font-size: 18px; }
  .stat b { display: block; font-size: 26px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
  .cal div { text-align: center; padding: 6px 0; border-radius: 10px; background: #f3f3f3; font-size: 16px; }
  .cal div.on { background: #c9f0a8; font-weight: 800; }
  .cal div.today { outline: 3px solid #ffca3a; }
  .toggle { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; font-weight: 700; }
  .toggle button { background: #ddd; border-radius: 30px; padding: 8px 18px; font-weight: 800; }
  .toggle button.on { background: #8ac926; color: #fff; }
  .gacha-box { text-align: center; padding: 20px; }
  .gacha-result { font-size: 140px; animation: pop .8s; }
  @media (max-width: 760px) {
    #topbar { padding: 5px 10px; gap: 6px; }
    .pill { font-size: 16px; padding: 5px 8px; gap: 3px; border-radius: 24px; }
    #topbar .left, #topbar .right { gap: 5px; }
    .pill.btn { min-height: 44px; }
    #profileBtn .av { font-size: 24px; }
    #desktop { padding: 14px 12px 20px; }
    #greet { font-size: 19px; margin: 0 0 8px 4px; }
    #cats { top: -14px; margin: -6px -12px 0; padding: 6px 14px 8px; }
    #quick { gap: 10px; padding-bottom: 8px; }
    #icons { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }
    .quick-card { min-width: 150px; padding: 6px 12px 6px 8px; gap: 8px; border-radius: 16px; }
    .quick-card .ic { font-size: 26px; width: 40px; height: 40px; border-radius: 12px; }
    .quick-card .nm { font-size: 16px; }
    .quick-card .tag { font-size: 11px; }
    #cats button { font-size: 16px; padding: 8px 14px; min-height: 44px; }
    .app-icon { border-radius: 20px; padding: 10px 6px 8px; }
    .app-icon .ic { font-size: 44px; width: 68px; height: 68px; border-radius: 20px; }
    .app-icon .nm { font-size: 15px; }
    .app-icon .badge { font-size: 11px; padding: 1px 6px; top: 5px; right: 6px; }
    #taskbar { min-height: 58px; }
    #homeBtn { width: 46px; height: 46px; font-size: 24px; border-radius: 14px; }
    .task { padding: 6px 10px; font-size: 15px; border-radius: 12px; }
    .win, .win.max { left: 0 !important; right: 0 !important; top: var(--topbar-h, 56px) !important; width: 100% !important; height: calc(100% - var(--topbar-h, 56px) - var(--taskbar-h, 58px)) !important; min-width: 0; min-height: 0; border-radius: 0; border-width: 0; }
    .win .bar { height: 46px; font-size: 17px; padding: 0 6px 0 12px; cursor: default; }
    .win .bar button { width: 40px; height: 36px; font-size: 18px; }
    .win .bar button.close { width: 52px; font-size: 22px; }
    .win .bar .maxbtn { display: none; }
    .panel { padding: 18px; border-radius: 22px; }
    .panel h2 { font-size: 24px; }
    .profile-list { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
    .profile-card .av { font-size: 44px; }
    .mission .lb { font-size: 17px; }
    .mission .go, .course-card .go { font-size: 15px; padding: 7px 10px; }
    .course-card { flex-wrap: wrap; } .course-card .ci, .course-head .ci { font-size: 32px; } .cn { font-size: 17px; }
    input[type=text] { font-size: 22px; }
  }
  /* 세로가 짧은 폰(작은 폰): 인사·탭을 조금 더 얇게 */
  @media (max-width: 760px) and (max-height: 700px) {
    #greet { font-size: 17px; margin-bottom: 6px; }
    #cats button { min-height: 40px; padding: 6px 13px; font-size: 15px; }
    #quick { padding-bottom: 6px; }
  }
  /* 가로로 눕힌 폰처럼 세로가 짧은 화면: 껍데기를 최대한 얇게 */
  @media (max-height: 500px) {
    #topbar { padding: 3px 10px; }
    .pill { font-size: 14px; padding: 3px 9px; }
    #profileBtn .av { font-size: 20px; }
    #desktop { padding: 10px 12px 14px; }
    #greet { display: none; }
    #cats { top: -10px; }
    #icons { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
    .app-icon .ic { font-size: 36px; width: 56px; height: 56px; border-radius: 16px; }
    .app-icon .nm { font-size: 13px; }
    #taskbar { min-height: 44px; padding: 3px 8px; }
    #homeBtn { width: 38px; height: 38px; font-size: 20px; }
    .task { padding: 4px 8px; font-size: 13px; }
    .win .bar { height: 34px; font-size: 14px; }
    .win .bar button { width: 34px; height: 28px; font-size: 15px; }
    .win .bar button.close { width: 44px; font-size: 18px; }
  }
  @media (max-width: 900px) { #clock { font-size: 17px; } }
  @media (max-width: 760px) { #clock { display: none; } }
  @media (max-width: 620px) { #streakPill { display: none; } }
  /* 좁은 폰: 도장은 부모 리포트에서 볼 수 있어 위 막대에서는 뺀다 */
  @media (max-width: 380px) { #stampPill { display: none; } }
  @media (max-width: 340px) { .pill { font-size: 14px !important; padding: 4px 5px !important; } #topbar { padding: 4px 6px !important; } }
  @media (max-width: 430px) {
    #profileBtn .nm { display: none; }
    .pill { font-size: 15px; padding: 5px 6px; gap: 2px; }
    #topbar { gap: 4px; } #topbar .left, #topbar .right { gap: 4px; }
    #topbar { gap: 5px; padding: 6px 8px; }
    #topbar .left, #topbar .right { gap: 5px; }
  }
  @media (max-width: 340px) { #stampPill { display: none; } }
  /* 위 막대 단추는 누르는 칸을 44px 이상으로 두고, 폰에서도 한 줄에 들어가게 틈과 안쪽 여백을 줄인다 */
  @media (max-width: 430px) {
    #topbar { gap: 2px; padding: 6px 4px; }
    #topbar .left, #topbar .right { gap: 2px; }
    .pill { padding: 5px 4px; }
  }

  @media (min-width: 761px) and (max-width: 900px) { .pill { padding-left: 9px; padding-right: 9px; } }
  /* 아주 좁은 폰(340px 이하)은 단추 폭을 조금 줄여야 한 줄에 들어간다. 높이 44px은 그대로 */
  @media (max-width: 340px) { .pill.btn, #profileBtn { min-width: 38px; } #topbar .left, #topbar .right { gap: 1px; } }
</style>

<body>
<div id="topbar">
  <div class="left">
    <button class="pill btn" id="profileBtn"><span class="av">🐣</span><span class="nm">친구</span></button>
    <span class="pill" id="starPill">⭐ 0</span>
    <span class="pill" id="streakPill" title="연속 출석">🔥 0일</span>
    <button class="pill btn" id="stampPill" title="오늘 도장 (활동 3개에 1개)">🏅 0</button>
  </div>
  <div class="right">
    <button class="pill btn" id="muteBtn" title="소리 끄기 / 켜기">🔊</button>
    <button class="pill btn" id="missionBtn" title="오늘의 미션">🎯 <span id="missionCount">0/4</span></button>
    <button class="pill btn" id="courseBtn" title="학습 코스">📅<span id="courseCount"></span></button>
    <button class="pill btn" id="stickerBtn" title="스티커 도감">🧸</button>
    <button class="pill btn" id="installBtn" title="홈 화면에 설치" style="display:none">⬇️ 설치</button>
    <button class="pill btn" id="parentBtn" title="부모님 설정">👨‍👩‍👧</button>
    <span class="pill" id="clock">--:--</span>
  </div>
</div>
<div id="desktop">
  <div id="greet">안녕! 오늘도 재미있게 놀아볼까요?</div>
  <div id="quick"></div>
  <div id="cats"></div>
  <div id="icons"></div>
</div>
<div id="taskbar">
  <button id="homeBtn" title="바탕화면 보기">🏠</button>
  <div id="tasks"></div>
  <div id="missionsBar"></div>
</div>
<div id="panels"></div>

<script>
  /* 서비스워커: 한 번 열어 두면 인터넷 없이도 실행된다 */
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* 실패해도 그냥 웹으로 돌아간다 */ });
    });
  }
</script>
<script src="shared/kid.js"></script>
<script src="shared/apps.js"></script>
<script src="shared/courses.js"></script>
<script>
(function () {
  var K = KidLab, el = K.el, esc = K.esc;
  var APPS = window.KIDLAB_APPS;
  var appById = {}; APPS.forEach(function (a) { appById[a.id] = a; });

  /* ---------- 막대 높이를 CSS 변수로 ---------- */
  function syncBars() {
    var tb = document.getElementById('topbar'), bb = document.getElementById('taskbar');
    document.documentElement.style.setProperty('--topbar-h', tb.offsetHeight + 'px');
    document.documentElement.style.setProperty('--taskbar-h', bb.offsetHeight + 'px');
  }
  syncBars();
  window.addEventListener('resize', syncBars);
  window.addEventListener('orientationchange', function () { setTimeout(syncBars, 200); });
  if (window.ResizeObserver) { var ro = new ResizeObserver(syncBars); ro.observe(document.getElementById('topbar')); ro.observe(document.getElementById('taskbar')); }

  /* ---------- 시계 ---------- */
  function tick() {
    var d = new Date(); var days = ['일', '월', '화', '수', '목', '금', '토'];
    var hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    document.getElementById('clock').textContent = innerWidth < 900 ? hm : (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + days[d.getDay()] + ') ' + hm;
  }
  tick(); setInterval(tick, 10000);

  /* ---------- 프로필 ---------- */
  var AVATARS = ['🐣', '🐶', '🐱', '🐻', '🐰', '🦊', '🐼', '🐨', '🦁', '🐯', '🐸', '🐵', '🦄', '🐬', '🦖', '🚀', '🌟', '🌈', '🍓', '🎈'];
  function renderTop() {
    var p = K.currentProfile(); if (!p) return;
    var d = K.data();
    document.querySelector('#profileBtn .av').textContent = p.avatar;
    document.querySelector('#profileBtn .nm').textContent = p.name;
    document.getElementById('starPill').textContent = '⭐ ' + d.stars;
    document.getElementById('streakPill').textContent = '🔥 ' + K.streak(d) + '일';
    if (checkCourse()) d = K.data();
    var cs = courseNow(d);
    document.getElementById('courseCount').textContent = !cs ? '' : cs.finished ? '수료' : cs.todayDone ? '✔' : cs.doneTasks + '/' + cs.tasks.length;
    var ms = K.missions(d); var done = ms.filter(function (m) { return m.done; }).length;
    document.getElementById('missionCount').textContent = done + '/' + ms.length;
    var h = new Date().getHours();
    var g = h < 11 ? '좋은 아침이에요' : h < 17 ? '안녕' : '좋은 저녁이에요';
    /* 인사는 한 줄만. 미션 수는 위 🎯 칸과 미션 카드가 보여 주므로 글로 되풀이하지 않고, 누르면 읽어 준다 */
    var gEl = document.getElementById('greet');
    gEl.textContent = g + ', ' + p.name + '! ' + (done === ms.length ? '🎉' : '🎯');
    gEl.dataset.say = g + ', ' + p.name + '! ' + (done === ms.length ? '오늘 미션을 모두 끝냈어요.' : '오늘 미션 ' + (ms.length - done) + '개가 기다리고 있어요.');
    document.getElementById('missionsBar').innerHTML = ms.map(function (m) { return '<span title="' + esc(m.label) + '">' + (m.done ? '✅' : icon(m)) + '</span>'; }).join('');
    var st = K.stampState();
    document.getElementById('stampPill').textContent = '🏅 ' + st.today;
    document.getElementById('stampPill').title = '오늘 도장 ' + st.today + '개 · 활동 ' + st.next + '개 더 하면 도장 1개';
    document.getElementById('muteBtn').textContent = K.muted() ? '🔇' : '🔊';
    renderQuick(d, ms);
    renderCats();
    renderIcons(d);
  }

  /* ---------- 이어서 하기 · 오늘의 추천 ----------
     아이콘 19개 중에서 고르는 것은 5세에게 부담이라 큰 카드 3~4장으로 먼저 보여 준다. */
  function renderQuick(d, ms) {
    var box = document.getElementById('quick'); box.innerHTML = '';
    var picks = [], seen = {};
    function add(app, tag) { if (!app || seen[app.id] || picks.length >= 4) return; seen[app.id] = 1; picks.push({ a: app, tag: tag }); }
    var cs = courseNow(d);
    if (cs && !cs.todayDone && !cs.finished) cs.tasks.filter(function (x) { return !x.done; }).slice(0, 1).forEach(function (x) { add(appById[x.app], '📅 오늘의 코스 · ' + x.where); });
    if (d.lastApp) add(appById[d.lastApp], '이어서 하기');
    ms.filter(function (m) { return !m.done; }).forEach(function (m) { add(appById[m.app], '오늘 미션'); });
    /* 틀린 문제가 남아 있는 앱을 먼저 권한다 */
    Object.keys(d.wrong || {}).forEach(function (k) {
      if ((d.wrong[k] || []).length) add(appById[k.split(':')[0]], '다시 풀어요');
    });
    var day = d.days[K.todayKey()] || { apps: {} };
    APPS.filter(function (a) { return !(day.apps && day.apps[a.id]); }).forEach(function (a) { add(a, '오늘 아직 안 했어요'); });
    picks.forEach(function (x) {
      var b = el('button', { class: 'quick-card', title: x.a.desc }, [
        el('div', { class: 'ic', html: icon(x.a), style: 'background:' + x.a.color }),
        el('div', {}, [el('div', { class: 'tag', text: x.tag }), el('div', { class: 'nm', text: x.a.name })])
      ]);
      b.addEventListener('click', function () { K.sfx.click(); openApp(x.a.id); });
      box.appendChild(b);
    });
  }

  /* 앱·미션 아이콘: 그림 파일(svg)이 있으면 그림, 없으면 이모지 */
  function icon(x) { return x && x.svg ? '<img class="svgic" src="' + x.svg + '" alt="">' : esc((x && x.icon) || ''); }

  /* 탭이 위에 붙었는지 표시 (바탕·그림자용), 인사를 누르면 읽어 주기 - 한 번만 건다 */
  (function () {
    var desk0 = document.getElementById('desktop');
    function markStuck() { document.getElementById('cats').classList.toggle('stuck', desk0.scrollTop > 0 && desk0.scrollTop >= catsTop() - 1); }
    desk0.addEventListener('scroll', markStuck, { passive: true }); addEventListener('resize', markStuck);
    document.getElementById('greet').addEventListener('click', function () { if (this.dataset.say) K.speak(this.dataset.say); });
  })();

  /* ---------- 과목 탭 ---------- */
  var CATS = ['전체', '한글', '읽기', '우리말', '한자·고전', '영어', '수학', '과학·사회', '생활', '디지털', '두뇌·놀이', '창작'];
  var CAT_ICON = { '한글': '✏️', '읽기': '📚', '우리말': '💬', '한자·고전': '📜', '영어': '🔤', '수학': '🔢', '과학·사회': '🔬', '생활': '🏠', '디지털': '💻', '두뇌·놀이': '🧩', '창작': '🎨' };
  var curCat = '전체';
  function catsTop() { var desk = document.getElementById('desktop'); return document.getElementById('quick').offsetTop + document.getElementById('quick').offsetHeight - desk.offsetTop; }
  function renderCats() {
    var box = document.getElementById('cats'), sl = box.scrollLeft; box.innerHTML = '';
    CATS.forEach(function (c) {
      var b = el('button', { text: c, class: c === curCat ? 'on' : '' });
      b.addEventListener('click', function () {
        curCat = c; K.sfx.click(); renderCats(); renderIcons();
        /* 내려가 있던 중에 탭을 바꾸면 새 목록의 처음부터 보이게 한다 */
        var desk = document.getElementById('desktop'), bx = document.getElementById('cats');
        if (bx.classList.contains('stuck')) desk.scrollTop += document.getElementById('icons').getBoundingClientRect().top - bx.getBoundingClientRect().bottom;
      });
      box.appendChild(b);
    });
    box.scrollLeft = sl;
  }
  function showProfilePicker(force) {
    var m = K.meta();
    var wrap = el('div', { class: 'overlay' });
    var panel = el('div', { class: 'panel' });
    if (m.profiles.length && !force) {
      panel.appendChild(el('h2', { text: '누구세요? 👋' }));
      var list = el('div', { class: 'profile-list' });
      m.profiles.forEach(function (p) {
        list.appendChild(el('button', { class: 'profile-card', onclick: function () { m.current = p.id; K.saveMeta(m); wrap.remove(); K.sfx.click(); K.speak(p.name + ', 안녕! 반가워요'); renderTop(); } }, [el('div', { class: 'av', text: p.avatar }), el('div', { text: p.name })]));
      });
      list.appendChild(el('button', { class: 'profile-card', onclick: function () { wrap.remove(); showNewProfile(); } }, [el('div', { class: 'av', text: '➕' }), el('div', { text: '새 친구' })]));
      panel.appendChild(list);
      wrap.appendChild(panel); document.getElementById('panels').appendChild(wrap);
    } else { showNewProfile(); }
  }
  function showNewProfile() {
    var wrap = el('div', { class: 'overlay' });
    var sel = '🐣';
    var panel = el('div', { class: 'panel' });
    panel.appendChild(el('h2', { text: '반가워요! 이름이 뭐예요? 🧸' }));
    var input = el('input', { type: 'text', placeholder: '이름을 써 주세요', maxlength: '10' });
    panel.appendChild(input);
    panel.appendChild(el('p', { text: '내 모습을 골라요', style: 'font-weight:800;margin:16px 0 8px' }));
    var av = el('div', { class: 'avatars' });
    AVATARS.forEach(function (a) { var b = el('button', { text: a, class: a === sel ? 'sel' : '' }); b.addEventListener('click', function () { sel = a; K.sfx.pop(); av.querySelectorAll('button').forEach(function (x) { x.classList.remove('sel'); }); b.classList.add('sel'); }); av.appendChild(b); });
    panel.appendChild(av);
    var row = el('div', { class: 'kl-row' });
    row.appendChild(el('button', { class: 'kl-btn primary big', text: '시작하기 🚀', onclick: function () {
      var name = input.value.trim() || '친구';
      var m = K.meta(); var p = { id: 'p' + Date.now(), name: name, avatar: sel, created: K.todayKey() };
      m.profiles.push(p); m.current = p.id; K.saveMeta(m);
      K.saveData(p.id, K.loadData(p.id));
      wrap.remove(); K.sfx.win(); K.speak(name + ', 반가워요! 같이 놀아요'); renderTop();
    } }));
    if (K.meta().profiles.length) row.appendChild(el('button', { class: 'kl-btn', text: '취소', onclick: function () { wrap.remove(); } }));
    panel.appendChild(row);
    wrap.appendChild(panel); document.getElementById('panels').appendChild(wrap);
    setTimeout(function () { input.focus(); }, 50);
  }

  /* ---------- 아이콘 ---------- */
  function renderIcons(d) {
    d = d || K.data();
    var day = d.days[K.todayKey()] || { apps: {} };
    var ms = K.missions(d);
    var box = document.getElementById('icons'); box.innerHTML = '';
    /* 전체 보기는 과목별로 제목을 달아 묶어 보여 준다 */
    var list = [];
    CATS.slice(1).forEach(function (c) {
      if (curCat !== '전체' && curCat !== c) return;
      var inCat = APPS.filter(function (a) { return a.cat === c; });
      if (!inCat.length) return;
      if (curCat === '전체') list.push({ head: c, n: inCat.length });
      list = list.concat(inCat);
    });
    list.forEach(function (a) {
      if (a.head) { box.appendChild(el('div', { class: 'cat-head', text: (CAT_ICON[a.head] || '') + ' ' + a.head + ' · ' + a.n })); return; }
      var mission = ms.filter(function (m) { return m.app === a.id && !m.done; })[0];
      var b = el('button', { class: 'app-icon', title: a.desc }, [
        el('div', { class: 'ic', html: icon(a), style: 'background:' + a.color }),
        el('div', { class: 'nm', text: a.name }),
        mission ? el('span', { class: 'badge', text: '미션' }) : null,
        day.apps && day.apps[a.id] ? el('span', { class: 'today', text: '✔', title: '오늘 했어요' }) : null
      ]);
      b.addEventListener('click', function () { K.sfx.click(); openApp(a.id); });
      box.appendChild(b);
    });
  }

  /* ---------- 창 관리 ---------- */
  /* 마우스로 가리키는 기기가 아니면(iPad·터치 PC 태블릿 모드) 손가락용 창으로 쓴다 */
  var TOUCH = navigator.maxTouchPoints > 0 && !(window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches);
  if (TOUCH) document.documentElement.classList.add('touch');
  var wins = {}; var zTop = 100;
  function openApp(id) {
    var a = appById[id]; if (!a) return;
    if (limitReached()) { showLimit(); return; }
    if (wins[id]) { focusWin(id); wins[id].el.classList.remove('min'); return; }
    var w = el('div', { class: 'win max focus' });
    var bar = el('div', { class: 'bar', style: 'background:' + darken(a.color) }, [
      el('span', { html: icon(a) + ' ' + esc(a.name) }),
      el('div', { class: 'ctl' }, [
        el('button', { text: '—', title: '최소화', onclick: function (e) { e.stopPropagation(); minWin(id); } }),
        el('button', { class: 'maxbtn', text: '▢', title: '창 크기', onclick: function (e) { e.stopPropagation(); toggleMax(id); } }),
        el('button', { class: 'close', text: '✕', title: '닫기', onclick: function (e) { e.stopPropagation(); closeWin(id); } })
      ])
    ]);
    var frame = el('iframe', { src: 'apps/' + id + '/index.html', title: a.name, allow: 'autoplay' });
    w.appendChild(bar); w.appendChild(frame);
    if (innerWidth > 760 && !TOUCH) { var off = Object.keys(wins).length * 30; w.style.left = (40 + off) + 'px'; w.style.top = (100 + off) + 'px'; w.style.width = '900px'; w.style.height = '620px'; }
    document.body.appendChild(w);
    wins[id] = { el: w, frame: frame, app: a };
    /* 이미 앞에 있는 창을 누를 때는 아무것도 다시 그리지 않는다.
       누르는 도중 작업줄을 새로 그리고 앱 창에 초점을 옮기면 iPad에서 탭(✕ 등)이 사라졌다 */
    w.addEventListener('pointerdown', function (e) { if (!w.classList.contains('focus')) focusWin(id, e.pointerType === 'touch'); });
    if (!TOUCH) drag(bar, w, id);
    renderTasks(); focusWin(id);
    K.speak(a.name + '. ' + (a.how || ''));
    if (a.how) K.toast(icon(a) + ' ' + esc(a.how), 3600);
  }
  function darken(hex) { var n = parseInt(hex.slice(1), 16); var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255; return 'rgb(' + Math.round(r * .72) + ',' + Math.round(g * .72) + ',' + Math.round(b * .72) + ')'; }
  function focusWin(id, noFrameFocus) { for (var k in wins) wins[k].el.classList.remove('focus'); if (wins[id]) { wins[id].el.classList.add('focus'); wins[id].el.style.zIndex = ++zTop; if (!noFrameFocus && !TOUCH) { try { wins[id].frame.focus(); } catch (e) { } } } renderTasks(); }
  function closeWin(id) { if (!wins[id]) return; wins[id].el.remove(); delete wins[id]; renderTasks(); renderTop(); K.sfx.click(); }
  function minWin(id) { wins[id].el.classList.add('min'); wins[id].el.classList.remove('focus'); renderTasks(); }
  function toggleMax(id) { wins[id].el.classList.toggle('max'); }
  function drag(handle, w, id) {
    var sx, sy, ox, oy, dragging = false;
    handle.addEventListener('pointerdown', function (e) {
      if (e.target.tagName === 'BUTTON') return;
      if (w.classList.contains('max')) return;
      dragging = true; sx = e.clientX; sy = e.clientY; ox = w.offsetLeft; oy = w.offsetTop; handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener('pointermove', function (e) { if (!dragging) return; w.style.left = Math.max(0, ox + e.clientX - sx) + 'px'; w.style.top = Math.max(64, oy + e.clientY - sy) + 'px'; });
    handle.addEventListener('pointerup', function () { dragging = false; });
    handle.addEventListener('dblclick', function () { toggleMax(id); });
  }
  function renderTasks() {
    var t = document.getElementById('tasks'); t.innerHTML = '';
    for (var id in wins) (function (id) {
      var w = wins[id];
      var b = el('button', { class: 'task' + (w.el.classList.contains('focus') && !w.el.classList.contains('min') ? ' active' : '') }, [
        el('span', { html: icon(w.app) + ' ' + esc(w.app.name) }),
        el('span', { class: 'x', text: '✕', onclick: function (e) { e.stopPropagation(); closeWin(id); } })
      ]);
      b.addEventListener('click', function () { if (w.el.classList.contains('min')) { w.el.classList.remove('min'); focusWin(id); } else if (w.el.classList.contains('focus')) { minWin(id); } else focusWin(id); });
      t.appendChild(b);
    })(id);
  }
  document.getElementById('homeBtn').addEventListener('click', function () { K.sfx.click(); for (var k in wins) minWin(k); });

  /* 앱에서 오는 메시지 */
  window.addEventListener('message', function (e) {
    var m = e.data; if (!m || m.type !== 'kidlab') return;
    if (m.action === 'update' || m.action === 'star' || m.action === 'mission') renderTop();
    if (m.action === 'close') { for (var id in wins) if (wins[id].frame.contentWindow === e.source) closeWin(id); }
    if (m.action === 'open' && m.payload && m.payload.app) openApp(m.payload.app);
    if (m.action === 'mission' && m.payload) { m.payload.forEach(function (x) { K.toast('🎯 미션 완료! ' + x.label + ' (+3⭐)'); }); K.sfx.win(); }
  });
  window.addEventListener('storage', renderTop);

  /* ---------- 미션 패널 ---------- */
  function showMissions() {
    var ms = K.missions();
    var wrap = el('div', { class: 'overlay' }); var panel = el('div', { class: 'panel' });
    panel.appendChild(el('button', { class: 'close', text: '✕', onclick: function () { wrap.remove(); } }));
    panel.appendChild(el('h2', { text: '🎯 오늘의 미션' }));
    panel.appendChild(el('p', { text: '미션을 끝내면 별 3개를 받아요! 매일 새로운 미션이 나와요.', style: 'color:#777;margin-top:-8px' }));
    ms.forEach(function (m) {
      var a = appById[m.app];
      panel.appendChild(el('div', { class: 'mission' + (m.done ? ' done' : '') }, [
        el('div', { class: 'ic', html: m.done ? '✅' : icon(m) }),
        el('div', { class: 'lb' }, [el('div', { text: m.label }), el('div', { class: 'bar' }, el('i', { style: 'width:' + Math.round(m.cur / m.n * 100) + '%' })), el('div', { text: m.cur + ' / ' + m.n, style: 'font-size:15px;color:#777;font-weight:600' })]),
        m.done ? el('span', { text: '+3⭐', style: 'font-weight:900;color:#b07a00' }) : el('button', { class: 'go', html: icon(a) + ' 하러 가기', onclick: function () { wrap.remove(); openApp(m.app); } })
      ]));
    });
    wrap.appendChild(panel); document.getElementById('panels').appendChild(wrap);
    K.speak('오늘의 미션이에요');
  }


  /* ---------- 학습 코스 ----------
     d.course = { id, start, done: [완료한 날짜...] }. done의 길이가 곧 지금 몇째 날인지다.
     그날 할 일을 모두 하면(앱이 낸 오늘 이벤트로 판단) 하루가 끝나고, 다음 날 할 일은 이튿날 열린다. */
  var COURSES = (window.KIDLAB_COURSES || { list: [], types: [] });
  function courseById(id) { return COURSES.list.filter(function (c) { return c.id === id; })[0]; }
  function courseDays(c) { var out = []; c.weeks.forEach(function (w, wi) { w.days.forEach(function (dd, di) { out.push({ week: wi, title: w.title, day: di, tasks: dd }); }); }); return out; }
  function courseNow(d) {
    d = d || K.data();
    if (!d.course) return null;
    var c = courseById(d.course.id); if (!c) return null;
    var days = courseDays(c), done = d.course.done || [], today = K.todayKey();
    var todayDone = done.length > 0 && done[done.length - 1] === today;
    var finished = done.length >= days.length;
    var idx = Math.min(todayDone ? done.length - 1 : done.length, days.length - 1);

    var wrongTotal = 0; for (var wk in (d.wrong || {})) wrongTotal += (d.wrong[wk] || []).length;
    panel.appendChild(el('div', { class: 'toggle' }, [el('span', { text: '🔁 다시 풀 문제 ' + wrongTotal + '개' }),
      el('button', { text: '비우기', onclick: function (e) { K.mutate(function (dd) { dd.wrong = {}; }); e.target.textContent = '비웠어요'; } })]));
    panel.appendChild(el('div', { class: 'toggle' }, [el('span', { text: '👤 프로필 바꾸기 / 새 친구' }), el('button', { text: '열기', onclick: function () { wrap.remove(); showProfilePicker(); } })]));
    panel.appendChild(el('div', { class: 'toggle' }, [el('span', { text: '💾 이 친구 데이터 내보내기 (백업)' }), el('button', { text: '다운로드', onclick: function () { var blob = new Blob([JSON.stringify({ profile: p, data: d }, null, 2)], { type: 'application/json' }); var a = el('a', { href: URL.createObjectURL(blob), download: 'kidlab-' + p.name + '-' + K.todayKey() + '.json' }); document.body.appendChild(a); a.click(); a.remove(); } })]));
    /* 내보낸 파일을 되돌린다. 기기를 바꿀 때 기록을 살리는 유일한 길이다. */
    var fileIn = el('input', { type: 'file', accept: 'application/json,.json', style: 'display:none' });
    fileIn.addEventListener('change', function () {
      var f = fileIn.files && fileIn.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var obj = JSON.parse(rd.result);
          if (!obj || !obj.profile || !obj.data || typeof obj.data.stars !== 'number') throw new Error('형식');
          var mm = K.meta();
          var exists = mm.profiles.filter(function (x) { return x.id === obj.profile.id; })[0];
          if (exists && !confirm(obj.profile.name + ' 기록을 덮어쓸까요?')) return;
          if (!exists) mm.profiles.push(obj.profile);
          mm.current = obj.profile.id; K.saveMeta(mm);
          K.saveData(obj.profile.id, obj.data);
          alert(obj.profile.name + ' 기록을 되살렸어요.');
          location.reload();
        } catch (err) { alert('이 파일은 키즈랩 백업이 아니에요.'); }
      };
      rd.readAsText(f);
    });
    panel.appendChild(fileIn);
    panel.appendChild(el('div', { class: 'toggle' }, [el('span', { text: '📥 백업 파일에서 되살리기' }),
      el('button', { text: '파일 고르기', onclick: function () { fileIn.click(); } })]));
    panel.appendChild(el('div', { class: 'toggle' }, [el('span', { text: '🗑️ 이 친구 데이터 모두 지우기' }), el('button', { text: '지우기', style: 'background:#ff595e;color:#fff', onclick: function () { if (confirm(p.name + '의 모든 기록을 지울까요? 되돌릴 수 없어요.')) { localStorage.removeItem('kidlab.p.' + p.id); m.profiles = m.profiles.filter(function (x) { return x.id !== p.id; }); m.current = m.profiles.length ? m.profiles[0].id : null; K.saveMeta(m); wrap.remove(); location.reload(); } } })]));
    /* 기록 전체 삭제: 모든 친구의 기록과 설정(kidlab. 로 시작하는 키만). dibrain.dev 의 다른 앱 기록은 건드리지 않는다. 보호자 화면에만 둔다. */
    panel.appendChild(el('div', { class: 'toggle' }, [el('span', { text: '🗑️ 기록 전체 삭제 (모든 친구)' }), el('button', { text: '모두 지우기', style: 'background:#ff595e;color:#fff', onclick: function () { if (!confirm('키즈랩에 저장된 모든 친구의 기록과 설정을 지웁니다. 되돌릴 수 없어요. 계속할까요?')) return; try { var ks = []; for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('kidlab.') === 0) ks.push(k); } ks.forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {} location.reload(); } })]));
    panel.appendChild(el('p', { style: 'color:#5e5e5e;font-size:16px;margin-top:16px', html: '💡 모든 기록은 이 컴퓨터의 브라우저(localStorage)에만 저장돼요. 서버로 보내지 않아요.<br>키보드: <b>Esc</b> = 앱 닫기, 미로/코딩은 <b>방향키</b> 사용 가능.' }));
    /* 운영자 사이트 첫 화면 링크는 보호자만 보는 이 화면에만 둔다 (첫 화면에는 광고·어른용 도구가 있다) */
    panel.appendChild(el('p', { style: 'font-size:16px;margin:8px 0 0;color:var(--db-sub)', html: '<a href="https://dibrain.dev/" rel="noopener" style="display:inline-block;padding:10px 0;font-weight:800;color:var(--db-text)">DigitalBrain 첫 화면</a> · 키즈랩 밖으로 나가요' }));
    wrap.appendChild(panel); document.getElementById('panels').appendChild(wrap);
  }

  /* 설치 안내 */
  var deferredPrompt = null;
  var installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferredPrompt = e; installBtn.style.display = '';
  });
  installBtn.addEventListener('click', function () {
    if (!deferredPrompt) return;
    K.sfx.click(); deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function (r) {
      if (r.outcome === 'accepted') { installBtn.style.display = 'none'; K.toast('홈 화면에 키즈랩을 담았어요 🧸'); }
      deferredPrompt = null;
    });
  });
  window.addEventListener('appinstalled', function () { installBtn.style.display = 'none'; });

  document.getElementById('profileBtn').addEventListener('click', function () { K.sfx.click(); showProfilePicker(); });
  document.getElementById('missionBtn').addEventListener('click', function () { K.sfx.click(); showMissions(); });
  document.getElementById('courseBtn').addEventListener('click', function () { K.sfx.click(); showCourses(); });
  document.getElementById('stickerBtn').addEventListener('click', function () { K.sfx.click(); showStickers(); });
  document.getElementById('parentBtn').addEventListener('click', function () { K.sfx.click(); showParent(); });
  /* ---------- 사용 시간 · 휴식 알림 ----------
     화면을 보고 있는 동안만 20초씩 더한다. 부모가 정한 시간을 넘으면 잠긴다. */
  var TICK = 20, sinceBreak = 0, bypass = false;
  setInterval(function () {
    if (document.hidden) return;
    K.addUsage(TICK);
    var st = K.meta().settings;
    sinceBreak += TICK;
    if (st.breakMin && sinceBreak >= st.breakMin * 60) {
      sinceBreak = 0;
      K.toast('👀 잠깐 눈을 쉬어요. 먼 곳을 20초 바라보기!', 5000);
      K.speak('잠깐 눈을 쉬어요. 먼 곳을 바라봐요');
    }
    checkLimit();
    renderTop();
  }, TICK * 1000);
  function limitReached() {
    var lim = K.meta().settings.limitMin;
    return !!lim && !bypass && K.usageToday() >= lim;
  }
  function checkLimit() { if (limitReached() && !document.getElementById('limitLock')) showLimit(); }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkLimit(); });
  function showLimit() {
    for (var k in wins) closeWin(k);
    var wrap = el('div', { class: 'overlay', id: 'limitLock' });
    var panel = el('div', { class: 'panel' });
    panel.appendChild(el('h2', { text: '⏰ 오늘은 여기까지!' }));
    panel.appendChild(el('p', { text: '오늘 ' + K.usageToday() + '분 놀았어요. 내일 또 만나요! 👋' }));
    var a = K.randInt(3, 9), b = K.randInt(3, 9);
    panel.appendChild(el('p', { text: '부모님이 더 하게 해 주려면: ' + a + ' × ' + b + ' = ?' }));
    var input = el('input', { type: 'text', inputmode: 'numeric', placeholder: '답' });
    panel.appendChild(input);
    panel.appendChild(el('div', { class: 'kl-row' }, el('button', { class: 'kl-btn primary', text: '더 하기', onclick: function () {
      if (parseInt(input.value, 10) === a * b) { bypass = true; wrap.remove(); K.toast('10분 더 할 수 있어요'); setTimeout(function () { bypass = false; }, 10 * 60 * 1000); }
      else { K.sfx.wrong(); input.value = ''; }
    } })));
    wrap.appendChild(panel); document.getElementById('panels').appendChild(wrap);
    K.speak('오늘은 여기까지예요. 내일 또 만나요');
  }
  checkLimit();

  /* ---------- 도장판 (아이용 짧은 목표) ---------- */
  document.getElementById('stampPill').addEventListener('click', function () {
    K.sfx.click();
    var st = K.stampState();
    var wrap = el('div', { class: 'overlay' }); var panel = el('div', { class: 'panel' });
    panel.appendChild(el('button', { class: 'close', text: '✕', onclick: function () { wrap.remove(); } }));
    panel.appendChild(el('h2', { text: '🏅 오늘의 도장판' }));
    panel.appendChild(el('p', { text: '놀이를 ' + st.per + '개 하면 도장 1개! 도장 1개마다 별 2개를 받아요.' }));
    var board = el('div', { style: 'display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:10px 0' });
    for (var i = 0; i < st.goal; i++) {
      board.appendChild(el('div', {
        text: i < st.today ? '🏅' : '⬜',
        style: 'font-size:38px;text-align:center;background:#fff;border-radius:16px;padding:6px 0'
      }));
    }
    panel.appendChild(board);
    panel.appendChild(el('p', { text: st.today >= st.goal ? '와! 오늘 도장판을 다 채웠어요 🎉' : (st.next + '개만 더 하면 도장을 받아요!') , style: 'font-weight:800' }));
    panel.appendChild(el('p', { text: '지금까지 모은 도장: ' + st.total + '개', style: 'color:#5e5e5e' }));
    wrap.appendChild(panel); document.getElementById('panels').appendChild(wrap);
    K.speak(st.today >= st.goal ? '오늘 도장판을 다 채웠어요' : st.next + '개만 더 하면 도장을 받아요');
  });

  document.getElementById('muteBtn').addEventListener('click', function () {
    var on = K.toggleMute();
    document.getElementById('muteBtn').textContent = on ? '🔇' : '🔊';
    K.toast(on ? '🔇 소리를 껐어요' : '🔊 소리를 켰어요');
    if (!on) K.sfx.click();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { var ov = document.querySelector('.overlay'); if (ov && ov.querySelector('.close')) ov.remove(); } });

  /* ---------- 뒤로 가기 (휴대폰 가장자리 밀기·뒤로 단추) ----------
     앱 창을 열어도 주소가 바뀌지 않아서, 뒤로 가기를 하면 키즈랩 밖으로 나가 버렸다.
     기록을 한 칸 쌓아 두고, 뒤로 가기가 오면 가장 위에 열린 것을 한 단계씩 닫는다.
     1) 창 안의 작은 창(글 다시 보기 등)  2) 앱 안의 "◀ 뒤로"  3) 앱 창  4) 설정·미션 같은 창
     바탕화면에서는 한 번 더 밀어야 나간다. */
  function topWin() {
    var best = null, z = -1;
    for (var k in wins) { var w = wins[k]; if (w.el.classList.contains('min')) continue; var zi = +w.el.style.zIndex || 0; if (zi > z) { z = zi; best = k; } }
    return best;
  }
  function visible(elm) { return !!(elm && elm.offsetParent !== null && elm.getClientRects().length); }
  function backInApp(id) {
    var doc; try { doc = wins[id].frame.contentDocument; } catch (e) { return false; }
    if (!doc) return false;
    var pop = doc.querySelector('.peek-panel');
    if (pop) { pop.remove(); return true; }
    var backs = Array.prototype.filter.call(doc.querySelectorAll('.kl-back'), visible);
    if (backs.length) { backs[backs.length - 1].click(); return true; }
    return false;
  }
  var exitArmed = 0;
  function guard() { try { history.pushState({ kidlab: 'guard' }, '', location.href); } catch (e) { } }
  try { history.replaceState({ kidlab: 'home' }, '', location.href); } catch (e) { }
  guard();
  window.addEventListener('popstate', function () {
    var ov = document.querySelectorAll('.overlay');
    var lastOv = ov[ov.length - 1];
    var id = topWin();
    if (lastOv && lastOv.querySelector('.close')) { lastOv.remove(); guard(); return; }
    if (lastOv) { guard(); return; }   /* 이름 고르기·사용 시간 잠금 창은 닫지 않는다 */
    if (id) { if (!backInApp(id)) closeWin(id); guard(); return; }
    if (Date.now() - exitArmed < 2500) { history.back(); return; }
    exitArmed = Date.now(); guard();
    K.toast('👋 한 번 더 밀면 키즈랩을 나가요', 2200);
  });

  /* ---------- 시작 ---------- */
  if (!K.currentProfile()) showProfilePicker(); else { renderTop(); }
  K.mutate(function (d) { K.dayRec(d); });
  renderTop();
  K.checkMissions();
})();
</script>
</body>
</html>
